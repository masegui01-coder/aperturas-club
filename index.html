6, llega la jugada clave del gambito.","El caballo negro defiende e4. Sin esta jugada, Cxe4 recuperaría el peón con buen centro.","f3 ofrece un segundo peón: si el rival toma, la columna f se abre y nuestro desarrollo será enorme.","El rival acepta el gambito. Está un peón arriba, pero nosotros vamos a desarrollar todas las piezas muy deprisa.","Recapturamos con el caballo, que se desarrolla, controla e5 y g5 y prepara Ac4 u Ad3 con el enroque.","Defensa Gunderam: el alfil sale activo a f5, pero será un blanco para nuestros peones.","Ce5 prepara g4 para atacar el alfil con tiempo y libera la diagonal de nuestra dama hacia h5 y f3.","El rival abre la diagonal de su alfil de f8 y da al alfil de f5 una casilla de retirada.","g4 ataca el alfil de f5 y gana espacio en el flanco de rey.","El alfil se retira a g6, donde lo perseguimos con h4-h5.","h4 amenaza h5, que echaría al alfil de g6 y abriría la columna h.","El rival clava nuestro caballo de c3 y prepara ...Ae4 ante h5.","h5 obliga al alfil a abandonar g6 y gana espacio para el ataque.","El alfil va a e4, desde donde ataca la torre de h1 y presiona c2.","La torre sale por la tercera fila con tiempo: amenaza Te3 contra el alfil de e4."]},{"id":"vienes","name":"Rehusado, Defensa Vienesa (4...Af5)","moves":"d4 d5 e4 dxe4 Nc3 Nf6 f3 Bf5 g4 Bg6 g5 Nd5 fxe4 Nxc3 bxc3 Bxe4 Nf3","idea":"El rival no toma en f3 y defiende con ...Af5; con g4-g5 ganamos tiempos y recuperamos el centro a cambio de un peón.","notes":["Abrimos con d4. Nuestro plan es entregar el peón de e para conseguir un desarrollo rapidísimo y la columna f abierta.","El rival responde con ...d5 y ocupa el centro, como en un Gambito de Dama.","Gambito Blackmar-Diemer: e4 ofrece un peón. Si el rival no lo toma, exd5 o e5 nos dejan una buena Francesa o Escandinava.","El rival acepta el peón. Ahora su peón de e4 quedará muy expuesto a nuestras piezas.","El caballo ataca el peón de e4 y se desarrolla con tiempo. Si ...Cf6, llega la jugada clave del gambito.","El caballo negro defiende e4. Sin esta jugada, Cxe4 recuperaría el peón con buen centro.","f3 ataca el peón de e4 y ofrece el gambito para abrir la columna f.","Defensa Vienesa: el rival no acepta y defiende e4 con el alfil.","g4 ataca el alfil de f5 y gana espacio en el flanco de rey.","El alfil se retira a g6, sin dejar de defender e4.","g5 echa al caballo de f6, que era el defensor principal de e4.","El caballo salta a d5 y ataca nuestro caballo de c3.","Recuperamos el peón de e4 y abrimos la columna f para nuestras torres.","El rival cambia caballos y nos dobla los peones del flanco de dama.","Recapturamos hacia el centro: el peón de c3 refuerza d4.","El alfil toma en e4 y ataca la torre de h1 por la diagonal abierta.","El caballo tapa la diagonal y se desarrolla: tenemos piezas activas a cambio del peón."]}]},{"id":"ataque-150","name":"Ataque 150","side":"w","eco":"B07–B09 / B06","group":"1.e4","blurb":"Contra la Pirc y la Moderna: Be3, Qd2, f3 y enroque largo para cambiar el alfil de g7 con Bh6 y atacar con h4-h5.","lines":[{"id":"pirc-c6","name":"Contra la Pirc con ...c6 y ...b5","moves":"e4 d6 d4 Nf6 Nc3 g6 Be3 c6 Qd2 b5 f3 Nbd7 Nh3 Nb6 Bd3 Bg7 Nf2 O-O O-O-O","idea":"Nh3-f2 apoya g4 y deja libre el peón f; enroque largo y ataque en el flanco de rey."},{"id":"pirc-enroque","name":"Contra la Pirc con enroque corto negro","moves":"e4 d6 d4 Nf6 Nc3 g6 Be3 Bg7 Qd2 O-O O-O-O c6 f3 b5 h4 h5 Bh6","idea":"El plan clásico: cambiar el alfil de g7 con Bh6 y abrir la columna h."},{"id":"pirc-e5","name":"Contra la Pirc con ...e5","moves":"e4 d6 d4 Nf6 Nc3 g6 Be3 e5 dxe5 dxe5 Qxd8+ Kxd8 O-O-O+ Bd7 Nf3","idea":"Cambio de damas: el rey negro no puede enrocar y las blancas tienen mejor desarrollo."},{"id":"pirc-ng4","name":"Contra la Pirc con ...Ng4","moves":"e4 d6 d4 Nf6 Nc3 g6 Be3 Ng4 Bg5 h6 Bh4 Bg7 h3 Nf6 f4","idea":"Si el caballo ataca al alfil, Bg5-h4 y h3 lo echan; luego f4 gana espacio."},{"id":"moderna-b5","name":"Contra la Moderna con ...a6 y ...b5","moves":"e4 g6 d4 Bg7 Nc3 d6 Be3 a6 Qd2 Nd7 f3 b5 h4 h5 Nh3 Bb7 Ng5","idea":"h4 frena el flanco de rey negro; el caballo llega a g5 vía h3."},{"id":"moderna-d5","name":"Contra la Moderna con ...c6 y ...d5","moves":"e4 g6 d4 Bg7 Nc3 c6 Be3 d5 Qd2 dxe4 Nxe4 Nf6 Nxf6+ Bxf6 Bd3","idea":"Tras los cambios en e4, las blancas se desarrollan con ventaja de espacio."}]},{"id":"siciliana","name":"Defensa Siciliana","side":"b","eco":"B20–B99","group":"1.e4","blurb":"1...c5: la respuesta más combativa a 1.e4. Desequilibrio y contrajuego en el flanco de dama.","lines":[{"id":"najdorf","name":"Najdorf, Ataque Inglés","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3 Be7 Qd2 O-O O-O-O Nbd7 g4 b5","idea":"...a6 controla b5 y prepara ...e5 o ...b5. Contra el Ataque Inglés, ...e5 y ...Ae6 frenan el centro y la carrera de peones en el flanco de dama decide; el sueño es la ruptura ...d5.","notes":["Las blancas ocupan el centro con el peón de rey y abren líneas para la dama y el alfil de f1.","Respondemos con c5: controlamos d4 desde el flanco y creamos un desequilibrio desde la primera jugada.","El caballo blanco se desarrolla hacia el centro y prepara d4 para abrir el juego.","Con d6 controlamos e5 y abrimos la diagonal del alfil de c8; es la base de la Najdorf y del Dragón.","Las blancas rompen en el centro: quieren abrir líneas y aprovechar su ventaja de desarrollo.","Cambiamos con cxd4: entregamos un peón lateral por uno central y abrimos la columna c para nuestras torres.","Las blancas recuperan con el caballo, que queda centralizado en d4 pero será un blanco para nuestras piezas.","Cf6 ataca el peón de e4 y obliga a las blancas a defenderlo con el caballo de b1 en lugar de jugar c4.","Cc3 defiende e4 y desarrolla. Ya tenemos la típica Siciliana Abierta.","La jugada Najdorf: a6 quita la casilla b5 a caballos y alfiles blancos y prepara ...e5 o ...b5.","Ae3 es el Ataque Inglés: las blancas planean f3, Dd2, O-O-O y lanzar los peones g4-g5 contra nuestro rey.","Con e5 echamos al caballo de d4 y ganamos espacio. A cambio la casilla d5 queda débil: tendremos que vigilarla.","El caballo se retira a b3, desde donde sigue mirando c5, d4 y a5 y no estorba a los peones blancos.","Ae6 controla d5 y prepara la ruptura ...d5. Si las blancas tardan, liberaremos el juego con ella.","f3 sujeta el peón de e4, evita ...Cg4 contra el alfil de e3 y prepara el avance g4.","Ae7 completa el desarrollo del flanco de rey para poder enrocar cuanto antes.","Dd2 conecta las torres y prepara el enroque largo; más tarde Ah6 podría ser una idea.","Enrocamos corto: el rey queda a salvo y la torre de f8 puede apoyar futuras rupturas en el centro.","Las blancas enrocan largo: empieza la carrera, ellas atacan con peones en el flanco de rey y nosotros en el de dama.","Cbd7 refuerza f6 y e5 y deja libre la columna c; este caballo puede ir a b6 para vigilar d5 y saltar a c4.","g4 amenaza g5 para echar al caballo de f6 y debilitar nuestro control de la casilla d5.","b5 lanza nuestro ataque: amenazamos ...b4 echando al caballo de c3 para ganar e4 o atacar al rey blanco."]},{"id":"najdorf-bg5","name":"Najdorf, Variante Principal (6.Bg5)","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Be7 Qf3 Qc7 O-O-O Nbd7 g4 b5 Bxf6 Nxf6 g5 Nd7 f5 Nc5","idea":"Contra 6.Ag5 jugamos ...e6 para reforzar el centro y poder desclavar. Las blancas atacan con peones en el flanco de rey; nosotros contraatacamos con ...b5-b4 y el caballo en c5 presionando e4.","notes":["Las blancas abren con 1.e4: ocupan el centro y liberan la dama y el alfil de f1.","c5: la Siciliana. Peleamos por d4 desde el flanco y creamos un desequilibrio desde la primera jugada.","Cf3 desarrolla el caballo hacia el centro y prepara la ruptura d4.","d6 vigila e5 y prepara ...Cf6 sin miedo a que el peón de e4 avance y lo eche.","Las blancas rompen en el centro con d4 para abrir líneas y aprovechar su ventaja de desarrollo.","Cambiamos en d4: damos un peón lateral por uno central y abrimos la columna c para nuestras torres.","El caballo recupera el peón en d4 y queda centralizado, aunque será un blanco para nuestras piezas.","Cf6 ataca el peón de e4 y obliga a las blancas a defenderlo, normalmente con Cc3.","Cc3 defiende e4 y desarrolla. Ya estamos en la típica Siciliana Abierta.","a6, la Najdorf: controlamos b5 y preparamos ...b5 o ...e5 según lo que haga el rival.","Ag5 es la línea más agresiva: clava el caballo de f6 contra la dama y prepara f4 con ataque directo.","e6 refuerza d5 y libera e7 para el alfil; así, si Axf6, recapturamos sin estropear el centro.","f4 amenaza e5, que atacaría al caballo clavado, y prepara avanzar los peones del flanco de rey.","Ae7 desclava el caballo de f6 y prepara el enroque; ya no hay que temer tanto al avance e5.","Df3 apoya el peón de e4 y el futuro avance g4, y prepara el enroque largo.","Dc7 controla e5 y la columna c, y prepara ...Cbd7 y ...b5. Cuidado con e5 en el momento oportuno.","Las blancas enrocan largo y apuntan la torre de d1 al peón débil de d6.","Cbd7 defiende f6 y vigila e5 y c5; es el desarrollo típico de esta línea.","g4 prepara g5 para echar al caballo de f6 y abrir líneas contra nuestro rey.","b5: no perdemos tiempo y empezamos nuestro ataque; ...b4 echará al caballo de c3, que defiende e4.","Las blancas cambian el alfil por el caballo para poder avanzar g5 sin perder tiempo.","Recuperamos con el caballo de d7: así sigue mirando e4 y d5 y nuestra estructura queda intacta.","g5 echa al caballo de f6, que tendrá que retirarse otra vez a d7 camino de c5.","Cd7 prepara ...Cc5 y ...b4. No hay prisa por enrocar: el rey está más seguro en el centro por ahora.","f5 presiona e6 y prepara f6 o fxe6 para abrir líneas contra nuestro rey.","Cc5 ataca e4 y prepara ...b4. Es una carrera de ataques en la que nuestro contrajuego es muy real."]},{"id":"najdorf-be2","name":"Najdorf, Variante Clásica (6.Be2)","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be2 e5 Nb3 Be7 O-O O-O Be3 Be6 Qd2 Nbd7 a4 Rc8","idea":"Contra la línea tranquila 6.Ae2 jugamos ...e5 y ...Ae6: desarrollo sencillo y presión por la columna c. El objetivo estratégico es la ruptura ...d5.","notes":["Las blancas empiezan con el peón de rey, controlando d5 y f5 y abriendo líneas a sus piezas.","Respondemos con la Siciliana: c5 controla d4 sin dar simetría y prepara la columna c semiabierta.","El caballo de rey sale a f3: es el desarrollo más natural y prepara d4 para abrir el juego.","d6 prepara ...Cf6 y abre la diagonal del alfil de c8.","d4 abre el centro: las blancas buscan actividad rápida para sus piezas.","cxd4: nos quedamos con dos peones centrales contra uno y la columna c semiabierta.","Las blancas recuperan con el caballo, que ocupa la casilla central d4.","Atacamos e4 con el caballo: así las blancas no tienen tiempo para jugar c4 y montar un bind.","Las blancas protegen e4 con el caballo, que además vigila d5 y b5.","a6: la Najdorf, que controla b5 y deja abiertas varias ideas como ...e5 o ...b5.","Ae2 es la Variante Clásica: las blancas buscan un juego posicional con enroque corto.","e5 echa al caballo y gana espacio central. Contra un plan tranquilo, la debilidad de d5 es menos peligrosa.","El caballo va a b3; desde allí vigila d4 y c5 y evita que lo cambiemos fácilmente.","Ae7 desarrolla el alfil y prepara el enroque corto.","Las blancas enrocan corto y ponen su rey a salvo antes de abrir el juego.","Enrocamos también: el rey está seguro y la lucha será estratégica, por la casilla d5.","Ae3 controla c5 y b6 y prepara Dd2 para conectar las torres.","Ae6 vigila d5 y c4, casillas clave. Con el tiempo querremos jugar ...d5 para liberarnos.","Dd2 conecta las torres y prepara Tfd1 para presionar d6, nuestro peón retrasado.","Cbd7 refuerza f6 y e5 y deja libre la columna c para la torre de a8.","a4 frena nuestro avance ...b5 y gana espacio en el flanco de dama, pero debilita b4.","Tc8 ocupa la columna c y presiona c3 y c2. Con ...Db8 y ...b5 o ...d5 tendremos un juego cómodo."]},{"id":"dragon","name":"Dragón, Ataque Yugoslavo","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be3 Bg7 f3 O-O Qd2 Nc6 Bc4 Bd7 O-O-O Rc8 Bb3 Ne5 h4 h5","idea":"Enroques opuestos: el alfil de g7 y la columna c son las armas negras. La Variante Soltis (...h5) frena el ataque h4-h5 de las blancas.","notes":["1.e4, la jugada más popular: las blancas toman el centro y preparan un desarrollo rápido.","c5 es la defensa más combativa contra 1.e4: luchamos por el centro con un peón lateral.","Cf3 controla d4 y e5 y deja preparado el avance d4.","d6 controla e5 y prepara ...Cf6 y el fianchetto con ...g6.","Con d4 las blancas entran en la Siciliana Abierta, la línea más ambiciosa.","Capturamos en d4; a cambio del peón de c, ganamos la columna c y una mayoría central.","Cxd4 recupera el material; el caballo es fuerte en d4 pero puede ser atacado con ...Cc6 o ...e5.","Cf6 desarrolla con tiempo, atacando el peón de e4.","Cc3 es la defensa natural del peón de e4 y aumenta el control sobre d5.","g6: el Dragón. El alfil irá a g7 y apuntará por la gran diagonal hacia d4, c3 y b2.","Ae3 prepara el Ataque Yugoslavo: f3, Dd2, O-O-O y el avance h4-h5 contra nuestro rey.","Ag7 completa el fianchetto; este alfil es nuestra mejor pieza y no debemos cambiarlo a la ligera.","f3 evita ...Cg4, que atacaría al alfil de e3, y prepara el avance g4.","Enrocamos corto: el rey queda protegido por el alfil de g7 y los peones f7, g6 y h7.","Dd2 prepara el enroque largo y la idea Ah6 para cambiar nuestro valioso alfil de g7.","Cc6 presiona el caballo de d4 y prepara ...Ce5 hacia la casilla c4.","Ac4 controla d5 e impide ...d5. También mira f7, así que hay que vigilar las combinaciones.","Ad7 conecta las torres y prepara ...Tc8 y ...Ce5, el plan clásico del Dragón.","Enroque largo: comienza la carrera de ataques en flancos opuestos. Cada tiempo cuenta.","Tc8 ocupa la columna c, nuestra autopista hacia el rey blanco; el sacrificio ...Txc3 es una idea típica.","Ab3 aparta el alfil de la columna c para que no lo ataquemos con tiempo.","Ce5 apunta a c4 y f3. Desde c4 el caballo atacará la dama de d2 y el alfil de e3.","h4 amenaza h5 para abrir la columna h y dar mate por h7.","h5: la Soltis. Frenamos el avance h5; si g4, ...hxg4 y la columna h no se abre tan rápido."]},{"id":"dragon-acelerado","name":"Dragón Acelerado, Bind de Maroczy (5.c4)","moves":"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 c4 Nf6 Nc3 d6 Be2 Nxd4 Qxd4 Bg7 Be3 O-O Qd2 Be6 O-O Qa5 Rac1 Rfc8 b3 a6","idea":"Sin ...d6 temprano evitamos el Ataque Yugoslavo. Si las blancas montan el Bind de Maroczy (c4-e4), cambiamos caballos, ponemos la dama en a5 y preparamos ...b5.","notes":["Las blancas empiezan con el peón de rey, controlando d5 y f5 y abriendo líneas a sus piezas.","Respondemos con la Siciliana: c5 controla d4 sin dar simetría y prepara la columna c semiabierta.","El caballo de rey sale a f3: es el desarrollo más natural y prepara d4 para abrir el juego.","Cc6 presiona d4 y deja abierta la posibilidad de ...g6 sin necesidad de ...d6.","d4 abre el centro: las blancas buscan actividad rápida para sus piezas.","cxd4: nos quedamos con dos peones centrales contra uno y la columna c semiabierta.","Las blancas recuperan con el caballo, que ocupa la casilla central d4.","g6: el Dragón Acelerado. Si las blancas juegan Cc3, podremos romper con ...d5 de una vez.","c4 es el Bind de Maroczy: con c4 y e4 las blancas impiden nuestras rupturas ...d5 y ...b5.","Cf6 ataca e4 antes de que las blancas lo defiendan cómodamente con f3 o Ad3.","Cc3 defiende e4 y refuerza el control de d5; ahora ...d5 ya no es posible.","d6 controla e5 y abre la diagonal del alfil de c8.","Ae2 desarrolla el alfil y prepara el enroque corto.","Cambiamos caballos: con menos piezas, el espacio extra de las blancas pesa menos.","La dama recupera en d4, centralizada pero expuesta a nuestro alfil de g7.","Ag7 ataca a la dama por la diagonal y nos permite enrocar en la siguiente jugada.","Ae3 protege la dama de d4 y vigila las casillas b6 y c5.","Enrocamos: nuestro rey está seguro y la posición es sólida.","Dd2 aparta la dama de la diagonal del alfil de g7 y evita ...Cg4 contra el alfil de e3.","Ae6 presiona c4 y prepara ...Da5 y ...Tfc8 para atacar el flanco de dama.","Las blancas enrocan: el rey queda protegido y la torre de f1 entra en juego.","Da5 presiona c3 y a2 y apoya la futura ruptura ...b5.","Tac1 protege el caballo de c3 y refuerza la columna c contra nuestra presión.","Tfc8 refuerza la presión sobre c4 y c3; nuestras piezas trabajan juntas en el flanco de dama.","b3 defiende c4 con un peón y le quita esa casilla a nuestras piezas.","a6 prepara ...b5: nuestro plan para romper el bind y abrir el flanco de dama donde estamos mejor."]},{"id":"alapin","name":"Contra la Alapin (2.c3)","moves":"e4 c5 c3 Nf6 e5 Nd5 d4 cxd4 Nf3 Nc6 cxd4 d6 Bc4 Nb6 Bb5 dxe5 Nxe5 Bd7 Nxd7 Qxd7 Nc3 e6 O-O Be7","idea":"Atacar el peón e5 antes de que las blancas consoliden el centro. Tras los cambios nos queda una posición sólida contra el peón aislado de d4.","notes":["Las blancas empiezan con el peón de rey, controlando d5 y f5 y abriendo líneas a sus piezas.","c5 es la defensa más combativa contra 1.e4: luchamos por el centro con un peón lateral.","c3 es la Alapin: las blancas preparan d4 para recuperar con el peón y tener un centro sólido.","Cf6 ataca e4 enseguida, aprovechando que c3 le quitó esa casilla al caballo de b1.","e5 echa al caballo, pero el peón avanzado será un blanco para nuestras piezas.","Cd5 centraliza el caballo; el peón de c3 ya no puede echarlo con c4 sin perder tiempo.","d4 apoya el peón de e5 y amplía el centro; las blancas quieren recapturar en d4 con el peón de c3.","Cambiamos en d4 para abrir el juego antes de que las blancas consoliden su centro.","Cf3 desarrolla y defiende d4; si cxd4 de inmediato, ...d6 golpea igualmente e5.","Cc6 presiona d4 y e5 a la vez y desarrolla una pieza más hacia el centro.","Las blancas recuperan con el peón de c3 y forman un centro de peones en d4 y e5.","d6 ataca e5: rompemos el centro blanco antes de que se asiente con Ac4 y O-O.","Ac4 ataca a nuestro caballo de d5 y apunta al punto débil f7.","Cb6 echa al alfil con tiempo, ya que el caballo ataca la casilla c4.","Ab5 clava el caballo de c6 y aumenta la presión indirecta sobre e5.","Cambiamos en e5: abrimos la columna d contra el peón de d4, que se quedará aislado.","Cxe5 recupera el peón y amenaza Cxc6 para dañar nuestra estructura.","Ad7 deshace la clavada: si Cxc6, recapturamos con el alfil o el peón y quedamos bien.","Las blancas cambian el caballo por nuestro alfil para no perder tiempo.","Recuperamos con la dama, que se desarrolla y además refuerza el caballo de c6, todavía clavado por el alfil de b5.","Cc3 desarrolla y controla d5 y e4; las blancas preparan el enroque.","e6 cierra la casilla d5 y abre la diagonal del alfil de f8.","Las blancas enrocan: el rey queda protegido y la torre de f1 entra en juego.","Ae7 y luego enroque: posición sólida con un plan claro contra el peón aislado de d4."]},{"id":"sveshnikov","name":"Sveshnikov","moves":"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 Nf6 Nc3 e5 Ndb5 d6 Bg5 a6 Na3 b5 Bxf6 gxf6 Nd5 f5 Bd3 Be6","idea":"Las negras aceptan el agujero en d5 y peones doblados a cambio de actividad, pareja de alfiles y la ruptura ...f5.","notes":["1.e4, la jugada más popular: las blancas toman el centro y preparan un desarrollo rápido.","c5 es la defensa más combativa contra 1.e4: luchamos por el centro con un peón lateral.","Cf3 controla d4 y e5 y deja preparado el avance d4.","Cc6 presiona d4 y prepara un desarrollo rápido; también es la base de ...e5.","Con d4 las blancas entran en la Siciliana Abierta, la línea más ambiciosa.","Capturamos en d4; a cambio del peón de c, ganamos la columna c y una mayoría central.","Cxd4 recupera el material; el caballo es fuerte en d4 pero puede ser atacado con ...Cc6 o ...e5.","Atacamos e4 con el caballo: así las blancas no tienen tiempo para jugar c4 y montar un bind.","Las blancas protegen e4 con el caballo, que además vigila d5 y b5.","e5: la Sveshnikov. Echamos al caballo con tiempo, aunque dejamos una casilla débil en d5.","Cdb5 amenaza Cd6+, el jaque en la casilla débil que acabamos de crear.","d6 cubre la casilla d6 y deja el caballo de b5 mal situado.","Ag5 clava el caballo de f6 para eliminarlo y ganar control de d5.","a6 echa al caballo de b5, que tendrá que irse al borde del tablero.","Ca3 es la única casilla del caballo; queda lejos del juego por un tiempo.","b5 impide Cc4 y deja al caballo de a3 fuera de juego.","Axf6 elimina un defensor de d5 y nos deja peones doblados.","Recuperamos con el peón g: estructura dañada, pero ganamos la pareja de alfiles y la ruptura ...f5.","Cd5 se instala en la casilla débil y vigila f6, e7 y c7.","f5 ataca e4: es el contrajuego típico de la Sveshnikov, que abre líneas a nuestros alfiles.","Ad3 defiende e4 y prepara Dh5 o c3 para traer el caballo de a3 por c2.","Ae6 desarrolla y vigila d5. Planes: ...Ag7, ...O-O y ...f4 o ...Tc8 con buen juego."]},{"id":"taimanov","name":"Taimanov","moves":"e4 c5 Nf3 e6 d4 cxd4 Nxd4 Nc6 Nc3 Qc7 Be3 a6 Be2 Nf6 O-O Bb4 Na4 Be7 Nxc6 bxc6 Nb6 Rb8 Nxc8 Qxc8","idea":"Esquema flexible: ...Dc7, ...a6 y desarrollo según lo que haga el blanco. El alfil en b4 presiona e4 y obliga a las blancas a decidir.","notes":["1.e4, la jugada más popular: las blancas toman el centro y preparan un desarrollo rápido.","c5 es la defensa más combativa contra 1.e4: luchamos por el centro con un peón lateral.","Cf3 controla d4 y e5 y deja preparado el avance d4.","e6 prepara ...d5 y deja libre la diagonal del alfil de f8. Es un esquema flexible.","Con d4 las blancas entran en la Siciliana Abierta, la línea más ambiciosa.","Capturamos en d4; a cambio del peón de c, ganamos la columna c y una mayoría central.","Cxd4 recupera el material; el caballo es fuerte en d4 pero puede ser atacado con ...Cc6 o ...e5.","Cc6 presiona el caballo de d4: es la Taimanov, un esquema muy flexible.","Cc3 desarrolla y vigila las casillas d5 y b5, típicas para los caballos blancos.","Dc7 controla e5 y prepara ...a6 sin miedo a que el caballo salte a b5 con tiempo.","Ae3 desarrolla y deja abierta la elección entre Dd2 con O-O-O o Ae2 con O-O.","a6 controla b5 y prepara ...b5 para ganar espacio en el flanco de dama.","Ae2 elige un juego tranquilo con enroque corto, la línea más sólida para las blancas.","Cf6 ataca e4 y desarrolla el flanco de rey; pronto podremos enrocar.","Enroque corto de las blancas; ahora pueden pensar en planes centrales.","Ab4 clava el caballo de c3 y presiona e4: si las blancas no reaccionan, ...Axc3 y ...Cxe4.","Ca4 evita la clavada y amenaza Cb6, pero el caballo queda en el borde.","Ae7 vuelve a casa: hemos provocado que el caballo vaya a a4, donde está mal colocado.","Cxc6 cambia los caballos para poder saltar a b6 con tiempo.","Recuperamos con el peón b para reforzar el centro con c6 y abrir la columna b.","Cb6 ataca la torre de a8, que tiene que moverse; el caballo blanco está muy adelantado.","Tb8 aparta la torre y ocupa la columna b semiabierta, apuntando a b2.","El caballo cambia el alfil de c8 para no quedar atrapado en b6.","Recuperamos con la dama: centro sólido, columna b abierta y la ruptura ...d5 preparada."]},{"id":"kan","name":"Kan (4...a6)","moves":"e4 c5 Nf3 e6 d4 cxd4 Nxd4 a6 Bd3 Nf6 O-O Qc7 Qe2 d6 c4 g6 Nc3 Bg7","idea":"La Kan es una Siciliana flexible: ...a6 y ...Dc7 sin comprometer los caballos. Contra el bind con c4 adoptamos el fianchetto de rey y un esquema tipo erizo.","notes":["Las blancas abren con 1.e4: ocupan el centro y liberan la dama y el alfil de f1.","c5: la Siciliana. Peleamos por d4 desde el flanco y creamos un desequilibrio desde la primera jugada.","Cf3 desarrolla el caballo hacia el centro y prepara la ruptura d4.","e6 prepara ...a6 y ...d5 y deja libre la diagonal del alfil de f8.","Las blancas rompen en el centro con d4 para abrir líneas y aprovechar su ventaja de desarrollo.","Cambiamos en d4: damos un peón lateral por uno central y abrimos la columna c para nuestras torres.","El caballo recupera el peón en d4 y queda centralizado, aunque será un blanco para nuestras piezas.","a6: la Kan. Controlamos b5 y preparamos ...Dc7 y ...b5 sin decidir aún dónde van los caballos.","Ad3 defiende e4 con el alfil y deja libre el peón de c para jugar c4.","Cf6 ataca e4 y desarrolla el flanco de rey; las blancas tienen que mantener el peón.","Las blancas enrocan corto y ponen su rey a salvo antes de abrir el juego.","Dc7 controla e5 y la columna c y prepara ...Ac5 o ...d6 según convenga.","De2 refuerza el peón de e4 y deja libre la casilla c4 para el avance del peón c.","d6 controla e5 y prepara una posición tipo erizo, sólida y elástica.","c4 monta un bind de Maroczy: las blancas ganan espacio y frenan ...b5.","g6 prepara el fianchetto: el alfil de g7 presionará d4 y la gran diagonal.","Cc3 desarrolla y controla d5, la casilla en la que querríamos romper con ...d5.","Ag7 completa el fianchetto. Planes: ...O-O, ...Cbd7 y las rupturas ...b5 o ...d5 en el momento justo."]},{"id":"rossolimo","name":"Contra la Rossolimo (3.Bb5)","moves":"e4 c5 Nf3 Nc6 Bb5 g6 O-O Bg7 Re1 e5 Bxc6 dxc6 d3 Qe7 Nbd2 Nf6 Nc4 Nd7","idea":"Fianchetto y ...e5 para frenar d4. Si las blancas cambian en c6, la pareja de alfiles compensa los peones doblados.","notes":["Las blancas abren con 1.e4: ocupan el centro y liberan la dama y el alfil de f1.","Respondemos con la Siciliana: c5 controla d4 sin dar simetría y prepara la columna c semiabierta.","Cf3 controla d4 y e5 y deja preparado el avance d4.","Cc6 presiona d4 y desarrolla una pieza; así frenamos la Siciliana Abierta normal.","Ab5 es la Rossolimo: las blancas evitan la Siciliana Abierta y amenazan Axc6 para dañar nuestros peones.","g6 prepara el fianchetto; el alfil de g7 vigilará d4 y e5.","Las blancas enrocan corto y preparan Te1 y c3 para intentar jugar d4 más tarde.","Ag7 completa el fianchetto y presiona d4 y b2 por la gran diagonal.","Te1 apoya e4 y prepara c3 y d4, o el avance e5 para cerrar el alfil de g7.","e5 frena d4 y el avance e5. Si Axc6, recapturaremos con el peón d y abriremos la diagonal del alfil.","Axc6 cambia el alfil por el caballo: nos quedamos con peones doblados, pero con la pareja de alfiles.","Recuperamos con el peón d: abrimos la columna d y la diagonal del alfil de c8.","d3 sostiene e4 y abre la diagonal del alfil de c1.","De7 protege e5 y prepara ...Cf6 y ...Cd7 sin perder el control central.","Cbd2 se dirige a c4 para atacar el peón de e5, nuestro punto de apoyo central.","Cf6 desarrolla y presiona el peón de e4; también prepara ...Cd7 si hace falta.","Cc4 ataca el peón de e5 por segunda vez; debemos defenderlo con cuidado.","Cd7 defiende e5 y prepara ...f6, ...O-O y ...b6. Posición sólida con dos alfiles a largo plazo."]},{"id":"gran-premio","name":"Contra el Ataque Gran Premio (2.Nc3 y 3.f4)","moves":"e4 c5 Nc3 Nc6 f4 g6 Nf3 Bg7 Bc4 e6 O-O Nge7 d3 d5 Bb3 O-O","idea":"Contra el Gran Premio usamos el fianchetto con ...e6, ...Cge7 y ...d5 para neutralizar el alfil de c4 y el ataque por la columna f.","notes":["1.e4, la jugada más popular: las blancas toman el centro y preparan un desarrollo rápido.","c5: la Siciliana. Peleamos por d4 desde el flanco y creamos un desequilibrio desde la primera jugada.","Cc3 evita la Siciliana Abierta: prepara un esquema Cerrado o el Gran Premio con f4.","Cc6 controla d4 y e5 y desarrolla una pieza; mantenemos todas las opciones abiertas.","f4 es el Gran Premio: las blancas buscan un ataque en el flanco de rey con f5.","g6 prepara el fianchetto, que vigilará d4 y e5 desde g7.","Cf3 desarrolla el caballo y apoya el futuro avance e5, que cerraría la diagonal de g7.","Ag7 completa el fianchetto y controla la gran diagonal.","Ac4 apunta a f7, el punto más débil de nuestra posición.","e6 bloquea la diagonal del alfil de c4 y prepara ...d5 para atacarlo.","Las blancas enrocan corto y preparan f5 con la torre detrás.","Cge7 apoya ...d5 y no se expone a e5, como pasaría con el caballo en f6.","d3 apoya el peón de e4 y abre la diagonal del alfil de c1 hacia e3 y g5.","d5 ataca el alfil de c4 por segunda vez y discute el centro con el peón.","Ab3 retira el alfil y mantiene la presión sobre d5.","Enrocamos: tenemos una posición sólida y el centro controlado. Planes: ...b6, ...Ab7 y ...Cd4."]},{"id":"smith-morra","name":"Contra el Gambito Smith-Morra","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6 O-O Nf6 Qe2 Be7 Rd1 e5 h3 O-O Be3 Be6","idea":"Aceptar el peón y desarrollarse con cuidado; cuidado con Cd5 y Axe6. Con ...e5 cerramos la columna d y nos quedamos con un peón de más.","notes":["Las blancas empiezan con el peón de rey, controlando d5 y f5 y abriendo líneas a sus piezas.","Respondemos con la Siciliana: c5 controla d4 sin dar simetría y prepara la columna c semiabierta.","d4 sin Cf3 previo: anuncia el Gambito Smith-Morra.","Capturamos el peón: el gambito sólo se discute aceptándolo.","c3 ofrece un peón a cambio de desarrollo rápido y columnas abiertas.","Aceptamos: si nos defendemos bien, el peón de más pesará en el final.","El caballo recupera y se desarrolla; las blancas tienen piezas muy activas.","Cc6 desarrolla y controla d4 y e5; empezamos a poner piezas en juego sin prisa.","Cf3 desarrolla el último caballo y prepara Ac4 y el enroque.","d6 controla e5 y evita que el peón de e4 avance con fuerza.","Ac4 apunta a f7 y a e6, casillas típicas para sacrificios.","e6 cierra la diagonal del alfil de c4 y vigila d5.","Las blancas enrocan corto y preparan De2 y Td1 para ganar actividad en la columna d.","Cf6 desarrolla y prepara el enroque. Ojo: e5 o Cd5 son las ideas tácticas del rival.","De2 prepara Td1 para presionar el peón de d6 por la columna abierta.","Ae7 desarrolla y prepara el enroque para salir de la columna e.","Td1 presiona el peón de d6 por la columna abierta y amenaza e5 en algún momento.","e5 cierra la columna d y quita el peón de d6 del peligro.","h3 evita ...Ag4, que clavaría el caballo de f3 contra la dama de e2.","Enrocamos: el rey queda a salvo y el peligro inmediato ha pasado.","Ae3 desarrolla el último alfil y vigila las casillas b6 y c5.","Ae6 ofrece el cambio del peligroso alfil de c4. Con un peón de más y posición estable, estamos mejor."]},{"id":"najdorf-bc4","name":"Najdorf, 6.Bc4 (Fischer-Sozin)","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bc4 e6 Bb3 b5 O-O Be7 Qf3 Qc7","idea":"El alfil apunta a e6; ...e6 lo frena y ...b5 gana espacio con tempo."},{"id":"rauzer","name":"Clásica, Richter-Rauzer","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 Nc6 Bg5 e6 Qd2 a6 O-O-O Bd7 f4 b5","idea":"Enroques opuestos: las negras atacan rápido con ...b5-b4."},{"id":"moscu","name":"Contra la Moscú (3.Bb5+)","moves":"e4 c5 Nf3 d6 Bb5+ Bd7 Bxd7+ Qxd7 c4 Nc6 Nc3 Nf6 d4 cxd4 Nxd4 g6","idea":"Cambiar alfiles y desarrollarse con fianchetto contra la estructura Maroczy."},{"id":"grand-prix","name":"Contra el Ataque Grand Prix (f4)","moves":"e4 c5 Nc3 Nc6 f4 g6 Nf3 Bg7 Bb5 Nd4 O-O Nxb5 Nxb5 d6","idea":"...Nd4 obliga a decidir al alfil de b5 y las negras ganan la pareja de alfiles."},{"id":"cerrada","name":"Contra la Siciliana Cerrada","moves":"e4 c5 Nc3 Nc6 g3 g6 Bg2 Bg7 d3 d6 Be3 e5 Qd2 Nge7","idea":"Estructura Botvinnik con ...e5 y juego en el flanco de dama con ...Rb8 y ...b5."},{"id":"maroczy","name":"Dragón Acelerado, Maroczy","moves":"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 c4 Bg7 Be3 Nf6 Nc3 O-O Be2 d6 O-O Bd7","idea":"Contra la cadena c4-e4, maniobrar con paciencia y buscar ...a5, ...Qa5 o ...b5."},{"id":"keres","name":"Scheveningen, Ataque Keres (6.g4)","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 e6 g4 h6 h4 Nc6 Rg1 h5 gxh5 Nxh5 Bg5 Nf6","idea":"...h6 y ...h5 frenan el avance de peones blancos en el flanco de rey."},{"id":"dragon-clasico","name":"Dragón Clásico (6.Be2)","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be2 Bg7 O-O O-O Be3 Nc6 Nb3 Be6","idea":"Sin enroques opuestos, el juego es más tranquilo; ...Be6 y ...Rc8 presionan c4."},{"id":"alapin-d5","name":"Contra la Alapin, 2...d5","moves":"e4 c5 c3 d5 exd5 Qxd5 d4 Nf6 Nf3 Bg4 Be2 e6 O-O Nc6","idea":"Dama activa en d5 y desarrollo rápido presionando d4."}]},{"id":"francesa","name":"Defensa Francesa","side":"b","eco":"C00–C19","group":"1.e4","blurb":"1...e6 y 2...d5: estructura sólida y contraataque contra la cadena de peones blanca.","lines":[{"id":"avance","name":"Variante del Avance","moves":"e4 e6 d4 d5 e5 c5 c3 Nc6 Nf3 Qb6 a3 c4 Nbd2 Na5 Be2 Bd7 O-O Ne7","idea":"Presión sobre d4 con ...Db6; ...c4 gana espacio en el flanco de dama y frena la expansión blanca con b4.","notes":["El rival abre con 1.e4: ocupa el centro y libera la dama y el alfil de f1.","Defensa Francesa: preparamos ...d5 para disputar el centro con el respaldo del peón de e6.","Las blancas levantan el centro ideal con dos peones en e4 y d4.","Atacamos e4 de inmediato; el rival debe decidir si avanza, cambia o defiende el peón.","Variante del Avance: el rival gana espacio y quita la casilla f6 a nuestro caballo, pero fija la cadena de peones.","Golpeamos la base de la cadena: el peón de d4 es el punto que sostiene todo el centro blanco.","Las blancas refuerzan d4 con un peón para poder recapturar con peón si cambiamos en d4.","El caballo se suma al ataque contra d4: ya lo presionan el peón de c5 y el caballo de c6.","El rival defiende d4 con el caballo y prepara Ad3; d4 queda bien protegido de momento.","La dama ataca d4 y b2 a la vez, uno de los planes más típicos del Avance.","El rival prepara b4 para ganar espacio en el flanco de dama y amenazar con b5 contra nuestro caballo.","Cerramos el flanco de dama: si b4, tomamos al paso con cxb3. El peón de d4 deja de sufrir, pero b3 queda como casilla débil.","El caballo vigila b3 y c4 y puede ir a f1-e3; el rival quiere expulsar nuestros caballos y preparar f4-f5 más tarde.","El caballo apunta a b3, una casilla débil que el rival ya no puede cubrir con peones.","Desarrollo tranquilo del alfil; las blancas preparan el enroque.","Desarrollamos el alfil y conectamos piezas; a veces irá a a4 o b5 para apoyar el flanco de dama.","El rival enroca y piensa en Te1, Cf1 y jugar en el flanco de rey.","El caballo va a c6 o f5 para presionar d4 otra vez; nuestro rey enrocará corto con calma."]},{"id":"winawer","name":"Winawer","moves":"e4 e6 d4 d5 Nc3 Bb4 e5 c5 a3 Bxc3+ bxc3 Ne7 Qg4 O-O Bd3 Nbc6 Qh5 Ng6 Nf3 Qc7 Be3 c4 Bxg6 fxg6 Qg4 Qf7","idea":"Doblamos los peones blancos a cambio del alfil de casillas negras; contra 7.Dg4 enrocamos y defendemos el flanco de rey con ...Cg6 y ...Df7.","notes":["El rival abre con 1.e4: ocupa el centro y libera la dama y el alfil de f1.","Defensa Francesa: preparamos ...d5 para disputar el centro con el respaldo del peón de e6.","Las blancas levantan el centro ideal con dos peones en e4 y d4.","Atacamos e4 de inmediato; el rival debe decidir si avanza, cambia o defiende el peón.","El rival defiende e4 con el caballo, la respuesta más natural y ambiciosa.","Variante Winawer: clavamos el caballo de c3, que es quien defiende e4.","El rival avanza, gana espacio y rompe la clavada al dejar de necesitar defender e4.","Atacamos la base de la cadena en d4; a la vez el alfil de b4 sigue clavando el caballo.","El rival pregunta al alfil: o lo cambiamos por el caballo o nos retiramos.","Cambiamos y damos jaque: las blancas quedan con peones doblados en c3 y c2, aunque ganan la pareja de alfiles.","Única recaptura: el peón vuelve a cubrir d4, pero la estructura del flanco de dama queda dañada.","El caballo sale a e7 y no a f6 (por el peón de e5); desde e7 puede ir a f5, c6 o g6.","Ataque con 7.Dg4: la dama apunta a g7, que ya no defiende nuestro alfil de casillas negras.","Enrocamos y dejamos que el rey defienda g7; es la línea más sólida frente a 7...Dc7, que sacrifica el flanco de rey.","El alfil apunta al enroque: la idea es Dh5 o Axh7+ en el momento justo. Cuidado con h7.","Desarrollamos y presionamos d4 y e5; el caballo de c6 también puede saltar a b4 más adelante.","La dama vigila h7 y amenaza Axh7+; además impide que juguemos ...Cf5 con comodidad.","Cubrimos h8 y f8 y tapamos la diagonal del alfil de d3 hacia h7; también atacamos el peón de e5.","El rival defiende e5 con el caballo y prepara el enroque corto.","La dama presiona e5, que ya atacan el caballo de c6 y el de g6.","Desarrollo que protege d4 y conecta piezas; el rival podrá enrocar por cualquiera de los dos lados.","Con ...c4 atacamos el alfil de d3 y ganamos espacio; el alfil no tiene buenas retiradas y se cambia.","El rival cambia el alfil antes de quedar atrapado; abre la columna f a cambio.","Recapturamos hacia el centro: la columna f semiabierta apunta a f2 y a la casilla f3.","El peón de g6 atacaba la dama; se retira a g4 apuntando a e6 y g6.","La dama sube a f7 a presionar f3 y f2 por la columna f; el centro está bloqueado y tenemos buen juego."]},{"id":"tarrasch","name":"Tarrasch (3.Nd2)","moves":"e4 e6 d4 d5 Nd2 Nf6 e5 Nfd7 Bd3 c5 c3 Nc6 Ne2 cxd4 cxd4 f6 exf6 Nxf6 Nf3 Bd6 O-O Qc7","idea":"Atacar la base de la cadena con ...c5 y la cabeza con ...f6; a cambio de un peón aislado en e6 tenemos piezas muy activas.","notes":["El rival abre con 1.e4: ocupa el centro y libera la dama y el alfil de f1.","Defensa Francesa: preparamos ...d5 para disputar el centro con el respaldo del peón de e6.","Las blancas levantan el centro ideal con dos peones en e4 y d4.","Atacamos e4 de inmediato; el rival debe decidir si avanza, cambia o defiende el peón.","Tarrasch: el caballo defiende e4 sin dejar que lo clavemos con ...Ab4, y mantiene libre el peón de c3.","Con 3...Cf6 atacamos e4 y obligamos al rival a avanzar con e5 para no perder el peón.","El rival avanza y gana espacio con tempo sobre nuestro caballo.","El caballo vuelve a d7 y deja libre el peón de f7 para la ruptura ...f6; además apoya ...c5.","El alfil apunta a h7 y prepara Ce2 para que el peón de f2 pueda avanzar.","Golpe a la base de la cadena: es nuestra ruptura principal en la Francesa.","El rival sostiene d4 con un peón; su caballo de d2 le quita la casilla al alfil de c1.","Más presión sobre d4: el caballo de c6 se suma al peón de c5.","El caballo defiende d4 desde e2 y deja libre f2 para un eventual f4.","Cambiamos para abrir la columna c y sacar el máximo partido de la presión sobre d4.","El rival recaptura con peón para mantener el centro.","Ahora golpeamos la cabeza de la cadena: si exf6, nuestras piezas quedan muy activas.","El rival cambia para no dejar que tomemos en e5 y se queda contra nuestro peón débil de e6.","Recapturamos con el caballo: controla e4 y d5 y se coloca en su casilla ideal.","El otro caballo sale a f3 para controlar e5, la casilla clave frente a nuestro peón de e6.","El alfil apunta a h2 y controla e5; preparamos el enroque y la idea ...e5 de liberación.","El rival enroca; ahora el peón de h2 sólo lo defiende el rey y será nuestro objetivo.","La dama ataca h2 junto con el alfil; nos preparamos para enrocar y jugar ...e5 o ...Cg4."]},{"id":"tarrasch-c5","name":"Tarrasch con 3...c5","moves":"e4 e6 d4 d5 Nd2 c5 exd5 Qxd5 Ngf3 cxd4 Bc4 Qd6 O-O Nf6 Nb3 Nc6 Nbxd4 Nxd4 Nxd4 a6 Re1 Qc7 Bb3 Bd6 h3 O-O","idea":"Golpeamos el centro antes de que se cierre; tras los cambios quedamos con un juego sólido y la mayoría de peones en el centro.","notes":["El rival abre con 1.e4: ocupa el centro y libera la dama y el alfil de f1.","Defensa Francesa: preparamos ...d5 para disputar el centro con el respaldo del peón de e6.","Las blancas levantan el centro ideal con dos peones en e4 y d4.","Atacamos e4 de inmediato; el rival debe decidir si avanza, cambia o defiende el peón.","Tarrasch: el caballo defiende e4 desde d2 sin bloquear el peón de c2.","Atacamos d4 de inmediato: buscamos una posición abierta en vez de la cadena cerrada.","El rival abre el centro; si quisiera e5 tendríamos el típico juego contra la cadena.","Recapturamos con dama: aquí no la pueden atacar con Cc3, porque el caballo está en d2.","El caballo sale defendiendo d4 y desarrollando hacia el enroque.","Cambiamos en d4: ahora el rival debe ganar tiempos atacando nuestra dama para recuperar el peón.","El alfil gana un tiempo atacando a nuestra dama de d5 y apunta a e6 y f7.","La dama se retira a d6, defiende nuestro peón de d4 y no estorba el desarrollo de las demás piezas.","El rival enroca y deja para después la recuperación de d4.","Desarrollamos el caballo y defendemos la casilla d5; nuestro rey enrocará pronto.","El caballo va a por el peón de d4 por la vía de b3.","Defendemos nuestro peón de d4 otra vez; si el rival lo recupera, cambiaremos piezas.","El rival recupera el peón con el caballo, que queda muy bien centralizado en d4.","Cambiamos caballos para aliviar la presión; con menos piezas, el rival tiene menos ventaja de desarrollo.","Recapturan con el caballo, que queda bien centralizado.","Preparamos ...Dc7 y ...b5 o ...Ad6 sin que el alfil o el caballo enemigo salten a b5.","La torre ocupa la columna e abierta y presiona e6.","La dama se aparta de la columna d y de saltos como Cf5; prepara ...Ad6 apuntando a h2.","El alfil se esconde en b3 antes de que lo ataquemos con ...b5.","Desarrollo agresivo: el alfil apunta a h2 junto con la dama, una amenaza a vigilar siempre.","El rival cubre g4 y evita ...Cg4 con ataque sobre h2.","Enrocamos con una posición sólida: mayoría central con e6-e5 posible y pareja de alfiles."]},{"id":"clasica","name":"Clásica / Steinitz","moves":"e4 e6 d4 d5 Nc3 Nf6 e5 Nfd7 f4 c5 Nf3 Nc6 Be3 cxd4 Nxd4 Bc5 Qd2 O-O O-O-O a6 h4 Nxd4 Bxd4 b5","idea":"Las blancas refuerzan el centro con f4; nosotros presionamos d4 y, con enroques opuestos, atacamos rápido en el flanco de dama con ...a6 y ...b5.","notes":["El rival abre con 1.e4: ocupa el centro y libera la dama y el alfil de f1.","Defensa Francesa: preparamos ...d5 para disputar el centro con el respaldo del peón de e6.","Las blancas levantan el centro ideal con dos peones en e4 y d4.","Atacamos e4 de inmediato; el rival debe decidir si avanza, cambia o defiende el peón.","El rival defiende e4 con el caballo, la forma más natural de mantener el peón.","Variante Clásica: atacamos e4 con el caballo en lugar de clavar con ...Ab4.","Variante Steinitz: el rival avanza con tempo y 4.","La torre ocupa la columna e y apoya un posible Ce5.","El alfil presiona d4 desde f6; tenemos buen juego contra el peón aislado."]},{"id":"cambio","name":"Variante del Cambio","moves":"e4 c6 d4 d5 exd5 cxd5 Bd3 Nc6 c3 Nf6 Bf4 Bg4 Qb3 Qd7 Nd2 e6 Ngf3 Bd6 Bxd6 Qxd6 O-O O-O","idea":"Activamos el alfil con ...Ag4 antes de ...e6; luego cambiamos alfiles de casillas negras y preparamos el ataque de minorías con ...b5-b4.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Caro-Kann: preparamos ...d5 con el apoyo del peón de c6, sin encerrar nuestro alfil de c8.","Las blancas forman el centro clásico con dos peones en e4 y d4.","Atacamos e4: si el rival lo cambia, recapturaremos con el peón de c6 o con piezas.","Variante del Cambio: el rival cambia el centro para jugar con calma.","Recapturamos con el peón c, y la columna c queda abierta para nosotros.","El alfil se desarrolla en d3 apuntando a h7 y controlando f5.","Desarrollamos el caballo atacando d4 y controlando e5.","El rival defiende d4 con un peón; estructura del Gambito de Dama invertida.","Desarrollamos el otro caballo, que controla e4 y defiende d5.","El alfil sale fuera de la cadena antes de jugar Cd2.","Activamos nuestro alfil antes de ...e6: es su mejor casilla, clavando y presionando.","La dama ataca b7 y d5 a la vez, aprovechando que nuestro alfil salió de c8.","Defendemos b7 con la dama; ...Dc8 también es posible, pero ...Dd7 conecta mejor.","El caballo sale por d2 para no doblar peones si cambiamos en f3.","Abrimos la diagonal al alfil de f8 y reforzamos d5 con un peón.","El caballo sale defendiendo d4 y la casilla e5; el rival ya está listo para enrocar.","Ofrecemos el cambio de alfiles de casillas negras: es su alfil bueno.","El rival cambia los alfiles para no perder tiempo con una retirada.","Recapturamos con la dama, bien centralizada y vigilando e5 y h2.","El rival enroca y pone el rey a salvo antes de iniciar su plan.","Enrocamos: el plan será ...Tab8 y ...b5-b4, el ataque de minorías."]},{"id":"karpov","name":"Variante Karpov (4...Nd7)","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nd7 Nf3 Ngf6 Nxf6+ Nxf6 c3 Bg4 h3 Bxf3 Qxf3 e6 Bd3 Bd6 O-O O-O","idea":"Preparamos ...Cgf6 sin doblar peones; después activamos el alfil de c8 y nos desarrollamos sin debilidades.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Caro-Kann: preparamos ...d5 con el apoyo del peón de c6, sin encerrar nuestro alfil de c8.","Las blancas forman el centro clásico con dos peones en e4 y d4.","Atacamos e4: si el rival lo cambia, recapturaremos con el peón de c6 o con piezas.","El rival defiende e4 con el caballo, la forma más natural de mantener el peón.","Cambiamos en e4 para abrir el juego y ganar un tiempo contra el caballo.","El rival recupera con el caballo, que queda centralizado en e4.","Variante Karpov: preparamos ...Cgf6 para recapturar con caballo si el rival cambia en f6.","El caballo sale controlando e5 y apoyando d4; prepara el enroque.","Desafiamos al caballo de e4: si se cambia, recapturamos con el otro caballo.","El rival cambia los caballos para no perder tiempo con una retirada.","Recapturamos con el caballo de d7, sin doblar peones: esa era la idea.","El rival refuerza d4 con un peón y abre las casillas b3 y c2 para su dama.","Activamos el alfil antes de ...e6: clava el caballo de f3 contra la dama.","El rival pregunta al alfil con h3: o lo cambiamos o lo retiramos.","Cambiamos el alfil por el caballo: eliminamos un defensor de d4 y e5.","La dama recupera la pieza y gana la pareja de alfiles, pero no tiene objetivos claros.","Abrimos la diagonal al alfil de f8 y reforzamos el centro.","El alfil se desarrolla apuntando a h7, la casilla débil de nuestro enroque.","Desarrollamos el alfil a d6, controlando e5 y f4, y preparamos el enroque.","El rival enroca y pone el rey a salvo antes de iniciar su plan.","Enrocamos: estructura sólida sin debilidades; luego ...c5 o ...e5 para liberar."]},{"id":"karpov-ng5","name":"Karpov con 5.Ng5","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nd7 Ng5 Ngf6 Bd3 e6 N1f3 Bd6 Qe2 h6 Ne4 Nxe4 Qxe4 Nf6 Qe2 b6 Bd2 Bb7 O-O-O Qc7","idea":"Contra la agresiva 5.Cg5 jugamos con calma, expulsamos el caballo con ...h6 y nos desarrollamos con ...b6 y ...Ab7.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Caro-Kann: preparamos ...d5 con el apoyo del peón de c6, sin encerrar nuestro alfil de c8.","Las blancas forman el centro clásico con dos peones en e4 y d4.","Atacamos e4: si el rival lo cambia, recapturaremos con el peón de c6 o con piezas.","El rival defiende e4 con el caballo, la forma más natural de mantener el peón.","Cambiamos en e4 y ganamos un tiempo contra el caballo de c3.","El rival recupera con el caballo, que queda centralizado y activo.","Preparamos ...Cgf6 para recapturar con caballo sin doblar peones.","El caballo salta a g5 apuntando a f7 y e6: aquí hay una trampa famosa.","Desarrollamos el caballo. ¡Cuidado con jugar ...h6 antes de ...e6: el caballo se sacrifica en e6 o f7 con ataque decisivo!","El alfil apunta a h7 y prepara el desarrollo del caballo de g1.","Cerramos e6 antes de nada: así Ce6 ya no es posible.","El otro caballo sale a f3 a defender d4 y controlar e5.","Desarrollamos el alfil a d6 y controlamos e5 y f4.","La dama apunta a e6 y prepara el enroque largo con idea de atacar.","Ahora sí expulsamos el caballo de g5: e6 está protegido.","El caballo vuelve a e4 sin perder material, ofreciendo un cambio.","Cambiamos caballos para aliviar la presión y simplificar el centro.","La dama recaptura en el centro, en una casilla muy activa.","Recapturamos con el otro caballo, que defiende h7 y controla d5.","La dama se retira a e2 ante el ataque de nuestro caballo de f6.","Preparamos el fianchetto del alfil de c8, su mejor salida aquí.","El rival desarrolla el alfil hacia el enroque largo.","El alfil se coloca en la gran diagonal mirando a f3 y g2.","Enroque largo: el rival prepara g4-g5 para abrir líneas contra nuestro rey.","La dama apunta a h2 junto con el alfil; enrocaremos largo también y jugaremos ...c5."]},{"id":"dos-caballos","name":"Dos Caballos","moves":"e4 c6 Nc3 d5 Nf3 Bg4 h3 Bxf3 Qxf3 e6 d4 Nf6 Bd3 dxe4 Nxe4 Nxe4 Qxe4 Nd7 O-O Nf6 Qh4 Be7","idea":"Cambiamos el alfil por el caballo y jugamos ...e6 con estructura sólida; luego simplificamos en e4.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Caro-Kann: preparamos ...d5 con el apoyo del peón de c6.","Dos Caballos: el rival defiende e4 con el caballo antes de jugar d4.","Atacamos e4 igualmente; el caballo de c3 lo defiende.","Otra pieza al desarrollo; el rival evita el centro clásico.","Clavamos el caballo de f3 contra la dama y vigilamos e4.","El rival pregunta al alfil con h3: o lo cambiamos o lo retiramos.","Cambiamos: la dama queda en f3, expuesta a nuestros desarrollos.","La dama recaptura; el rival gana la pareja de alfiles.","Reforzamos d5 y abrimos la diagonal del alfil de f8.","El rival ocupa el centro con d4 y abre la diagonal al alfil de c1.","Desarrollamos el caballo y atacamos e4 por segunda vez.","El alfil apunta a h7 y defiende e4 por segunda vez.","Cambiamos en e4 para simplificar y quitar presión sobre nuestro centro.","El rival recupera con caballo, que queda en el centro.","Cambiamos el caballo fuerte de e4 para reducir la actividad del rival.","La dama recaptura en el centro, en una casilla muy activa.","El caballo va a f6 por d7: desde allí defenderá h7 y controlará e4 y d5.","El rival enroca y pone el rey a salvo antes de iniciar su plan.","El caballo ataca la dama y se coloca en f6, defendiendo h7.","La dama se aparta del ataque y presiona h7 y la casilla f6.","Desarrollamos el alfil, que cubre f6 ante Ag5; posición sólida y sin debilidades."]},{"id":"fantasia","name":"Variante Fantasía (3.f3)","moves":"e4 c6 d4 d5 f3 e6 Nc3 Nf6 e5 Nfd7 f4 c5 Nf3 Nc6 Be3 cxd4 Nxd4 Bc5","idea":"Contra 3.f3 jugamos ...e6 y llevamos la partida a una estructura de tipo francés con ...c5, en la que nuestro alfil de f8 queda activo.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Caro-Kann: preparamos ...d5 con el apoyo del peón de c6, sin encerrar nuestro alfil de c8.","Las blancas forman el centro clásico con dos peones en e4 y d4.","Atacamos e4 con el peón apoyado por c6; el rival debe decidir.","Variante Fantasía: el rival defiende e4 con f3 y quiere un centro amplio.","Reforzamos d5 y preparamos ...c5; si exd5, recapturamos con peón.","El caballo defiende e4 una segunda vez, junto con el peón de f3.","Atacamos e4 otra vez con el caballo y obligamos al rival a definirse.","El rival avanza con tempo sobre el caballo y cierra el centro.","El caballo vuelve a d7, libera el peón de f7 y apoya la ruptura ...c5.","El rival refuerza e5 con otro peón; f3 queda libre para el caballo.","Golpeamos d4, la base de la cadena de peones blanca.","El caballo defiende d4 y e5 a la vez y desarrolla una pieza.","Más presión sobre d4 con el caballo de c6, que también vigila e5.","El alfil defiende d4 y deja lista la columna d para la dama.","Cambiamos en d4 y abrimos la diagonal a nuestro alfil de f8.","El rival recupera con caballo, que queda en el centro.","El alfil clava el caballo de d4 contra el alfil de e3: tenemos buen juego en el centro."]},{"id":"avance-be3","name":"Avance, 4.Be3","moves":"e4 c6 d4 d5 e5 Bf5 Be3 e6 Nd2 Nd7 Ngf3 h6 Be2 Ne7 O-O","idea":"Las blancas evitan ...c5 fácil; las negras juegan ...Nf5 y ...c5 con calma."},{"id":"avance-c5","name":"Avance, 3...c5","moves":"e4 c6 d4 d5 e5 c5 dxc5 Nc6 Nf3 Bg4 Bb5 Qa5+ Nc3 e6 Be3","idea":"Un tiempo menos, pero las negras recuperan el peón de c5 con juego activo."},{"id":"avance-h4","name":"Avance, 4.h4","moves":"e4 c6 d4 d5 e5 Bf5 h4 h5 c4 e6 Nc3 Ne7 Nge2 dxc4 Ng3 Bg6","idea":"...h5 frena h4-h5; luego ...dxc4 y ...Nd5 aprovechan las casillas blancas."},{"id":"bronstein-larsen","name":"Bronstein-Larsen (5...gxf6)","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nf6 Nxf6+ gxf6 c3 Bf5 Nf3 e6 g3","idea":"Estructura rota pero columna g abierta contra el rey blanco."},{"id":"nf6-exf6","name":"Variante 5...exf6","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nf6 Nxf6+ exf6 c3 Bd6 Bd3 O-O Qc2 Re8+ Ne2","idea":"Desarrollo rápido y juego de piezas a cambio de la mayoría de peones blanca."},{"id":"panov-nc6","name":"Panov, 5...Nc6","moves":"e4 c6 d4 d5 exd5 cxd5 c4 Nf6 Nc3 Nc6 Nf3 Bg4 cxd5 Nxd5 Qb3 Bxf3 gxf3 e6 Qxb7 Nxd4","idea":"Línea muy forzada: las negras sacrifican b7 por desarrollo."},{"id":"dos-caballos-dxe4","name":"Dos Caballos, 3...dxe4","moves":"e4 c6 Nc3 d5 Nf3 dxe4 Nxe4 Bf5 Ng3 Bg6 h4 h6 Ne5 Bh7 Qh5 g6 Bc4 e6 Qe2","idea":"Cuidado con Ne5 y Qh5: ...g6 y ...e6 lo neutralizan."},{"id":"kia","name":"Contra el Ataque Indio de Rey (2.d3)","moves":"e4 c6 d3 d5 Nd2 e5 Ngf3 Bd6 g3 Nf6 Bg2 O-O O-O Re8","idea":"Centro clásico con ...e5 y desarrollo natural."},{"id":"panov-acelerado","name":"Contra el Panov acelerado (2.c4)","moves":"e4 c6 c4 d5 exd5 cxd5 cxd5 Nf6 Nc3 Nxd5 Nf3 Nc6 Bb5 e6 O-O Be7 d4 O-O","idea":"Recuperar el peón con el caballo y llevar el juego a un peón aislado."}]},{"id":"escandinava","name":"Defensa Escandinava","side":"b","eco":"B01","group":"1.e4","blurb":"1...d5: se discute e4 de inmediato. Fácil de aprender y con planes claros.","lines":[{"id":"qa5","name":"Principal (3...Qa5)","moves":"e4 d5 exd5 Qxd5 Nc3 Qa5 d4 Nf6 Nf3 c6 Bc4 Bf5 Bd2 e6 Nd5 Qd8 Nxf6+ Qxf6 Qe2 Nd7","idea":"Dama segura en a5, alfil fuera de la cadena y estructura ...c6-e6. Si las blancas buscan trucos con Cd5, simplificamos y quedamos sólidos.","notes":["Las blancas abren con el peón de rey, ocupando el centro y liberando la dama y el alfil de f1.","d5 ataca e4 de inmediato: es la Escandinava. Discutimos el centro desde la primera jugada.","Las blancas cambian en d5; es lo más habitual, porque defender e4 con Cc3 permite ...dxe4.","Recuperamos con la dama. Saldrá pronto al tablero, pero sabemos a qué casilla irá.","Cc3 ataca a la dama ganando un tiempo de desarrollo; tenemos que moverla.","Da5 es la casilla clásica: la dama queda segura, clava el caballo de c3 si sale d4 y presiona la diagonal e1-a5.","d4 ocupa el centro y abre la diagonal del alfil de c1.","Cf6 desarrolla y controla e4 y d5, casillas centrales importantes.","Cf3 desarrolla el caballo de rey y prepara el enroque corto.","c6 da a la dama una vía de escape por c7 y d8 y controla d5 y b5: evita sustos como Ab5+ o Cb5.","Ac4 apunta a f7 y prepara Ad2 para amenazar un descubrimiento con Cd5.","Af5 saca el alfil de dama antes de jugar ...e6, para que no quede encerrado detrás de la cadena de peones.","Ad2 desclava el caballo de c3 y prepara Cd5, que descubriría un ataque sobre nuestra dama.","e6 completa la estructura sólida c6-e6 y abre la diagonal del alfil de f8.","Cd5 es un truco típico: ataca la dama con el descubrimiento del alfil de d2. Debemos retirarla con cuidado.","Dd8 es la retirada correcta; si ...cxd5? Axa5 y perdemos la dama. Ahora el caballo de d5 está atacado.","Las blancas cambian en f6 con jaque para no perder tiempo con el caballo.","Recuperamos con la dama, que se activa en f6 y presiona d4 y b2.","De2 desarrolla la dama y prepara el enroque largo, apuntando a e6 por la columna e.","Cd7 desarrolla y defiende e5. Seguiremos con ...Ad6 y enroque: posición sólida e igualada."]},{"id":"qd6","name":"Moderna (3...Qd6)","moves":"e4 d5 exd5 Qxd5 Nc3 Qd6 d4 Nf6 Nf3 a6 g3 Bg4 Bg2 Nc6","idea":"La dama en d6 controla e5 y no se expone a b4. Con ...a6 evitamos Cb5 y Ab5, y presionamos d4 con ...Ag4 y ...Cc6.","notes":["Las blancas abren con 1.e4, controlando d5 y f5 y liberando piezas.","d5 ataca el peón de e4 de inmediato: la Defensa Escandinava.","Las blancas aceptan el cambio y el peón de d5 queda atacado por nuestra dama.","Recuperamos con la dama; la posición se abre y el desarrollo será rápido.","Cc3 ataca a la dama ganando un tiempo: hay que elegir casilla.","Dd6 es la variante moderna: la dama vigila e5 y la diagonal b8-h2, y no puede ser atacada por b4 ni por Ad2.","d4 ocupa el centro; nuestra dama lo controla de lejos.","Cf6 desarrolla y controla e4 y d5; además prepara ...a6 y ...Ag4.","Cf3 desarrolla y protege d4 de la presión de nuestras piezas.","a6 quita b5 al caballo de c3 y al alfil: si no, Cb5 golpearía a la dama con tiempo.","g3 prepara el fianchetto para que el alfil de g2 presione b7 por la diagonal larga.","Ag4 clava el caballo de f3 y aumenta la presión sobre d4.","Ag2 completa el fianchetto y el alfil mira hacia nuestro flanco de dama.","Cc6 presiona d4 por tercera vez. Planes: ...O-O-O y ...e5 para abrir la columna d contra el rey blanco."]},{"id":"qd8","name":"Retirada (3...Qd8)","moves":"e4 d5 exd5 Qxd5 Nc3 Qd8 d4 Nf6 Nf3 Bg4 h3 Bxf3 Qxf3 c6 Be3 e6 Bd3 Nbd7 O-O-O Be7","idea":"Posición muy sólida, aunque algo pasiva. Cambiamos el alfil por el caballo de f3 y levantamos una muralla con ...c6 y ...e6.","notes":["Las blancas abren con 1.e4, ocupando el centro y liberando sus piezas.","d5 ataca e4 de inmediato: la Escandinava, una defensa directa y fácil de aprender.","Las blancas cambian y nuestro peón desaparece del centro, pero recuperaremos enseguida.","Recuperamos con la dama, que queda expuesta pero centralizada.","Cc3 ataca a la dama y gana tiempo de desarrollo; hay que retirarla.","Dd8 vuelve a casa: la dama nunca podrá ser hostigada y la posición queda muy sólida, a costa de algo de tiempo.","d4 ocupa el centro; las blancas tienen ventaja de desarrollo pero sin objetivos claros.","Cf6 desarrolla, controla e4 y d5, y protege nuestro flanco de rey.","Cf3 desarrolla y protege el peón de d4, objetivo de nuestras piezas.","Ag4 clava el caballo de f3 y presiona d4, que se queda con menos defensores.","h3 pregunta al alfil: si se retira a h5, g4 lo hostigará.","Cambiamos en f3: damos la pareja de alfiles a cambio de una posición sólida y sin debilidades.","La dama recupera en f3 y presiona b7. Hay que cuidar ese peón.","c6 controla d5 y b5, y protege b7 de forma indirecta al dar casilla a la dama en b6 o c7.","Ae3 protege d4 y prepara el enroque largo con Dd2 o directamente.","e6 cierra la estructura y abre la diagonal del alfil de f8.","Ad3 desarrolla y apunta a nuestro flanco de rey, preparando el enroque largo.","Cbd7 desarrolla y prepara ...Cd5 o ...Cb6, buscando casillas centrales.","Las blancas enrocan largo, con idea de avanzar g4-g5 en el flanco de rey.","Ae7 completa el desarrollo y prepara el enroque. Con ...Da5 y ...b5 tendremos contrajuego contra el rey blanco."]},{"id":"nf6","name":"Variante 2...Nf6","moves":"e4 d5 exd5 Nf6 d4 Nxd5 Nf3 g6 c4 Nb6 Nc3 Bg7 h3 O-O Be3 Nc6","idea":"Recuperar el peón con el caballo y presionar d4 con el fianchetto. Si las blancas construyen el centro c4-d4, lo atacaremos con piezas y con ...e5.","notes":["Las blancas abren con 1.e4: ocupan el centro y liberan la dama y el alfil de f1.","d5: la Escandinava. Atacamos e4 de inmediato y discutimos el centro desde la primera jugada.","Las blancas cambian en d5, lo más habitual: defender e4 con Cc3 permitiría ...dxe4.","Cf6 en lugar de ...Dxd5: recuperaremos el peón con el caballo y la dama no perderá tiempos.","d4 ocupa el centro y se desarrolla; no conviene a las blancas defender d5 con c4 tan pronto.","Recuperamos el peón con el caballo, que queda bien centralizado.","Cf3 desarrolla y protege d4; las blancas preparan c4 para echar al caballo de d5.","g6 prepara el fianchetto: el alfil de g7 apuntará a d4 desde lejos.","c4 echa al caballo y crea un gran centro de peones.","Cb6 se retira a una casilla desde la que presiona c4 y d5.","Cc3 desarrolla y protege el centro, controlando d5 y e4.","Ag7 completa el fianchetto y aumenta la presión sobre d4.","h3 evita ...Ag4, que clavaría el caballo de f3 y presionaría d4.","Enrocamos: nuestro rey está seguro y la torre de f8 puede apoyar ...e5.","Ae3 protege el peón de d4, el gran objetivo de nuestras piezas.","Cc6 presiona d4 por tercera vez. Planes: ...e5 o ...Af5 para atacar el centro blanco."]},{"id":"bb5-jaque","name":"Contra 3.Bb5+ (2...Nf6)","moves":"e4 d5 exd5 Nf6 Bb5+ Bd7 Be2 Nxd5 d4 Bf5 Nf3 e6 O-O Be7 c4 Nb6 Nc3 O-O","idea":"Las blancas intentan conservar el peón de d5 con el jaque. Interponemos el alfil, recuperamos el peón y llevamos el alfil a f5 con un desarrollo cómodo.","notes":["Las blancas empiezan con el peón de rey, controlando d5 y f5 y abriendo líneas a sus piezas.","Respondemos con d5, la Escandinava: el peón de e4 queda atacado y las blancas deben decidir.","exd5: las blancas cambian y ahora nos toca recuperar el peón.","Cf6 nos permite recuperar el peón con el caballo sin exponer a la dama a Cc3.","Ab5+ da jaque con la idea de defender el peón de d5 con c4 o Ac4 más tarde.","Ad7 tapa el jaque y desarrolla; el alfil de b5 queda atacado.","Ae2 retira el alfil y evita el cambio; en d7 nuestro alfil bloquea el caballo de b8.","Recuperamos el peón con el caballo: ya tenemos igualdad material.","d4 ocupa el centro y abre la diagonal del alfil de c1.","Af5 recoloca el alfil en una diagonal mucho más activa, apuntando a c2 y b1.","Cf3 desarrolla el caballo y protege el peón de d4.","e6 sostiene el caballo de d5 y abre la diagonal del alfil de f8.","Las blancas enrocan corto y ponen su rey a salvo antes de abrir el juego.","Ae7 desarrolla el alfil y prepara el enroque corto.","c4 echa al caballo de d5 y gana espacio en el centro.","Cb6 se retira; desde aquí presiona c4 y puede saltar a d7 o c4.","Cc3 desarrolla y controla e4 y d5; las blancas tienen más espacio, pero sin objetivos.","Enrocamos: posición sólida y sin debilidades. Planes: ...Cc6 o ...c6, y ...Af6 contra d4."]},{"id":"portuguesa","name":"Variante Portuguesa (3.d4 Bg4)","moves":"e4 d5 exd5 Nf6 d4 Bg4 f3 Bf5 Bb5+ Nbd7 c4 e6 dxe6 Bxe6 d5 Bf5","idea":"Sacrificamos un peón para desarrollarnos rápido: ...Ag4 provoca f3, que debilita el flanco de rey blanco y la diagonal e1-h4.","notes":["1.e4, la jugada más popular: las blancas toman el centro y preparan un desarrollo rápido.","d5 golpea el centro enseguida; es una defensa directa con planes fáciles de aprender.","Las blancas capturan; nuestro peón desaparece del centro, pero lo recuperaremos.","Con Cf6 atacamos d5 con una pieza que se desarrolla, en vez de sacar la dama.","d4 ocupa el centro y deja que el peón de d5 se defienda solo por ahora.","Ag4 es la Portuguesa: en lugar de recuperar el peón, desarrollamos con tiempo y provocamos f3.","f3 ataca el alfil, pero debilita la diagonal e1-h4 y el desarrollo del caballo de g1.","Af5 se retira a una diagonal activa que apunta a c2 y b1.","Ab5+ desarrolla con jaque y molesta nuestro desarrollo.","Cbd7 tapa el jaque y prepara ...Cb6 para atacar d5.","c4 defiende el peón de d5 de forma sólida, pero deja casillas débiles.","e6 sacrifica: abrimos líneas para nuestras piezas a cambio de material.","Las blancas aceptan el peón y quedan con material de más.","Recuperamos con el alfil, que se activa en e6 y presiona c4.","d5 ataca el alfil y gana espacio. Las blancas tienen un peón de más, pero el rey sin enrocar.","Af5 retira el alfil a una diagonal activa. Con ...Ab4+ y ...O-O tendremos compensación por el peón."]},{"id":"islandes","name":"Gambito Islandés (3.c4 e6)","moves":"e4 d5 exd5 Nf6 c4 e6 dxe6 Bxe6 Nf3 Nc6 Be2 Bc5 O-O O-O","idea":"Contra 3.c4 sacrificamos un peón para desarrollarnos a toda velocidad: alfiles activos y presión sobre d4 y d3.","notes":["Las blancas abren con 1.e4: ocupan el centro y liberan la dama y el alfil de f1.","d5: la Escandinava. Atacamos e4 de inmediato y discutimos el centro desde la primera jugada.","Las blancas cambian en d5, lo más habitual: defender e4 con Cc3 permitiría ...dxe4.","Cf6 en lugar de ...Dxd5: recuperaremos el peón con el caballo y la dama no perderá tiempos.","c4 defiende el peón de d5 a cambio de dejar débil la casilla d4.","e6 es el Gambito Islandés: sacrificamos un peón a cambio de desarrollo rápido.","Las blancas aceptan el sacrificio y quedan con un peón de más.","Recuperamos con el alfil, que se activa y presiona c4.","Cf3 desarrolla el caballo y prepara el enroque corto; las blancas buscan consolidar.","Cc6 desarrolla y controla d4 y e5; nuestras piezas salen con mucha rapidez.","Ae2 desarrolla el alfil y prepara el enroque corto.","Ac5 se activa apuntando a f2 y vigilando d4; las piezas negras ya están muy activas.","Las blancas enrocan: el rey queda protegido y la torre de f1 entra en juego.","Enrocamos: tenemos piezas activas, ventaja de desarrollo y compensación por el peón."]}]},{"id":"alekhine","name":"Defensa Alekhine","side":"b","eco":"B02–B05","group":"1.e4 Nf6","blurb":"1...Cf6: provocamos el avance de los peones blancos para luego atacar ese centro sobreextendido. Una defensa hipermoderna y combativa.","lines":[{"id":"moderna-bg4","name":"Moderna (4.Nf3 Bg4)","moves":"e4 Nf6 e5 Nd5 d4 d6 Nf3 Bg4 Be2 e6 O-O Be7 h3 Bh5 c4 Nb6 Nc3 O-O Be3 d5","idea":"La línea más clásica: ...Ag4 presiona el caballo de f3, que defiende e5 y d4. Con ...e6, ...O-O y ...d5 cerramos el centro y atacamos el peón de c4.","notes":["Las blancas abren con 1.e4: ocupan el centro y liberan la dama y el alfil de f1.","Cf6 es la Alekhine: atacamos e4 e invitamos a los peones blancos a avanzar para atacarlos después.","e5 echa al caballo con tiempo y gana espacio; es la respuesta más ambiciosa.","Cd5 centraliza el caballo en una casilla fuerte, donde sólo c4 puede molestarlo.","d4 apoya el peón de e5 y amplía el centro de peones.","d6 ataca el peón de e5: el centro blanco será siempre nuestro objetivo en esta defensa.","Cf3 protege e5 con una pieza y desarrolla: es la Variante Moderna, la más jugada.","Ag4 clava el caballo de f3, el defensor de e5, y aumenta la presión sobre el centro.","Ae2 desclava el caballo y prepara el enroque corto.","e6 abre la diagonal del alfil de f8 y refuerza el caballo de d5; también prepara ...d5 en el futuro.","Las blancas ponen el rey a salvo con el enroque corto.","Ae7 desarrolla el alfil y prepara nuestro propio enroque.","h3 pregunta al alfil: hay que decidir entre cambiar en f3 o mantener la clavada.","Ah5 mantiene la clavada; cambiar en f3 regalaría la pareja de alfiles sin necesidad.","c4 echa al caballo de d5 y gana más espacio en el centro.","Cb6 se retira a una casilla desde la que presiona c4 y vigila d5.","Cc3 desarrolla y protege el centro, controlando e4 y d5.","Enrocamos: el rey queda seguro antes de abrir el juego central.","Ae3 protege el peón de d4, que sufrirá si jugamos ...Cc6 y ...dxe5.","d5 ataca c4 y bloquea el centro: si c5, el caballo irá a c4 o d7 y atacaremos la cadena con ...b6 o ...f6."]},{"id":"moderna-g6","name":"Moderna con fianchetto (4.Nf3 g6)","moves":"e4 Nf6 e5 Nd5 d4 d6 Nf3 g6 Bc4 Nb6 Bb3 Bg7 Qe2 Nc6 O-O O-O h3 a5 a4 dxe5 dxe5 Nd4 Nxd4 Qxd4","idea":"El fianchetto pone el alfil de g7 contra el peón de e5. Con ...a5, ...dxe5 y ...Cd4 activamos las piezas y cambiamos material para liberar la posición.","notes":["Las blancas empiezan con el peón de rey, controlando d5 y f5 y abriendo líneas a sus piezas.","1...Cf6: provocamos e5. Los peones blancos ganan espacio, pero se convierten en objetivos.","Las blancas avanzan e5 y atacan al caballo: el centro blanco crece, como queremos.","El caballo salta a d5, la mejor casilla: desde allí controla b4, c3, e3 y f4.","Las blancas refuerzan e5 con d4 y forman un centro amplio.","Golpeamos e5 con d6 antes de que las blancas lo consoliden con piezas.","Cf3 protege e5 y desarrolla: la Variante Moderna, la más jugada.","g6 prepara el fianchetto: el alfil de g7 presionará e5 y la gran diagonal.","Ac4 ataca al caballo de d5 ganando un tiempo y apuntando a f7.","Cb6 echa al alfil, que tiene que decidir su casilla.","Ab3 retira el alfil manteniendo la diagonal contra f7, nuestro punto débil.","Ag7 completa el fianchetto y suma presión contra e5.","De2 protege e5 y prepara el enroque y la columna e.","Cc6 ataca e5 por tercera vez y presiona d4; las blancas deben defender su centro.","Enroque corto de las blancas; ahora pueden pensar en planes centrales.","Enrocamos: rey seguro y torre de f8 lista para la ruptura ...f6 si hace falta.","h3 evita ...Ag4, que clavaría el caballo de f3, defensor de e5.","a5 amenaza ...a4 para atrapar el alfil de b3. Muy típico en esta línea.","a4 frena nuestro peón y deja el alfil a salvo, pero la casilla b4 se debilita.","Cambiamos en e5: abrimos la columna d y ganamos casillas para el caballo de c6.","Las blancas recuperan con el peón para mantener espacio.","Cd4 ataca a la dama de e2 y salta a una casilla central fuerte.","Las blancas cambian el caballo para quitarse de encima nuestra pieza central.","Recuperamos con la dama, centralizada y atacando b2 y e5. Posición activa y equilibrada."]},{"id":"cambio","name":"Variante del Cambio (5.exd6)","moves":"e4 Nf6 e5 Nd5 d4 d6 c4 Nb6 exd6 cxd6 Nc3 g6 Be3 Bg7 Rc1 O-O b3 e5 dxe5 dxe5 Qxd8 Rxd8 c5 N6d7","idea":"Tras exd6 cxd6 tenemos una estructura sólida y flexible con fianchetto. Con ...e5 atacamos el centro, cambiamos damas y llegamos a un final cómodo.","notes":["1.e4, la jugada más popular: las blancas toman el centro y preparan un desarrollo rápido.","Cf6 ataca e4 enseguida; es una defensa hipermoderna, que cede el centro para atacarlo luego.","e5 gana un tiempo atacando al caballo, pero el peón avanzado necesitará apoyo.","Cd5: el caballo queda centralizado y espera a que las blancas gasten tiempo para echarlo.","d4 ocupa el centro y abre la diagonal del alfil de c1.","d6 discute el centro de inmediato y abre la diagonal del alfil de c8.","c4 echa al caballo de d5 y gana más espacio en el centro.","Cb6 se retira a una casilla desde la que presiona el peón de c4 y vigila d5.","exd6 es la Variante del Cambio: las blancas renuncian a e5 y se quedan con los peones c4 y d4.","Recuperamos con el peón c: mantenemos un peón central en d6 y abrimos la columna c.","Cc3 desarrolla el caballo y controla las casillas centrales d5 y e4.","g6 prepara el fianchetto, que presionará d4 desde g7.","Ae3 protege d4 y prepara Tc1 o Dd2, para consolidar el centro.","Ag7 completa el fianchetto y presiona d4 desde lejos.","Tc1 protege c4 por la columna c y evita trucos con ...Cxc4.","Enrocamos: rey seguro antes de romper el centro con ...e5.","b3 refuerza c4 para liberar a la torre de su defensa.","e5 ataca d4: es la ruptura liberadora típica de esta estructura.","Las blancas cambian en e5 para simplificar la posición.","Recuperamos con el peón d y abrimos la columna d hacia la dama blanca.","Las blancas cambian damas: tras dxe5 la columna d quedó abierta y la dama de d1 estaba frente a la nuestra.","Recuperamos con la torre, que ocupa la columna d abierta y presiona d1.","c5 ataca el caballo de b6 y gana espacio en el flanco de dama.","El caballo se retira a d7 y ataca el peón de c5. El final es cómodo: el peón c5 es un blanco."]},{"id":"cuatro-peones","name":"Ataque de los Cuatro Peones (5.f4)","moves":"e4 Nf6 e5 Nd5 d4 d6 c4 Nb6 f4 dxe5 fxe5 Nc6 Be3 Bf5 Nc3 e6 Nf3 Be7 d5 exd5 cxd5 Nb4 Nd4 Bd7","idea":"Las blancas forman un enorme centro de peones (c4, d4, e5, f4). Lo atacamos con piezas: ...Cc6, ...Af5 y ...e6; tras d5, el caballo de b4 presiona d5 y c2.","notes":["Las blancas abren con 1.e4: ocupan el centro y liberan la dama y el alfil de f1.","Cf6 es la Alekhine: atacamos e4 e invitamos a los peones blancos a avanzar para atacarlos después.","e5 echa al caballo con tiempo y gana espacio; es la respuesta más ambiciosa.","Cd5 centraliza el caballo en una casilla fuerte, donde sólo c4 puede molestarlo.","d4 apoya el peón de e5 y amplía el centro de peones.","d6 ataca el peón de e5: el centro blanco será siempre nuestro objetivo en esta defensa.","Las blancas atacan el caballo con c4: ganan espacio, pero cada peón avanzado es un blanco.","El caballo va a b6: desde allí ataca c4 y puede volver a d5 o saltar a d7.","f4: el Ataque de los Cuatro Peones. Las blancas tienen un centro enorme pero difícil de mantener.","Cambiamos en e5 para abrir la columna d contra d4.","Las blancas recuperan con el peón f y mantienen e5.","Cc6 presiona e5 y d4. Si las blancas se descuidan, los peones centrales caerán.","Ae3 protege d4, el peón clave del centro blanco, que ya no puede ser apoyado por otro peón.","Af5 desarrolla el alfil con actividad: controla e4 y b1 y queda fuera de la cadena de peones.","Cc3 desarrolla el caballo y protege e4, evitando ...Cb4 contra c2.","e6 abre la diagonal del alfil de f8 y prepara ...Ae7 y ...O-O.","Cf3 desarrolla el último caballo y protege e5 y d4.","Ae7 desarrolla el alfil y prepara el enroque corto.","d5 ataca el caballo de c6 y busca ganar más espacio en el centro.","Cambiamos en d5: así abrimos el juego antes de que las blancas consoliden.","Las blancas recuperan con el peón c y mantienen un peón fuerte en d5.","Cb4 presiona d5 y amenaza ...Cc2+ si las blancas se descuidan.","Cd4 ataca el alfil de f5 y protege c2 del salto ...Cc2+.","Ad7 se retira sin perder el alfil. Planes: ...O-O, ...c5 o ...Ac5 contra el centro blanco."]},{"id":"nc3","name":"Contra 2.Nc3 (2...d5)","moves":"e4 Nf6 Nc3 d5 e5 Nfd7 d4 e6 f4 c5 Nf3 Nc6 Be3 cxd4 Nxd4 Bc5 Qd2 O-O O-O-O a6 h4 Nxd4 Bxd4 b5","idea":"Contra 2.Cc3 jugamos ...d5; tras e5 Cfd7 y ...e6 llegamos a una Francesa Steinitz, con ataque en el flanco de dama contra el enroque largo blanco.","notes":["1.e4, la jugada más popular: las blancas toman el centro y preparan un desarrollo rápido.","Cf6: la Alekhine. Atacamos e4 y esperamos a ver cómo reaccionan las blancas.","Cc3 protege e4 y evita las líneas principales de la Alekhine.","d5 ataca e4 con el peón: queremos que se avance o se cambie.","e5 echa al caballo de f6 y gana espacio en el centro.","Cfd7 retira el caballo hacia d7, desde donde atacaremos e5 con ...c5 y ...f6.","d4 apoya el peón de e5 y ocupa el centro con una cadena de peones.","e6 sostiene d5: la posición es ya una Francesa Steinitz.","f4 refuerza e5 con otro peón y prepara Cf3; las blancas tienen mucho espacio.","c5 ataca d4: la ruptura típica contra la cadena blanca.","Cf3 protege d4 y desarrolla el caballo del flanco de rey.","Cc6 presiona d4 por segunda vez; el centro blanco empieza a sufrir.","Ae3 protege d4 y prepara Dd2 y el enroque largo, el plan más agresivo.","Cambiamos en d4 para abrir la columna c y activar nuestras piezas.","Las blancas recuperan con el caballo, que queda centralizado en d4.","Ac5 desarrolla con tiempo: presiona el caballo de d4, que está clavado contra el alfil de e3.","Dd2 conecta las torres y prepara el enroque largo.","Enrocamos corto: nuestro rey queda seguro en el flanco de rey.","Las blancas enrocan largo para lanzar los peones del flanco de rey.","a6 prepara ...b5 para atacar al rey blanco con los peones del flanco de dama.","h4 prepara h5 y h6 para atacar nuestro enroque; las blancas van a por todas.","Cambiamos en d4 para simplificar y eliminar una pieza atacante.","Las blancas recuperan con el alfil, que queda centralizado.","b5 lanza nuestro ataque: ...b4 echará al caballo de c3 y ...Ab7 o ...Da5 llegarán rápido."]},{"id":"chase","name":"Ataque Chase (3.c4 Nb6 4.c5)","moves":"e4 Nf6 e5 Nd5 c4 Nb6 c5 Nd5 Nc3 e6 Nxd5 exd5 d4 d6 cxd6 cxd6 Nf3 Nc6 Be2 Be7 O-O O-O","idea":"Las blancas persiguen el caballo con c4 y c5, pero sus peones avanzados se debilitan. Con ...e6 y ...d6 atacamos el centro y nos desarrollamos con comodidad.","notes":["Las blancas empiezan con el peón de rey, controlando d5 y f5 y abriendo líneas a sus piezas.","1...Cf6: provocamos e5. Los peones blancos ganan espacio, pero se convierten en objetivos.","Las blancas avanzan e5 y atacan al caballo: el centro blanco crece, como queremos.","El caballo salta a d5, la mejor casilla: desde allí controla b4, c3, e3 y f4.","c4 echa al caballo de d5 antes de jugar d4, ganando espacio en el flanco de dama.","Cb6 es la retirada típica; el caballo presiona c4 y espera su momento.","c5 es el Ataque Chase: las blancas persiguen al caballo de nuevo.","Cd5 vuelve al centro: el peón de c5 ya no puede echarlo y d5 es una gran casilla.","Cc3 ataca al caballo de d5,
