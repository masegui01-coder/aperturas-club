 diagonal de g7 queda cerrada en parte.","El caballo va a c7, desde donde apoya ...b5 y ...a6.","El rival frena ...b5 con a4 y fija nuestro flanco de dama.","Preparamos ...a6 y ...Tb8 para forzar b5; nuestro flanco de dama gana espacio."]},{"id":"austriaco-c5","name":"Austriaco con 5...c5","moves":"e4 d6 d4 Nf6 Nc3 g6 f4 Bg7 Nf3 c5 dxc5 Qa5 Bd3 Qxc5 Qe2 O-O Be3 Qa5 O-O Bg4","idea":"Golpeamos el centro antes de enrocar: tras dxc5 recuperamos el peón con la dama y presionamos e4 y las diagonales.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Defensa Pirc: un peón modesto que prepara ...Cf6 sin que e5 nos expulse con tempo.","Las blancas ocupan el centro con dos peones; se lo permitimos para atacarlo después.","Atacamos e4 con el caballo y obligamos al rival a defenderlo.","El caballo defiende e4: es la forma más habitual y natural de mantener el peón.","Preparamos el fianchetto: el alfil de g7 presionará d4 y la gran diagonal.","Ataque Austriaco: el rival construye un centro enorme con tres peones.","El alfil se coloca en la gran diagonal apuntando a d4 y b2.","El caballo apoya e5 y d4, y prepara el enroque corto del rival.","Golpe inmediato al centro: si d5, juego tipo Benoni; si dxc5, recuperamos el peón.","El rival cambia en c5; ahora hay que recuperar el peón.","La dama clava el caballo de c3 y amenaza ...Cxe4 aprovechando la clavada.","El alfil defiende e4, que estaba atacado por el caballo de f6 y clavado en c3.","Recuperamos el peón y la dama queda activa en c5, mirando a f2 y g1.","La dama defiende e4 otra vez y prepara Ae3 con tempo sobre nuestra dama.","Enrocamos antes de que el rival lance e5 contra nuestro caballo.","El alfil ataca nuestra dama con tempo y se desarrolla al mismo tiempo.","La dama se retira a a5, desde donde sigue clavando el caballo de c3.","El rival enroca y pone su rey a salvo antes de seguir con su plan.","Clavamos el caballo de f3: el peón de e4 pierde un defensor y e5 se vuelve más difícil."]},{"id":"150","name":"Ataque 150 (4.Be3)","moves":"e4 d6 d4 Nf6 Nc3 g6 Be3 c6 Qd2 b5 f3 Nbd7 Bh6 Bxh6 Qxh6 Bb7 a3 e5","idea":"Contra Dd2 y Ah6, contrajuego rápido en el flanco de dama con ...c6 y ...b5, y golpe en el centro con ...e5.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Defensa Pirc: un peón modesto que prepara ...Cf6 sin que e5 nos expulse con tempo.","Las blancas ocupan el centro con dos peones; se lo permitimos para atacarlo después.","Atacamos e4 con el caballo y obligamos al rival a defenderlo.","El caballo defiende e4: es la forma más habitual y natural de mantener el peón.","Preparamos el fianchetto: el alfil de g7 presionará d4 y la gran diagonal.","Ataque 150: el rival prepara Dd2 y Ah6 para cambiar nuestro alfil de g7.","Retrasamos ...Ag7 y preparamos ...b5: la expansión en el flanco de dama.","La dama sostiene el alfil y prepara Ah6 y el enroque largo.","Ganamos espacio y amenazamos ...b4 echando al caballo de c3 para atacar e4.","El rival defiende e4 con un peón y prepara g4 y h4 contra nuestro rey.","El caballo apoya ...e5 o ...c5 y deja f6 para el otro caballo.","El rival entra con Ah6 para cambiar nuestro alfil de casillas negras antes de que llegue a g7.","Desarrollamos el alfil sólo para cambiarlo: es mejor que retirarlo.","La dama recaptura en h6 y frena nuestro enroque corto.","El alfil va a la gran diagonal, apoya ...b4 y prepara la ruptura ...e5.","El rival evita ...b4, que expulsaría su caballo de c3 y dejaría e4 débil.","Golpe en el centro: la dama de h6 está lejos y abrimos juego para nuestras piezas."]},{"id":"byrne","name":"Variante Byrne (4.Bg5)","moves":"e4 d6 d4 Nf6 Nc3 g6 Bg5 Bg7 Qd2 h6 Bh4 g5 Bg3 Nh5 Nge2 c6 O-O-O Nxg3 hxg3 Nd7","idea":"Ganamos la pareja de alfiles con ...h6, ...g5 y ...Ch5, y nos desarrollamos con calma.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Defensa Pirc: un peón modesto que prepara ...Cf6 sin que e5 nos expulse con tempo.","Las blancas ocupan el centro con dos peones; se lo permitimos para atacarlo después.","Atacamos e4 con el caballo y obligamos al rival a defenderlo.","El caballo defiende e4: es la forma más habitual y natural de mantener el peón.","Preparamos el fianchetto: el alfil de g7 presionará d4 y la gran diagonal.","Variante Byrne: el alfil clava el caballo de f6 y prepara Dd2.","El alfil se coloca en la gran diagonal y presiona d4.","La dama apoya un posible Ah6 y prepara el enroque largo.","Preguntamos al alfil antes de que la dama y el alfil coordinen Ah6.","El alfil se retira a h4 y mantiene la clavada del caballo de f6.","Rompemos la clavada con ...g5; el flanco de rey se debilita, pero ganaremos el alfil.","El alfil se retira a g3 y se queda en la diagonal hacia c7.","El caballo ataca el alfil de g3 para cambiarlo y ganar la pareja de alfiles.","El rival desarrolla y defiende d4 con el caballo, que ya no puede ir a f3.","Preparamos ...Da5 o ...b5 y quitamos d5 y b5 a las piezas blancas.","El rival enroca largo y espera abrir la columna h.","Cambiamos el caballo por el alfil y ganamos la pareja de alfiles.","El rival recaptura hacia el centro y abre la columna h.","Desarrollamos el caballo; planearemos ...Da5 y ...b5 contra el rey blanco."]},{"id":"g3","name":"Sistema con 4.g3","moves":"e4 d6 d4 Nf6 Nc3 g6 g3 Bg7 Bg2 O-O Nge2 e5 O-O c6 a4 a5 h3 Na6","idea":"Contra el fianchetto blanco jugamos ...e5 para disputar el centro y llevamos el caballo a b4.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Defensa Pirc: un peón modesto que prepara ...Cf6 sin que e5 nos expulse con tempo.","Las blancas ocupan el centro con dos peones; se lo permitimos para atacarlo después.","Atacamos e4 con el caballo y obligamos al rival a defenderlo.","El caballo defiende e4: es la forma más habitual y natural de mantener el peón.","Preparamos el fianchetto: el alfil de g7 presionará d4 y la gran diagonal.","El rival hace también el fianchetto y fortalece e4.","El alfil va a g7, a la gran diagonal, donde presiona d4.","El alfil apoya e4 desde g2 y vigila la gran diagonal.","Enrocamos y ponemos el rey a salvo detrás del fianchetto.","El caballo sale por e2 para no tapar el alfil de g2 y apoyar d4.","Golpeamos el centro con ...e5; d4 queda atacado y el alfil de g7 gana fuerza.","El rival enroca y mantiene la tensión en el centro.","Preparamos ...Da5 o ...b5 y controlamos la casilla d5.","El rival impide ...b5 con a4, aunque entrega la casilla b4.","Fijamos a4 y nos aseguramos la casilla b4 para un caballo.","El rival evita ...Ag4 y prepara Ae3 con calma, sin debilitarse.","El caballo va hacia b4 o c7 para apoyar el flanco de dama."]}]},{"id":"petrov","name":"Defensa Petrov","side":"b","eco":"C42–C43","group":"1.e4 e5","blurb":"2...Nf6: contraataque simétrico, muy sólido. Ojo con la trampa 3...Nxe4?","lines":[{"id":"clasica","name":"Clásica (3.Nxe5)","moves":"e4 e5 Nf3 Nf6 Nxe5 d6 Nf3 Nxe4 d4 d5 Bd3 Nc6 O-O Be7 c4 Nb4 Be2 O-O Nc3 Bf5 a3 Nxc3 bxc3 Nc6","idea":"Primero ...d6 y después ...Cxe4. El caballo de e4 es fuerte; si c4, el caballo salta a b4 para cambiar el alfil de d3.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Respondemos simétricamente y disputamos el centro.","El caballo ataca nuestro peón de e5 y se desarrolla hacia el enroque.","Defensa Petrov: en lugar de defender e5, atacamos e4.","El rival toma e5: ahora no hay que copiar con ...Cxe4, primero expulsamos al caballo.","Atacamos el caballo de e5: así recuperamos el peón con seguridad.","El caballo se retira a f3, la retirada más sólida.","Ahora sí recuperamos el peón: el caballo de e4 queda activo.","El rival ocupa el centro y prepara Ad3 para atacar el caballo.","Sostenemos el caballo de e4 con el peón y ocupamos el centro.","El alfil ataca el caballo de e4 y apunta a h7, nuestro futuro punto débil.","Desarrollamos el caballo, que controla d4 y apoya ...Ab4 o ...Cb4.","El rival enroca y pone su rey a salvo antes de seguir con su plan.","Desarrollamos el alfil y preparamos el enroque corto.","El rival ataca d5, el peón que sostiene nuestro caballo: es la forma más incisiva.","El caballo ataca el alfil de d3 para cambiarlo y quitarle al rival la pareja de alfiles.","El alfil se retira y mantiene la pareja de alfiles.","Enrocamos y ponemos el rey a salvo; la tensión en el centro se mantiene.","El caballo ataca nuestro caballo de e4 de nuevo, ahora que el alfil de d3 se ha ido.","El alfil sostiene e4 con el desarrollo más natural.","El rival echa a nuestro caballo de b4 con el peón.","Cambiamos el caballo de e4 por el de c3 antes de que la presión sobre él aumente.","El rival recupera con peón y refuerza d4, aunque su estructura queda algo rígida.","El caballo vuelve a c6 y presiona d4; posición equilibrada y sólida."]},{"id":"nc3","name":"Variante 5.Nc3","moves":"e4 e5 Nf3 Nf6 Nxe5 d6 Nf3 Nxe4 Nc3 Nxc3 dxc3 Be7 Be3 Nc6 Qd2 Be6 O-O-O Qd7","idea":"Enroques opuestos: las negras deben jugar con precisión, desarrollarse rápido y elegir con cuidado dónde enrocar.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Respondemos simétricamente y disputamos el centro.","El caballo ataca nuestro peón de e5 y se desarrolla hacia el enroque.","Defensa Petrov: en lugar de defender e5, atacamos e4.","El rival toma e5 y ahora tenemos que recuperar el peón.","Atacamos el caballo y recuperamos el peón con seguridad.","El caballo se retira a f3, la retirada más sólida.","Recuperamos el peón: ahora que el caballo está en f3, ya no hay trampas en la columna e.","El rival ataca nuestro caballo de e4 con desarrollo y ofrece el cambio.","Cambiamos caballos para no perder tiempo con una retirada.","Recapturan con el peón d para abrir líneas y enrocar largo.","Desarrollamos el alfil y preparamos el enroque corto.","El alfil se desarrolla y prepara Dd2 y el enroque largo.","El caballo sale al desarrollo, controla e5 y d4 y prepara ...Ae6.","La dama conecta piezas y prepara el enroque largo.","El alfil se desarrolla y cubre las casillas claras de nuestro flanco de dama.","El rival enroca largo: habrá enroques opuestos o un medio juego tenso.","La dama conecta las torres; podemos enrocar largo y neutralizar la columna d."]},{"id":"steinitz","name":"Steinitz (3.d4)","moves":"e4 e5 Nf3 Nf6 d4 Nxe4 Bd3 d5 Nxe5 Nd7 Nxd7 Bxd7 O-O Bd6 c4 c6 Nc3 Nxc3 bxc3 dxc4 Bxc4 O-O","idea":"Cambiar el caballo de e5 y desarrollarse con naturalidad; tras los cambios en c3 y c4 tenemos una posición sólida.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Respondemos simétricamente y disputamos el centro.","El caballo ataca nuestro peón de e5 y se desarrolla hacia el enroque.","Atacamos e4 en lugar de defender e5: la idea de la Petrov.","Steinitz: el rival abre el centro con d4 en lugar de tomar en e5.","Tomamos e4: el caballo queda activo en el centro y e5 sigue atacado.","El alfil ataca el caballo de e4 y apunta a h7, nuestro futuro punto débil.","Sostenemos el caballo de e4 con el peón de d5 y ocupamos el centro.","El caballo toma e5 y queda muy activo en el centro.","Desafiamos al caballo de e5 para cambiarlo, la pieza más activa del rival.","El rival cambia los caballos para no perder tiempo.","Recapturamos con el alfil, que se desarrolla al mismo tiempo.","El rival enroca y pone su rey a salvo antes de seguir con su plan.","Desarrollamos el alfil y preparamos el enroque corto.","El rival ataca d5, el peón que sostiene nuestro caballo de e4.","Reforzamos d5 con un peón para mantener el caballo de e4.","El caballo ataca nuestro caballo de e4, que ya defienden sólo los peones.","Cambiamos caballos para no perder tiempo con una retirada.","El rival recaptura con peón y refuerza d4, aunque queda con peones colgantes.","Cambiamos en c4 para abrir el juego y activar nuestras piezas.","El alfil recaptura y queda activo en c4, apuntando a f7.","Enrocamos: posición equilibrada con piezas activas para nosotros."]},{"id":"trampa-nxe4","name":"Trampa 3...Nxe4? 4.Qe2","moves":"e4 e5 Nf3 Nf6 Nxe5 Nxe4 Qe2 Qe7 Qxe4 d6 d4 dxe5 dxe5 Nc6","idea":"Si copiamos con 3...Cxe4? el rival juega 4.De2 y gana material; hay que conocer la mejor defensa para limitar daños.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Respondemos simétricamente y disputamos el centro.","El caballo ataca nuestro peón de e5 y se desarrolla hacia el enroque.","Defensa Petrov: en lugar de defender e5, atacamos e4.","El rival toma e5 y ahora tenemos que recuperar el peón.","Error típico: copiamos y tomamos e4. Lo correcto era 3...d6 primero.","La dama ataca el caballo de e4 y clava la columna e.","Defendemos el caballo. Si 4...Cf6?? 5.Cc6+ descubierto gana nuestra dama.","La dama toma el caballo; el rival ya tiene un peón de ventaja.","Atacamos el caballo de e5 para recuperar la pieza.","El rival defiende el caballo con el peón de d4 y ocupa el centro.","Recuperamos el caballo con el peón de d6; ahora la columna d se abre.","El rival recaptura y se queda con un peón de ventaja.","Desarrollamos el caballo atacando e5; hemos perdido un peón."]},{"id":"cochrane","name":"Gambito Cochrane (4.Nxf7)","moves":"e4 e5 Nf3 Nf6 Nxe5 d6 Nxf7 Kxf7 Nc3 c5 Bc4+ Be6 Bxe6+ Kxe6 d4 Kf7 dxc5 Nc6","idea":"El rival sacrifica un caballo por dos peones; aceptamos, cerramos el centro con ...c5 y ...Ae6 y llevamos el rey a f7 con seguridad.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Respondemos simétricamente y disputamos el centro.","El caballo ataca nuestro peón de e5 y se desarrolla hacia el enroque.","Defensa Petrov: en lugar de defender e5, atacamos e4.","El rival toma e5; ahora debemos expulsar al caballo antes de tomar e4.","Atacamos el caballo de e5: la jugada correcta, en vez de 3...Cxe4?.","Gambito Cochrane: el rival sacrifica el caballo en f7 para sacar a nuestro rey al centro.","Aceptamos: a cambio de dos peones tenemos una pieza de más, y el rey se defenderá bien.","El caballo sale defendiendo e4 y prepara d4 y Ac4+ con ataque.","Controlamos d4 y frenamos el centro blanco; además preparamos ...Cc6.","Jaque con el alfil, que apunta a nuestro rey por la diagonal a2-g8.","Tapamos el jaque con el alfil: ofrecemos cambiarlo, el atacante más peligroso del rival.","El rival cambia alfiles y saca nuestro rey a e6 de momento.","El rey recaptura; parece expuesto, pero el centro está cerrado por nuestros peones.","El rival abre el centro con d4 para buscar líneas contra nuestro rey.","El rey vuelve a f7, una casilla segura; ahora completaremos el desarrollo.","El rival toma en c5; recuperaremos el peón con ...dxc5 y seguiremos con pieza por dos peones.","Desarrollamos el caballo y defendemos e5; seguiremos con ...dxc5 y ...Ae7: tenemos una pieza por dos peones."]},{"id":"qe2","name":"Línea con 5.Qe2","moves":"e4 e5 Nf3 Nf6 Nxe5 d6 Nf3 Nxe4 Qe2 Qe7 d3 Nf6 Bg5 Qxe2+ Bxe2 Be7 Nc3 c6 O-O-O Na6","idea":"El rival busca un final con enroque largo; cambiamos damas, nos desarrollamos y la posición es muy igualada.","notes":["El rival abre con 1.e4: ocupa el centro y abre diagonales a su dama y su alfil.","Respondemos simétricamente y disputamos el centro.","El caballo ataca nuestro peón de e5 y se desarrolla hacia el enroque.","Defensa Petrov: en lugar de defender e5, atacamos e4.","El rival toma e5; ahora debemos expulsar al caballo antes de tomar e4.","Atacamos el caballo de e5 para recuperar el peón con seguridad.","El caballo se retira a f3, la retirada más sólida.","Ahora sí recuperamos el peón con el caballo: ya no hay trampas en la columna e.","La dama clava nuestro caballo de e4 contra el rey por la columna e.","Defendemos el caballo con la dama; si nos descuidamos, d3 lo ganaría.","El rival ataca nuestro caballo con el peón para obligarlo a retirarse.","El caballo vuelve a f6; la columna e sigue con las dos damas enfrentadas.","El alfil clava el caballo de f6 contra nuestra dama de e7.","Cambiamos damas y se acaba la presión por la columna e; el final es muy igualado.","El alfil recaptura y se prepara para enrocar o jugar Cc3 y O-O-O.","Desarrollamos el alfil y desclavamos el caballo de f6.","El caballo sale al desarrollo y prepara el enroque largo.","Quitamos al caballo de c3 las casillas d5 y b5 y preparamos ...Ca6.","Enroque largo: el rey defiende las casillas c2 y d3 en este final.","El caballo va hacia c7 o b4 para completar el desarrollo; luego ...Ce6 o ...h6."]}]},{"id":"dos-caballos-negras","name":"Defensa Dos Caballos y Traxler","side":"b","eco":"C55–C59","group":"1.e4 e5","blurb":"3...Cf6 contra la Italiana: contraataque inmediato a e4. Con 4.Cg5 entregamos un peón por actividad, o jugamos el temerario Contraataque Traxler.","lines":[{"id":"cg5-ca5","name":"Principal (4.Ng5 d5 5.exd5 Na5)","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+ c6 dxc6 bxc6 Be2 h6 Nf3 e4 Ne5 Bd6 d4 exd3 Nxd3 Qc7","idea":"Damos un peón a cambio de un gran desarrollo: expulsamos al caballo y al alfil, y nuestras piezas atacan el flanco de rey blanco.","notes":["El rival abre con el peón de rey, ocupando el centro y liberando dama y alfil.","Respondemos simétricamente con e5: luchamos por el centro y frenamos el avance d4 sin preparación.","El caballo ataca nuestro peón de e5. Es el desarrollo más natural de las blancas.","Defendemos e5 con el caballo de dama, que además controla d4.","El alfil apunta a f7, el punto más débil de nuestro campo, defendido sólo por el rey.","¡La Dos Caballos! En vez de Ac5, atacamos el peón de e4. Es más activo, pero debemos conocer bien la teoría de 4.Cg5.","El caballo salta a g5 y ataca f7 junto con el alfil. Amenaza Cxf7, ganando la dama y la torre en un tenedor.","La defensa correcta: con d5 cortamos la diagonal del alfil hacia f7 y atacamos e4 y el alfil a la vez.","Las blancas capturan; ahora el peón de d5 ataca nuestro caballo de c6 y vuelve a cerrar la defensa de f7.","Retiramos el caballo a a5 atacando el alfil de c4. ¡No juegues 5...Cxd5?, que permite el peligroso ataque Cxf7!","El alfil da jaque desde b5 y sigue defendiendo el peón de d5.","Tapamos el jaque con c6 atacando el alfil. Vamos a devolver la estructura a cambio de ganar tiempos.","El rival toma en c6 para no retroceder el alfil; si hubiese retirado el alfil, seguiríamos con cxd5.","Recapturamos con el peón de b. Hemos dado un peón, pero el alfil de b5 está atacado y lo perseguimos.","El alfil se retira a e2, una casilla defensiva. Las blancas tienen un peón de más pero poco desarrollo.","Expulsamos al caballo de g5 con h6. Cada tiempo que el rival gasta en mover piezas atrás es un tiempo para nosotros.","El caballo vuelve a f3 y ataca nuestro peón de e5.","Avanzamos el peón con tiempo: atacamos el caballo de f3 y ganamos espacio. Este peón será una cuña en el campo blanco.","El caballo se centraliza en e5, la casilla más activa disponible.","Desarrollamos el alfil a d6, atacando el caballo de e5 y apuntando al enroque blanco por la diagonal h2.","Las blancas defienden el caballo con d4. Si retiran el caballo, nuestro ataque con Dc7 y O-O sigue creciendo.","Capturamos al paso: exd3. Abrimos el juego y el caballo de e5 tendrá que retroceder a d3 para recuperar el peón.","El caballo recaptura en d3. El rival mantiene el peón de más, pero su desarrollo está atrasado.","La dama se une a la diagonal h2 con el alfil, amenazando Axh2. Seguiremos con O-O y Te8: buena compensación por el peón."]},{"id":"d3","name":"Variante tranquila (4.d3)","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Be7 O-O O-O Re1 d6 c3 Na5 Bb5 a6 Ba4 b5 Bc2 c5","idea":"Contra la línea lenta 4.d3 nos desarrollamos con solidez: Ae7, O-O, d6 y luego ganamos espacio en el flanco de dama con Ca5, b5 y c5.","notes":["El rival abre con el peón de rey, ocupando el centro y liberando dama y alfil.","Respondemos simétricamente con e5: luchamos por el centro y frenamos el avance d4 sin preparación.","El caballo ataca nuestro peón de e5. Es el desarrollo más natural de las blancas.","Defendemos e5 con el caballo de dama, que además controla d4.","El alfil apunta a f7, el punto más débil de nuestro campo, defendido sólo por el rey.","¡La Dos Caballos! En vez de Ac5, atacamos el peón de e4. Es más activo, pero debemos conocer bien la teoría de 4.Cg5.","Con d3 las blancas defienden e4 de forma tranquila. Evitan la teoría aguda y buscan una partida de maniobras.","Desarrollamos el alfil a e7, una casilla sólida que defiende el rey y no se expone a Cg5 ni a b4.","El rival enroca y pone el rey a salvo; su plan será c3, Te1 y quizá d4.","Enrocamos también. Ahora nuestro rey está seguro y la torre puede entrar en juego.","La torre va a e1 para apoyar el centro y la posible ruptura d4.","Con d6 sostenemos e5 y abrimos la diagonal del alfil de c8.","Las blancas juegan c3 para preparar d4 y dar al alfil de c4 la retirada a c2 por b3.","Atacamos el alfil de c4 con el caballo. Queremos quitarle la diagonal hacia f7 o cambiarlo.","El alfil se va a b5 en vez de retirarse; amenaza molestar y luego retroceder por a4.","Con a6 preguntamos al alfil adónde va. Ganamos espacio en el flanco de dama con tiempo.","El alfil se retira a a4, conservando la diagonal hacia e8.","Seguimos expulsando al alfil con b5. Ganamos aún más espacio en el flanco de dama.","El alfil se esconde en c2, donde apoya e4 y apunta hacia nuestro flanco de rey.","Completamos el plan con c5: controlamos d4 y tenemos mucho espacio. Posición equilibrada, al estilo de la Española."]},{"id":"d4-oo","name":"Variante 4.d4 exd4 5.O-O","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 d4 exd4 O-O Nxe4 Re1 d5 Bxd5 Qxd5 Nc3 Qa5 Nxe4 Be6 Neg5 O-O-O Nxe6 fxe6 Rxe6 Bd6","idea":"Tomamos e4 y devolvemos material con precisión: d5, Da5 y O-O-O. Llegamos a una posición sana con buen desarrollo.","notes":["El rival abre con el peón de rey, ocupando el centro y liberando dama y alfil.","Respondemos simétricamente con e5: luchamos por el centro y frenamos el avance d4 sin preparación.","El caballo ataca nuestro peón de e5. Es el desarrollo más natural de las blancas.","Defendemos e5 con el caballo de dama, que además controla d4.","El alfil apunta a f7, el punto más débil de nuestro campo, defendido sólo por el rey.","¡La Dos Caballos! En vez de Ac5, atacamos el peón de e4. Es más activo, pero debemos conocer bien la teoría de 4.Cg5.","Las blancas abren el centro de inmediato con d4, buscando juego rápido de piezas.","Capturamos en d4. Ahora el centro se abre y nuestro caballo de f6 podrá tomar en e4.","El rival enroca sin defender e4, ofreciéndolo para abrir la columna e contra nuestro rey.","Tomamos el peón de e4. Hay que conocer bien la continuación, porque las blancas abrirán la columna e.","La torre clava nuestro caballo de e4 contra el rey en la columna e.","Con d5 defendemos el caballo y atacamos el alfil de c4. Es la única jugada buena: devolvemos material con tiempo.","El alfil toma en d5 para abrir líneas, aunque será capturado por la dama.","Recapturamos con la dama, que queda centralizada y defiende el caballo de e4.","El caballo ataca nuestra dama y presiona el caballo de e4, que sigue clavado.","La dama se aparta a a5, desde donde vigila la quinta fila (e5 y g5). Es la retirada más usada.","Las blancas toman nuestro caballo, que no podía defenderse más.","Desarrollamos el alfil a e6: tapa la columna e y frena las descubiertas del caballo blanco de e4.","El caballo salta a g5 para atacar el alfil de e6 y cambiarlo por un caballo.","Enroque largo: ponemos el rey a salvo y la torre de d8 apoya nuestro peón de d4.","Las blancas cambian el caballo por nuestro alfil de e6.","Recapturamos con el peón f. La columna f queda abierta para nuestra torre.","La torre toma el peón de e6. Material igualado, pero nuestras piezas están activas.","Desarrollamos el alfil a d6 conectando las torres. Posición equilibrada con buen juego para nosotros."]},{"id":"traxler-cxf7","name":"Contraataque Traxler (4...Bc5 5.Nxf7)","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 Bc5 Nxf7 Bxf2+ Kxf2 Nxe4+ Kg1 Qh4 g3 Nxg3 hxg3 Qxg3+ Kf1 Rf8","idea":"Ignoramos la amenaza a f7 y contraatacamos f2. Si el rival toma con el caballo, sacrificamos el alfil y atacamos al rey sin enroque.","notes":["El rival abre con el peón de rey, ocupando el centro y liberando dama y alfil.","Respondemos simétricamente con e5: luchamos por el centro y frenamos el avance d4 sin preparación.","El caballo ataca nuestro peón de e5. Es el desarrollo más natural de las blancas.","Defendemos e5 con el caballo de dama, que además controla d4.","El alfil apunta a f7, el punto más débil de nuestro campo, defendido sólo por el rey.","¡La Dos Caballos! En vez de Ac5, atacamos el peón de e4. Es más activo, pero debemos conocer bien la teoría de 4.Cg5.","El caballo amenaza Cxf7, ganando material. Es el momento de decidir entre 4...d5 y el Traxler.","¡El Traxler! No defendemos f7: contraatacamos f2 con el alfil. Es muy agudo y requiere conocer las jugadas exactas.","El rival acepta el reto y toma en f7, atacando la dama y la torre de h8.","¡Sacrificamos el alfil en f2 con jaque! Sacamos al rey blanco de su refugio antes de que pueda enrocar.","El rey captura el alfil y queda expuesto en el centro.","Tomamos e4 con jaque: el caballo entra con ganancia de tiempo y abrimos la diagonal de la dama hacia h4.","El rey se esconde en g1, pero su torre de h1 queda encerrada. La alternativa principal es 7.Re3, aún más compleja.","La dama ataca f2 y amenaza Df2 mate. El rival debe defenderse con precisión.","Las blancas tapan la diagonal con g3, la defensa natural pero imprecisa: lo más resistente era 8.Df1.","Sacrificamos también el caballo en g3 para abrir la columna g hacia el rey blanco.","El rival toma el caballo con el peón h. Ahora la columna h queda abierta pero el rey está desnudo.","Damos jaque con la dama en g3 y seguimos persiguiendo al rey, que ya no tiene peones delante.","El rey huye a f1 para escapar de los jaques; en g1 o h1 recibiría jaques continuos.","La torre entra por la columna f y ataca el caballo de f7. Las negras tienen un ataque ganador: por eso 9.hxg3 era un error."]},{"id":"traxler-axf7","name":"Traxler con 5.Bxf7+","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 Bc5 Bxf7+ Ke7 Bb3 Rf8 O-O d6 c3 Qe8 d4 Bb6","idea":"Ante 5.Axf7+ el rey va a e7 y la columna f se abre para nuestra torre. Con De8-g6 buscamos atacar g2 y el enroque blanco.","notes":["El rival abre con el peón de rey, ocupando el centro y liberando dama y alfil.","Respondemos simétricamente con e5: luchamos por el centro y frenamos el avance d4 sin preparación.","El caballo ataca nuestro peón de e5. Es el desarrollo más natural de las blancas.","Defendemos e5 con el caballo de dama, que además controla d4.","El alfil apunta a f7, el punto más débil de nuestro campo, defendido sólo por el rey.","¡La Dos Caballos! En vez de Ac5, atacamos el peón de e4. Es más activo, pero debemos conocer bien la teoría de 4.Cg5.","El caballo va a g5 y amenaza f7 junto con el alfil de c4.","Jugamos el Traxler: el alfil apunta a f2 y dejamos f7 sin defensa a cambio de contraataque.","El rival toma en f7 con el alfil y jaque. Es la respuesta más segura de las blancas ante el Traxler.","El rey va a e7. Ha perdido el enroque, pero la columna f se abre para nuestra torre y el centro está bien cubierto.","El alfil se retira a b3 y conserva la diagonal a2-g8 hacia nuestro rey.","La torre ocupa la columna f, atacando f2 junto con el alfil de c5.","Las blancas enrocan y defienden f2 con la torre de f1.","Con d6 abrimos la diagonal del alfil de c8 y aseguramos e5.","El rival prepara d4 con c3 para atacar nuestro alfil de c5.","La dama va a e8 para pasar luego a g6, presionando g2 junto con la torre de la columna f. Es el plan típico.","Las blancas rompen en el centro con d4 y atacan nuestro alfil.","Retiramos el alfil a b6, donde sigue presionando d4 y f2. Tenemos juego activo a cambio del peón."]},{"id":"d4-e5","name":"Variante 4.d4 exd4 5.e5","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 d4 exd4 e5 d5 Bb5 Ne4 Nxd4 Bd7 Bxc6 bxc6 O-O Be7 f3 Nc5","idea":"Contra el avance e5 contraatacamos con d5 y colocamos el caballo en e4. Luego desarrollamos con Ad7 y Ae7 con buena posición.","notes":["El rival abre con el peón de rey, ocupando el centro y liberando dama y alfil.","Respondemos simétricamente con e5: luchamos por el centro y frenamos el avance d4 sin preparación.","El caballo ataca nuestro peón de e5. Es el desarrollo más natural de las blancas.","Defendemos e5 con el caballo de dama, que además controla d4.","El alfil apunta a f7, el punto más débil de nuestro campo, defendido sólo por el rey.","¡La Dos Caballos! En vez de Ac5, atacamos el peón de e4. Es más activo, pero debemos conocer bien la teoría de 4.Cg5.","Las blancas abren el centro con d4, en lugar de 4.Cg5.","Capturamos en d4: ganamos un peón y obligamos al rival a dar explicaciones.","El rival ataca nuestro caballo de f6 con e5. Hay que responder activamente.","¡Contraatacamos con d5! Atacamos el alfil de c4 en lugar de retirar el caballo.","El alfil se aparta a b5 y clava nuestro caballo de c6 contra el rey.","El caballo salta a e4, una casilla central fuerte donde no puede ser expulsado con facilidad.","Las blancas recuperan el peón de d4 y su caballo queda centralizado.","Desarrollamos el alfil a d7 y rompemos la clavada sobre el caballo de c6.","El rival cambia alfil por caballo para debilitar nuestra estructura de peones.","Recapturamos con el peón de b. Tenemos los peones algo débiles, pero la pareja de alfiles y el centro.","Las blancas enrocan y ponen el rey a salvo antes de seguir con f3.","Desarrollamos el alfil a e7 y preparamos el enroque.","El rival expulsa el caballo de e4 con f3 y prepara f4.","Retiramos el caballo a c5, donde controla e4 y d3. Posición equilibrada con la pareja de alfiles a nuestro favor."]},{"id":"cxd5-peligro","name":"Error 5...Nxd5? y el Hígado Frito (6.Nxf7)","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+ Ke6 Nc3 Nb4 Qe4 c6 a3 Na6 d4 Nc7","idea":"5...Cxd5? permite el ataque «Hígado Frito»: el rey queda en el centro. Si caes en esta línea, debes conocer la defensa con Cb4, c6 y Ca6-c7.","notes":["El rival abre con el peón de rey, ocupando el centro y liberando dama y alfil.","Respondemos simétricamente con e5: luchamos por el centro y frenamos el avance d4 sin preparación.","El caballo ataca nuestro peón de e5. Es el desarrollo más natural de las blancas.","Defendemos e5 con el caballo de dama, que además controla d4.","El alfil apunta a f7, el punto más débil de nuestro campo, defendido sólo por el rey.","¡La Dos Caballos! En vez de Ac5, atacamos el peón de e4. Es más activo, pero debemos conocer bien la teoría de 4.Cg5.","El caballo ataca f7 junto con el alfil: amenaza un tenedor a dama y torre.","Con d5 bloqueamos la diagonal del alfil. Hasta aquí todo es correcto.","El rival captura en d5 y ataca nuestro caballo de c6.","¡Imprecisión! Recapturar con el caballo parece natural, pero deja el punto f7 vulnerable a un sacrificio. Lo correcto es 5...Ca5.","El sacrificio del Hígado Frito: el caballo toma f7 y ataca la dama y la torre a la vez.","Tenemos que tomar el caballo; si no, perdemos la dama o la torre.","Jaque de la dama, que también ataca el caballo de d5, que está clavado por el alfil de c4.","El rey va a e6 para defender el caballo de d5. Es la única forma de no perder material.","Las blancas suman otro atacante a d5. El caballo clavado está en apuros.","Llevamos el caballo de c6 a b4 para defender d5 y amenazar Cxc2+ con tenedor.","La dama vuelve a e4 y sigue presionando la columna e y el caballo de d5.","Reforzamos el caballo de d5 con c6. Ahora tiene un defensor sólido.","El rival expulsa el caballo de b4 con a3; ya no hay amenaza en c2.","Retiramos el caballo a a6, desde donde irá a c7 para reforzar aún más el centro.","Las blancas abren el centro con d4 para atacar a nuestro rey.","El caballo llega a c7 y defiende d5 y e6. Hemos sobrevivido, pero el rey sigue expuesto: evita 5...Cxd5 en tus partidas."]}]},{"id":"india-rey","name":"India de Rey","side":"b","eco":"E60–E99","group":"1.d4","blurb":"Fianchetto y ...e5: ceder el centro para atacarlo, con juego agudo en el flanco de rey.","lines":[{"id":"clasica","name":"Clásica (Mar del Plata)","moves":"d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O Be2 e5 O-O Nc6 d5 Ne7 Ne1 Nd7 Be3 f5 f3 f4 Bf2 g5","idea":"Centro cerrado: las negras atacan con ...f5, ...f4 y ...g5 en el flanco de rey mientras las blancas avanzan c5 en el de dama. Gana quien llegue antes.","notes":["Las blancas ocupan el centro con el peón de dama y controlan e5 y c5.","Desarrollamos el caballo a f6: controla e4 y d5 e impide que el rival juegue e4 de inmediato.","Las blancas ganan más espacio en el centro y preparan Cc3 para insistir en e4.","Preparamos el fianchetto: el alfil irá a g7, la casilla clave de la India de Rey.","El caballo blanco apoya el avance e4 y vigila d5; las blancas quieren un centro completo.","El alfil se instala en la gran diagonal; desde g7 presionará d4 y protegerá a nuestro rey.","Las blancas forman el gran centro c4-d4-e4. Les dejamos hacerlo: luego lo atacaremos.","Con ...d6 frenamos e5 y preparamos el golpe ...e5 contra el centro blanco.","Desarrollo clásico y sólido: el caballo protege d4 y deja libre al alfil de casillas blancas.","Enrocamos antes de abrir el juego; nuestro rey queda muy bien protegido detrás del alfil de g7.","El alfil a e2 prepara el enroque. Es la Variante Clásica, la más jugada al máximo nivel.","El golpe típico: ...e5 discute el centro. Si 8.dxe5 dxe5 9.Dxd8 Txd8, el final es cómodo para nosotros.","Las blancas enrocan y mantienen la tensión; tomar en e5 no les da nada.","Presionamos d4 con el caballo. Obligamos al rival a decidir: o cierra con d5 o cede el centro.","Las blancas cierran el centro ganando espacio y un tiempo sobre el caballo de c6.","El caballo va a e7, desde donde no estorba al peón f y podrá ir a g6 o f5 para el ataque.","Retirada típica: el caballo va a d3 para apoyar c5 y deja paso al peón f.","Retiramos el caballo para liberar el peón f: el plan es ...f5. Además vigilamos c5.","El alfil a e3 controla c5 y prepara f3 para sujetar el punto e4.","El avance clave: ...f5 ataca el centro y abre camino al ataque contra el rey blanco.","Las blancas refuerzan e4 con f3. Si tomaran exf5, nuestro caballo de e7 o el alfil recapturan con buen juego.","Ganamos espacio: ...f4 echa al alfil de e3 y el plan es ...g5-g4 para romper el enroque blanco.","El alfil se retira a f2, desde donde todavía mira c5 y a7.","Seguimos con ...g5 para preparar ...g4. Las blancas atacarán con c5; nuestro contraataque debe ser rápido."]},{"id":"bayoneta","name":"Ataque Bayoneta (9.b4)","moves":"d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O Be2 e5 O-O Nc6 d5 Ne7 b4 Nh5 Re1 f5 Ng5 Nf6 Bf3 c6","idea":"Contra el avance rápido b4-c5, el caballo salta a h5 para preparar ...f5 sin perder tiempo; luego ...c6 discute el centro en el flanco donde atacan las blancas.","notes":["Las blancas abren con el peón de dama, ocupando el centro.","Caballo a f6: controla e4 y mantiene la flexibilidad para el fianchetto.","El peón c ataca d5 y gana espacio en el flanco de dama.","Preparamos Ag7, el alfil que será el corazón de nuestra defensa.","Las blancas desarrollan y preparan e4 para formar el gran centro.","El alfil a g7 presiona la gran diagonal hacia d4 y b2.","Las blancas construyen el centro completo con e4; no lo impedimos, lo atacaremos con ...e5.","...d6 controla e5 y prepara nuestro golpe ...e5; además frena cualquier avance e5 del rival.","El caballo de rey protege d4; es la configuración clásica.","Enrocamos: el rey está a salvo antes de que empiece la lucha.","Las blancas preparan el enroque con Ae2, la configuración más sólida.","Atacamos el centro con ...e5, la jugada típica de la India de Rey.","Las blancas enrocan. Si 8.dxe5 dxe5 9.Dxd8, el final es igual y sin problemas para nosotros.","Presionamos d4 con el caballo y obligamos a las blancas a definir el centro.","Las blancas cierran con d5, ganando espacio y un tiempo.","El caballo va a e7 para despejar el peón f y apoyar ...f5.","El Ataque Bayoneta: b4 prepara c5 para abrir la columna c. Es la línea más peligrosa contra nosotros.","El caballo va a h5 para preparar ...f5 sin perder tiempo y amenaza saltar a f4, una casilla excelente.","La torre a e1 protege e4 y deja f1 libre para el alfil si nuestro caballo llega a f4.","El plan de siempre: ...f5 ataca e4 y abre la columna f para nuestras torres.","El caballo a g5 apunta a e6 y f7 y presiona e4. Las blancas quieren cambiar nuestro caballo de h5.","El caballo vuelve a f6 para defender e4... y presionarlo; ya cumplió su misión de forzar ...f5.","El alfil a f3 refuerza e4 y prepara cambiar en h5 si fuera necesario.","Con ...c6 discutimos d5 y abrimos juego en el flanco de dama, justo donde atacan las blancas, para no quedar pasivos."]},{"id":"gligoric","name":"Gligoric (7.Be3)","moves":"d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O Be2 e5 Be3 Ng4 Bg5 f6 Bh4 g5 Bg3 Nh6 d5 f5","idea":"Contra 7.Ae3 atacamos el alfil con ...Cg4 y ganamos espacio con ...f6 y ...g5; el caballo de h6 apoya la ruptura ...f5.","notes":["Las blancas ocupan el centro con d4 y controlan e5 y c5.","Desarrollamos el caballo y controlamos e4 y d5: es la primera jugada de la India de Rey.","Las blancas toman más espacio con c4 y presionan la casilla d5.","Preparamos el fianchetto del alfil de rey, que irá a g7.","El caballo de dama apoya el avance e4, que formará el gran centro.","El alfil a g7: presión sobre d4 y seguridad para el rey.","El gran centro blanco: lo atacaremos más tarde con peones.","...d6 prepara ...e5 y frena el avance e5 del rival.","Desarrollo natural del caballo de rey: protege d4 y prepara el enroque.","Enroque rápido antes de abrir el juego: el rey queda protegido por el alfil de g7.","Las blancas preparan el enroque con Ae2, la configuración clásica.","Golpeamos el centro con ...e5. Si 8.dxe5 dxe5 9.Dxd8 Txd8, el final es cómodo para nosotros.","La Variante Gligoric: Ae3 no enroca todavía y presiona e5; si ...exd4, Cxd4
