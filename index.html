ola e4.","El rival saca el otro caballo y presiona d5 una vez más.","Tomamos en c4. Ahora amenazamos b5 para defender el peón de más.","Con a4 las blancas impiden b5 y así recuperarán el peón de c4 tarde o temprano.","¡Sacamos el alfil a f5 antes de jugar e6! Es la gran ventaja de la Eslava: el alfil de dama queda activo fuera de la cadena.","Las blancas preparan recuperar el peón con el alfil de f1.","Con e6 cerramos la estructura y abrimos la diagonal del alfil de f8.","El rival recupera el peón. Ahora tiene buen desarrollo pero su peón de a4 debilitó b4.","El alfil va a b4, una casilla ideal gracias a a4: clava el caballo de c3 y controla e4.","Las blancas enrocan y ponen el rey a salvo; su plan es preparar e4 con De2.","El caballo va a d7 para apoyar e5 y c5, y no bloquear el peón de c6.","La dama prepara el avance e4 y apoya el alfil de c4 desde e2.","Retiramos el alfil a g6 de forma preventiva: ya lo amenazaba e4 y aquí sigue vigilando e4 y d3.","El rival juega e4 y ocupa el centro; por eso habíamos retirado ya el alfil a g6.","Enrocamos. Nuestro rey está seguro y el centro blanco aún no causa problemas.","El alfil va a d3 para defender e4, evitando también la presión de nuestro alfil de g6.","El alfil se coloca en h5 y clava el caballo de f3 contra la dama de e2.","Las blancas avanzan e5 y expulsan nuestro caballo de f6.","El caballo se instala en d5, una magnífica casilla central. Posición sólida y equilibrada."]},{"id":"meran","name":"Semieslava Meran (6.Bd3 dxc4 7.Bxc4 b5)","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 e3 Nbd7 Bd3 dxc4 Bxc4 b5 Bd3 Bb7 O-O a6 e4 c5","idea":"Con ...dxc4 y ...b5 ganamos tiempo contra el alfil y expandimos el flanco de dama. La ruptura ...c5 libera nuestro juego.","notes":["El rival abre con el peón de dama y ocupa el centro.","Respondemos con d5: disputamos el centro y frenamos e4.","El Gambito de Dama: las blancas atacan d5 para desviar nuestro peón del centro.","¡La Eslava! Defendemos d5 con c6 sin encerrar el alfil de c8, que podrá salir a f5 o g4.","El caballo de rey sale a f3, controla e5 y apoya el peón de d4.","Desarrollamos el caballo, que defiende d5 y controla la casilla e4.","El rival saca el caballo de dama y presiona d5 por segunda vez.","¡La Semieslava! Con e6 reforzamos d5. Nuestro alfil de c8 queda dentro, pero lo sacaremos por b7.","Las blancas juegan e3 con calma, defendiendo c4 y preparando Ad3.","El caballo va a d7 para apoyar las rupturas e5 y c5.","El alfil sale a d3 y apunta a nuestro flanco de rey.","Tomamos en c4 para ganar un tiempo: el alfil tendrá que moverse dos veces.","El rival recupera el peón con el alfil, que ahora queda expuesto en c4.","¡La Meran! Atacamos el alfil con b5 y preparamos Ab7 por la gran diagonal.","El alfil se retira a d3, su mejor casilla, apuntando a h7 y apoyando e4.","Nuestro alfil de dama sale a b7, en la gran diagonal hacia e4 y g2.","Las blancas enrocan y ponen el rey a salvo antes de abrir el centro.","Con a6 preparamos c5 y aseguramos b5. Es la preparación clásica de la ruptura.","El rival ocupa el centro con e4 y amenaza avanzar e5 contra nuestro caballo.","¡Rompemos con c5! Atacamos d4 y abrimos la diagonal del alfil de b7. Tenemos juego activo e igualdad."]},{"id":"botvinnik","name":"Semieslava Botvinnik (5.Bg5 dxc4)","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 Bg5 dxc4 e4 b5 e5 h6 Bh4 g5 Nxg5 hxg5 Bxg5 Nbd7 exf6 Bb7 g3 c5 d5 Qb6","idea":"Línea ultra aguda: tomamos c4, defendemos con ...b5 y aceptamos el sacrificio en g5. Atacamos el centro con ...c5 y ...Db6, y luego enroque largo.","notes":["El rival abre con el peón de dama y ocupa el centro.","Respondemos con d5: disputamos el centro y frenamos e4.","El Gambito de Dama: las blancas atacan d5 para desviar nuestro peón del centro.","¡La Eslava! Defendemos d5 con c6 sin encerrar el alfil de c8, que podrá salir a f5 o g4.","Las blancas desarrollan el caballo de rey, que controla e5.","Desarrollamos el caballo, que defiende d5 y vigila e4.","El rival saca el caballo de dama y aumenta la presión sobre d5.","Con e6 pasamos a la Semieslava: d5 queda sólidamente defendido por dos peones.","El alfil clava nuestro caballo de f6. Es la línea más ambiciosa de las blancas.","¡La Botvinnik! Tomamos en c4 y vamos a defender ese peón con b5. La partida será muy aguda.","El rival ocupa el centro con e4, aprovechando que d5 ya no está.","Defendemos el peón de c4 con b5. Tendremos peones de más en el flanco de dama.","Las blancas atacan nuestro caballo de f6 con el avance e5.","Con h6 obligamos al alfil a decidirse. Ya no hay vuelta atrás.","El alfil mantiene la clavada desde h4; el caballo de f6 sigue atacado por el peón de e5.","Rompemos la clavada con g5. Al rival le queda sacrificar el caballo en g5.","El sacrificio típico de la Botvinnik: el caballo toma g5 para mantener la presión sobre f6.","Aceptamos el caballo. El peón de g5 queda atacado por el alfil de h4.","El alfil recupera un peón y vuelve a clavar el caballo de f6.","El caballo va a d7 para ir a b6 o apoyar c5. El caballo de f6 se perderá, pero a cambio el peón de f6 quedará expuesto.","Las blancas toman el caballo de f6: ahora tienen un peón muy molesto en f6.","El alfil sale a b7, en la gran diagonal; en cuanto se mueva el peón de c6 apuntará a h1.","El rival prepara el alfil en g2 para tapar la gran diagonal.","¡Rompemos con c5! Atacamos d4 y abrimos la diagonal del alfil de b7 hacia g2 y h1.","Las blancas cierran la diagonal con d5 y ganan espacio.","La dama sale a b6, atacando la diagonal hacia f2 y preparando el enroque largo. Línea muy compleja con chances para los dos bandos."]},{"id":"moscu","name":"Semieslava Moscú (5.Bg5 h6)","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 Bg5 h6 Bxf6 Qxf6 e3 Nd7 Bd3 dxc4 Bxc4 g6 O-O Bg7","idea":"Con ...h6 obligamos a cambiar el alfil por el caballo y nos quedamos con la pareja de alfiles. Fianchettamos el alfil de f8 y preparamos ...e5.","notes":["El rival abre con el peón de dama y ocupa el centro.","Respondemos con d5: disputamos el centro y frenamos e4.","El Gambito de Dama: las blancas atacan d5 para desviar nuestro peón del centro.","¡La Eslava! Defendemos d5 con c6 sin encerrar el alfil de c8, que podrá salir a f5 o g4.","El caballo sale a f3 y controla e5, como en casi todas las líneas.","Desarrollamos el caballo, que defiende d5 y vigila e4.","El rival saca el caballo de dama y aumenta la presión sobre d5.","Pasamos a la Semieslava con e6: estructura muy sólida con d5 bien protegido.","El alfil clava nuestro caballo de f6 y aumenta la presión indirecta sobre d5.","¡La Variante Moscú! Preguntamos al alfil con h6 en lugar de la aguda Botvinnik.","El rival cambia en f6 para no perder tiempos. Si retirase a h4, seguiríamos con dxc4 y g5.","Recapturamos con la dama. Tenemos la pareja de alfiles a largo plazo.","Las blancas juegan e3 y preparan el desarrollo del alfil de f1.","El caballo va a d7 para apoyar la ruptura e5 más adelante.","El alfil se coloca en d3, mirando a nuestro flanco de rey.","Tomamos en c4 y obligamos al alfil a mover otra vez.","El rival recupera el peón con el alfil, que ahora queda expuesto en c4.","Preparamos el fianchetto: desde g7 el alfil apoyará la ruptura e5.","Las blancas enrocan y ponen el rey a salvo antes de abrir el centro.","El alfil llega a g7. Nuestros dos alfiles y la ruptura e5 dan una posición sólida con buen futuro."]},{"id":"chebanenko","name":"Eslava Chebanenko (4...a6)","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 a6 e3 b5 b3 Bg4 Be2 e6 O-O Nbd7","idea":"Con ...a6 preparamos ...b5 para ganar espacio en el flanco de dama y presionar c4. Luego desarrollamos el alfil de c8 antes de ...e6.","notes":["El rival abre con el peón de dama y ocupa el centro.","Respondemos con d5: disputamos el centro y frenamos e4.","El Gambito de Dama: las blancas atacan d5 para desviar nuestro peón del centro.","¡La Eslava! Defendemos d5 con c6 sin encerrar el alfil de c8, que podrá salir a f5 o g4.","El caballo de rey sale a f3, controla e5 y vigila d4.","Desarrollamos el caballo, que defiende d5 y controla la casilla e4.","El rival saca el caballo de dama y presiona d5 por segunda vez.","¡La Chebanenko! Con a6 preparamos b5, que gana espacio y presiona c4.","Las blancas juegan e3 de forma sólida, defendiendo c4.","Avanzamos b5 para presionar c4 y ganar espacio en el flanco de dama.","El rival refuerza c4 con b3 para no permitir dxc4 con un peón de más.","Sacamos el alfil a g4 antes de cerrar con e6. Clavamos el caballo de f3.","Las blancas desarrollan el alfil y rompen la clavada.","Con e6 abrimos la diagonal del alfil de f8 y reforzamos d5.","El rival enroca y pone el rey a salvo; su desarrollo está casi completo.","El caballo va a d7, preparando c5 o e5. Posición sólida con espacio en el flanco de dama."]},{"id":"cambio","name":"Variante del Cambio (3.cxd5)","moves":"d4 d5 c4 c6 cxd5 cxd5 Nc3 Nf6 Nf3 Nc6 Bf4 Bf5 e3 e6 Bb5 Nd7 O-O Be7 Rc1 O-O","idea":"Estructura simétrica con la columna c abierta. Jugamos con calma: Ac6, Af5, e6 y enroque, y la igualdad es muy segura.","notes":["El rival abre con el peón de dama y ocupa el centro.","Respondemos con d5: disputamos el centro y frenamos e4.","El Gambito de Dama: las blancas atacan d5 para desviar nuestro peón del centro.","¡La Eslava! Defendemos d5 con c6 sin encerrar el alfil de c8, que podrá salir a f5 o g4.","Las blancas cambian en d5, buscando una posición simétrica y tranquila.","Recapturamos con el peón de c. La estructura queda simétrica y la columna c se abre.","El rival desarrolla el caballo de dama y presiona nuestro peón de d5.","Desarrollamos el caballo, que defiende d5 y vigila e4.","Las blancas sacan el otro caballo, que controla e5.","El caballo de dama sale a c6, donde controla d4 y e5 en la estructura simétrica.","El alfil sale a f4 antes de jugar e3, para no encerrarlo.","Copiamos la idea: el alfil sale a f5 antes de e6, así no queda encerrado.","El rival abre la diagonal de su alfil de f1 y refuerza d4.","Con e6 abrimos la diagonal del alfil de f8 y reforzamos d5.","El alfil clava nuestro caballo de c6 y amenaza Ce5 con presión.","El caballo va a d7 para apoyar e5 o c5, evitando también Ce5 del rival.","Las blancas enrocan y ponen el rey a salvo antes de abrir el centro.","Desarrollamos el alfil a e7 y preparamos el enroque.","La torre toma la columna c abierta, la única columna abierta del tablero.","Enrocamos. Posición equilibrada y muy sólida; jugaremos Tc8 para disputar la columna c."]},{"id":"e3-af5","name":"Eslava con 4.e3 Bf5","moves":"d4 d5 c4 c6 Nf3 Nf6 e3 Bf5 Nc3 e6 Nh4 Bg6 Nxg6 hxg6 Bd3 Nbd7 O-O Bd6","idea":"Contra 4.e3 sacamos el alfil a f5 al instante. Si el rival lo caza con Ch4, recapturamos hacia el centro con hxg6 y abrimos la columna h.","notes":["El rival abre con el peón de dama y ocupa el centro.","Respondemos con d5: disputamos el centro y frenamos e4.","El Gambito de Dama: las blancas atacan d5 para desviar nuestro peón del centro.","¡La Eslava! Defendemos d5 con c6 sin encerrar el alfil de c8, que podrá salir a f5 o g4.","Las blancas desarrollan el caballo de rey, que controla e5.","Desarrollamos el caballo, que defiende d5 y vigila e4.","Con e3 el rival protege c4 y prepara Ad3, pero encierra su alfil de c1.","¡El alfil sale a f5! Ahora queda fuera de la cadena de peones antes de jugar e6.","El rival saca el caballo de dama y aumenta la presión sobre d5.","Con e6 completamos la estructura sólida de la Eslava.","El caballo va a h4 para cambiar nuestro alfil, que es una pieza muy buena.","Retiramos el alfil a g6. Si nos lo cambian, la columna h se abrirá para nuestra torre.","Las blancas cambian el caballo por nuestro alfil, ganando la pareja de alfiles.","Recapturamos con el peón h: la columna h queda abierta y g6 refuerza nuestro rey.","El alfil sale a d3, apuntando hacia nuestro flanco de rey por la diagonal b1-h7.","El caballo va a d7 para apoyar la ruptura e5 y dejar libre c6.","El rival enroca y pone el rey a salvo; su desarrollo está casi completo.","Desarrollamos el alfil a d6, apuntando a h2. Junto con la torre en la columna h, el enroque blanco puede sufrir."]}]},{"id":"albin","name":"Contragambito Albin","side":"b","eco":"D08–D09","group":"1.d4 d5","blurb":"2...e5 contra el Gambito de Dama: un peón por la cuña de d4 y un juego muy activo, a menudo con enroque largo y ataque.","lines":[{"id":"principal-g3","name":"Principal (4.Nf3 Nc6 5.g3)","moves":"d4 d5 c4 e5 dxe5 d4 Nf3 Nc6 g3 Be6 Nbd2 Qd7 Bg2 O-O-O O-O Bh3 Qa4 Bxg2 Kxg2 Kb8","idea":"Con ...Ae6, ...Dd7 y enroque largo cambiamos el alfil de g2 con ...Ah3 y preparamos el avance de peones del flanco de rey (...h5-h4).","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5.","Respondemos con d5 y disputamos el centro, impidiendo que las blancas jueguen e4.","Las blancas plantean el Gambito de Dama atacando d5.","¡El Contragambito Albin! En vez de defender d5, contraatacamos d4 con e5 y entregamos un peón.","El rival acepta el peón de e5. Es la respuesta casi obligada.","Avanzamos d4: el peón gana espacio, molesta al caballo de b1 y corta el desarrollo blanco. Es nuestra cuña en el centro.","Las blancas desarrollan el caballo y defienden el peón de e5.","Desarrollamos el caballo con tiempo: ataca e5 y defiende el peón de d4.","El rival prepara el fianchetto del alfil para presionar la gran diagonal.","El alfil sale a e6 y ataca c4. Prepara también Dd7 y el enroque largo.","El caballo va a d2 para defender c4 y quizá saltar a b3 contra d4.","La dama va a d7 para conectar con el enroque largo y apoyar Ah3.","El alfil se coloca en g2 y presiona b7 por la gran diagonal.","¡Enroque largo! La torre apoya d4 y nuestro rey se va al flanco de dama para atacar luego con peones en el flanco de rey.","Las blancas enrocan corto. Los reyes en flancos opuestos prometen una partida muy aguda.","El alfil va a h3 para cambiar el alfil de g2, el mejor defensor del rey blanco.","La dama blanca va a a4 y prepara b4-b5 contra nuestro rey.","Cambiamos alfiles. El enroque blanco pierde su principal defensor.","El rey blanco recaptura en g2; su enroque ha quedado algo más débil sin el alfil.","Escondemos el rey en b8 antes de lanzar el ataque con h5-h4. Posición dinámica con chances para ambos."]},{"id":"trampa-lasker","name":"Trampa Lasker (4.e3? Bb4+ 5.Bd2 dxe3!)","moves":"d4 d5 c4 e5 dxe5 d4 e3 Bb4+ Bd2 dxe3 Bxb4 exf2+ Ke2 fxg1=N+ Ke1 Qh4+ Kd2 Nc6 Bc3 Bg4","idea":"Si el rival juega 4.e3?, la trampa Lasker castiga: tras ...Ab4+ y ...dxe3, el peón llega a g1 y corona en caballo con jaque. Ventaja decisiva.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5.","Respondemos con d5 y disputamos el centro, impidiendo que las blancas jueguen e4.","Las blancas plantean el Gambito de Dama atacando d5.","¡El Contragambito Albin! En vez de defender d5, contraatacamos d4 con e5 y entregamos un peón.","El rival acepta el peón de e5. Es la respuesta casi obligada.","Avanzamos d4: el peón gana espacio, molesta al caballo de b1 y corta el desarrollo blanco. Es nuestra cuña en el centro.","¡Error! Con e3 las blancas atacan nuestro peón de d4, pero abren la diagonal e1-h4 y debilitan su rey.","¡Jaque con el alfil! Preparamos una combinación preciosa en la columna d y la casilla f2.","El rival tapa el jaque con el alfil. El daño ya está hecho: el error fue 4.e3.","¡Capturamos en e3! Atacamos el alfil de d2 y el peón de f2. Si 6.Axb4??, viene la trampa Lasker.","El rival toma nuestro alfil, cayendo en la trampa. Lo correcto era 6.fxe3.","¡Tomamos f2 con jaque! El rey blanco debe moverse y el peón está a un paso de coronar.","El rey va a e2. Si 7.Rxf2, Dxd1 gana la dama, porque la columna d está abierta.","¡Coronamos en caballo con jaque! Si coronásemos en dama, tras Dxd8+ Rxd8 Txg1 la ventaja desaparecería; el caballo da jaque y gana tiempo.","El rey vuelve a e1; si 8.Txg1, Ag4+ gana la dama de d1 con jaque.","La dama da jaque desde h4, aprovechando la diagonal abierta. El rey blanco no tiene buenas casillas.","El rey huye a d2; ninguna otra casilla evita perder todavía más material.","Desarrollamos el caballo con tiempo, atacando el alfil de b4.","El alfil se retira a c3, defendiendo el peón de e5 y la diagonal.","El alfil sale a g4 y ataca la dama de d1. Las blancas no pueden evitar grandes pérdidas: ventaja decisiva para nosotros."]},{"id":"a3","name":"Línea con 5.a3","moves":"d4 d5 c4 e5 dxe5 d4 Nf3 Nc6 a3 a5 g3 Be6 Nbd2 Qd7 Bg2 Nge7 O-O Ng6","idea":"Contra a3 y b4 frenamos el flanco de dama con ...a5. Luego desarrollo armónico con ...Ae6, ...Dd7, ...Ce7-g6 para recuperar e5.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5.","Respondemos con d5 y disputamos el centro, impidiendo que las blancas jueguen e4.","Las blancas plantean el Gambito de Dama atacando d5.","¡El Contragambito Albin! En vez de defender d5, contraatacamos d4 con e5 y entregamos un peón.","El rival acepta el peón de e5. Es la respuesta casi obligada.","Avanzamos d4: el peón gana espacio, molesta al caballo de b1 y corta el desarrollo blanco. Es nuestra cuña en el centro.","Las blancas desarrollan el caballo y defienden e5.","Sacamos el caballo con tiempo: ataca el peón de e5 y defiende nuestro peón de d4.","Con a3 el rival quiere jugar b4 para ganar espacio y amenazar b5 contra nuestro caballo.","Con a5 impedimos b4. Así el flanco de dama blanco no avanza con facilidad.","El rival prepara el fianchetto del alfil de rey para presionar b7.","El alfil sale a e6, presionando el peón de c4 y preparando Dd7.","El caballo va a d2 para defender c4 y quizá ir a b3 contra d4.","La dama sale a d7, conectando con un posible enroque largo.","El alfil llega a g2, presionando la gran diagonal.","El caballo de rey va a e7 para luego saltar a g6 y atacar el peón de e5.","Las blancas enrocan y ponen el rey a salvo; ahora e5 queda algo flojo.","El caballo llega a g6 y ataca e5 por segunda vez. Pronto recuperaremos el peón con buena posición."]},{"id":"nbd2","name":"Línea con 5.Nbd2","moves":"d4 d5 c4 e5 dxe5 d4 Nf3 Nc6 Nbd2 Bg4 a3 Qe7 h3 Bxf3 Nxf3 O-O-O","idea":"Contra Cbd2 clavamos el caballo con ...Ag4 y presionamos e5 con ...De7. Tras el cambio en f3, enroque largo y presión sobre e5.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5.","Respondemos con d5 y disputamos el centro, impidiendo que las blancas jueguen e4.","Las blancas plantean el Gambito de Dama atacando d5.","¡El Contragambito Albin! En vez de defender d5, contraatacamos d4 con e5 y entregamos un peón.","El rival acepta el peón de e5. Es la respuesta casi obligada.","Avanzamos d4: el peón gana espacio, molesta al caballo de b1 y corta el desarrollo blanco. Es nuestra cuña en el centro.","Las blancas desarrollan el caballo y defienden el peón de e5.","Sacamos el caballo con tiempo: ataca el peón de e5 y defiende nuestro peón de d4.","El caballo va a d2 para ir a b3 y atacar nuestro peón de d4.","El alfil sale a g4 y clava el caballo de f3, el defensor del peón de e5.","El rival juega a3 para impedir Ab4 o Cb4 y preparar b4.","La dama sale a e7 para atacar e5 y preparar el enroque largo.","Las blancas preguntan al alfil con h3 para romper la clavada.","Cambiamos el alfil por el caballo, eliminando un defensor de e5.","El rival recaptura con el otro caballo, que defiende e5.","¡Enroque largo! La torre apoya d4 y el rey va al flanco de dama. Seguiremos con ...Cxe5 o ...De6 con juego activo."]},{"id":"e3-error","name":"Error 5.e3? Bb4+ (como en la trampa Lasker)","moves":"d4 d5 c4 e5 dxe5 d4 Nf3 Nc6 e3 Bb4+ Bd2 dxe3 Bxb4 exf2+ Kxf2 Qxd1","idea":"Si el rival ataca d4 con e3 en mal momento, ...Ab4+ y ...dxe3 rompen su posición: tras ...exf2+ ganamos la dama.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5.","Respondemos con d5 y disputamos el centro, impidiendo que las blancas jueguen e4.","Las blancas plantean el Gambito de Dama atacando d5.","¡El Contragambito Albin! En vez de defender d5, contraatacamos d4 con e5 y entregamos un peón.","El rival acepta el peón de e5. Es la respuesta casi obligada.","Avanzamos d4: el peón gana espacio, molesta al caballo de b1 y corta el desarrollo blanco. Es nuestra cuña en el centro.","Las blancas desarrollan el caballo y defienden el peón de e5.","Sacamos el caballo con tiempo: ataca el peón de e5 y defiende nuestro peón de d4.","Error: con e3 el rival ataca d4, pero de nuevo debilita la diagonal hacia su rey.","Jaque con el alfil, igual que en la trampa Lasker.","El rival tapa el jaque con el alfil de c1; era mejor Cbd2.","Capturamos en e3, atacando f2 y el alfil de d2 a la vez.","El rival toma el alfil de b4, sin ver el peligro. Lo correcto era 7.fxe3 con juego normal.","¡Tomamos f2 con jaque! Ahora la columna d queda abierta entre las dos damas.","El rey recaptura el peón en f2 y deja la columna d sin protección.","¡Ganamos la dama! La columna d estaba abierta. Tenemos dama por alfil: ventaja decisiva."]}]},{"id":"benoni","name":"Benoni Moderna","side":"b","eco":"A56–A79","group":"1.d4 Nf6","blurb":"...c5 y ...e6xd5: estructura desequilibrada con mayoría blanca en el centro y la nuestra en el flanco de dama. Buscamos juego activo con ...Ag7, ...Te8 y la ruptura ...b5.","lines":[{"id":"clasica","name":"Variante Clásica (7.Nf3 y Be2)","moves":"d4 Nf6 c4 c5 d5 e6 Nc3 exd5 cxd5 d6 e4 g6 Nf3 Bg7 Be2 O-O O-O Re8 Nd2 Na6 f3 Nc7","idea":"El alfil de g7 domina la gran diagonal y la torre presiona e4 desde e8. El caballo pasa por a6-c7 para apoyar la ruptura ...b5.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, dejando abiertas varias defensas indias.","Las blancas ganan espacio con c4 y amplían su control del centro.","Atacamos d4 con c5. Es el inicio de la Benoni: retamos al rival a avanzar su peón.","El rival avanza a d5 y gana espacio. Si cambiara en c5, recuperaríamos el peón con ...e6 y ...Axc5.","Con e6 atacamos el peón de d5 y vamos a abrir la columna e. Es la idea de la Benoni Moderna.","Las blancas desarrollan el caballo y defienden d5 por segunda vez.","Cambiamos en d5: abrimos la columna e para nuestras torres y creamos una mayoría de peones en el flanco de dama.","El rival recaptura con el peón de c. Ahora tiene mayoría en el centro y nosotros en el flanco de dama.","Con d6 frenamos el avance e5 y abrimos la diagonal del alfil de c8.","Las blancas ocupan el centro con e4. Su plan a largo plazo será el avance e5 para abrir el juego.","Preparamos el fianchetto: en g7 el alfil será la mejor pieza de la Benoni, apuntando a la gran diagonal.","El rival desarrolla el caballo de rey, que apoya el avance e5 y vigila d4.","El alfil llega a g7 y presiona la gran diagonal hacia c3 y b2.","Desarrollo clásico del alfil a e2; las blancas preparan el enroque sin complicaciones.","Enrocamos y ponemos el rey a salvo. Ahora la torre de f8 irá a e8.","Las blancas también enrocan; ambos reyes están seguros y empieza la lucha de planes.","La torre va a e8 y presiona el peón de e4 por la columna e semiabierta.","El caballo va a d2 para defender e4 y luego ir a c4, desde donde presionará nuestro peón de d6.","El caballo va a a6 camino de c7, desde donde apoyará el avance b5.","Las blancas refuerzan e4 con f3 de forma sólida y liberan al caballo de d2.","El caballo llega a c7 y apoya la ruptura b5. Plan típico: a6, Tb8 y b5 en el flanco de dama."]},{"id":"moderna-h3","name":"Variante moderna (h3 y Bd3)","moves":"d4 Nf6 c4 c5 d5 e6 Nc3 exd5 cxd5 d6 e4 g6 Nf3 Bg7 h3 O-O Bd3 a6 a4 Nbd7 O-O Re8 Re1 c4 Bc2 Nc5","idea":"Con h3 y Ad3 el rival impide ...Ag4. Respondemos con ...a6, ...Cbd7 y ...c4 para ganar la casilla c5 para el caballo.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, dejando abiertas varias defensas indias.","Las blancas ganan espacio con c4 y amplían su control del centro.","Atacamos d4 con c5. Es el inicio de la Benoni: retamos al rival a avanzar su peón.","El rival avanza a d5 y gana espacio. Si cambiara en c5, recuperaríamos el peón con ...e6 y ...Axc5.","Con e6 atacamos el peón de d5 y vamos a abrir la columna e. Es la idea de la Benoni Moderna.","Las blancas desarrollan el caballo y defienden d5 por segunda vez.","Cambiamos en d5: abrimos la columna e para nuestras torres y creamos una mayoría de peones en el flanco de dama.","El rival recaptura con el peón de c. Ahora tiene mayoría en el centro y nosotros en el flanco de dama.","Con d6 frenamos el avance e5 y abrimos la diagonal del alfil de c8.","Las blancas ocupan el centro con e4. Su plan a largo plazo será el avance e5 para abrir el juego.","Preparamos el fianchetto: en g7 el alfil será la mejor pieza de la Benoni, apuntando a la gran diagonal.","El rival desarrolla el caballo de rey, que apoya e5 y vigila g5.","El alfil llega a g7, apuntando por la gran diagonal hacia c3 y b2.","Con h3 las blancas impiden Ag4, que cambiaría un defensor clave del avance e5.","Enrocamos y ponemos el rey a salvo antes de empezar el juego en el flanco de dama.","El alfil va a d3 para defender e4. Es la variante moderna, una de las más exigentes hoy.","Con a6 preparamos la ruptura b5, nuestro plan principal en el flanco de dama.","El rival juega a4 para frenar b5, aunque deja libre la casilla b4 para nuestras piezas.","El caballo va a d7 para saltar luego a c5 o e5, presionando e4 y d3.","Las blancas enrocan y completan el desarrollo del flanco de rey.","La torre va a e8 y presiona el peón de e4 por la columna e.","El rival defiende e4 con la torre y prepara el avance e5 a largo plazo.","¡Avanzamos c4! Atacamos el alfil de d3 y liberamos la casilla c5 para el caballo.","El alfil se retira a c2, donde sigue defendiendo e4.","El caballo llega a c5, presionando e4 y d3. Posición activa y típica de la Benoni."]},{"id":"taimanov","name":"Ataque Taimanov (f4 y Bb5+)","moves":"d4 Nf6 c4 c5 d5 e6 Nc3 exd5 cxd5 d6 e4 g6 f4 Bg7 Bb5+ Nfd7 a4 Qh4+ g3 Qe7 Nf3 O-O O-O Na6","idea":"El Taimanov es peligroso: f4 y Ab5+ amenazan e5. Interponemos ...Cfd7, damos jaque con ...Dh4+ para debilitar el flanco de rey y llevamos el caballo a a6, camino de b4 o c7.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, dejando abiertas varias defensas indias.","Las blancas ganan espacio con c4 y amplían su control del centro.","Atacamos d4 con c5. Es el inicio de la Benoni: retamos al rival a avanzar su peón.","El rival avanza a d5 y gana espacio. Si cambiara en c5, recuperaríamos el peón con ...e6 y ...Axc5.","Con e6 atacamos el peón de d5 y vamos a abrir la columna e. Es la idea de la Benoni Moderna.","Las blancas desarrollan el caballo y defienden d5 por segunda vez.","Cambiamos en d5: abrimos la columna e para nuestras torres y creamos una mayoría de peones en el flanco de dama.","El rival recaptura con el peón de c. Ahora tiene mayoría en el centro y nosotros en el flanco de dama.","Con d6 frenamos el avance e5 y abrimos la diagonal del alfil de c8.","Las blancas ocupan el centro con e4. Su plan a largo plazo será el avance e5 para abrir el juego.","Preparamos el fianchetto: en g7 el alfil será la mejor pieza de la Benoni, apuntando a la gran diagonal.","El rival juega f4: amenaza e5 con mucha fuerza. Es el ataque más peligroso contra la Benoni.","El alfil llega a g7 y presiona la gran diagonal, vigilando también e5.","¡Jaque con el alfil! Si interponemos Ad7 o Cbd7, las blancas avanzarían e5 con mucha fuerza.","La mejor respuesta es Cfd7: el caballo controla e5 y frena el avance central.","Las blancas juegan a4 para mantener el alfil en b5 y evitar que lo echemos con a6 y b5.","¡Jaque con la dama! Obligamos a jugar g3 y debilitamos la gran diagonal y el flanco de rey blanco.","El rival tapa el jaque con g3; las casillas f3 y h3 quedan algo debilitadas.","La dama vuelve a e7, donde presiona e4 y vigila el avance e5.","Las blancas desarrollan el caballo y apoyan otra vez el avance e5.","Enrocamos y ponemos el rey a salvo; la torre de f8 podrá ir a e8.","El rival enroca y completa el desarrollo del flanco de rey.","El caballo va a a6 para saltar a b4 o c7. Posición difícil pero con recursos para nosotros."]},{"id":"fianchetto","name":"Variante del Fianchetto (6.Nf3 g6 7.g3)","moves":"d4 Nf6 c4 c5 d5 e6 Nc3 exd5 cxd5 d6 Nf3 g6 g3 Bg7 Bg2 O-O O-O a6 a4 Nbd7 Nd2 Re8 h3 Rb8","idea":"Contra el fianchetto blanco jugamos ...a6, ...Cbd7, ...Te8 y ...Tb8 para preparar la ruptura ...b5, nuestro plan principal.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, dejando abiertas varias defensas indias.","Las blancas ganan espacio con c4 y amplían su control del centro.","Atacamos d4 con c5. Es el inicio de la Benoni: retamos al rival a avanzar su peón.","El rival avanza a d5 y gana espacio. Si cambiara en c5, recuperaríamos el peón con ...e6 y ...Axc5.","Con e6 atacamos el peón de d5 y vamos a abrir la columna e. Es la idea de la Benoni Moderna.","Las blancas desarrollan el caballo y defienden d5 por segunda vez.","Cambiamos en d5: abrimos la columna e para nuestras torres y creamos una mayoría de peones en el flanco de dama.","El rival recaptura con el peón de c. Ahora tiene mayoría en el centro y nosotros en el flanco de dama.","Con d6 frenamos el avance e5 y abrimos la diagonal del alfil de c8.","Las blancas desarrollan el caballo antes de decidir dónde irá el alfil de f1.","Preparamos el fianchetto: en g7 el alfil será la mejor pieza de la Benoni, apuntando a la gran diagonal.","El rival también hace fianchetto: su alfil en g2 presionará la gran diagonal hacia b7.","El alfil llega a g7, enfrentado a la cadena de peones blanca de la gran diagonal.","El alfil llega a g2 y apoya la casilla e4 y el peón de d5.","Enrocamos y ponemos el rey a salvo detrás del fianchetto.","Las blancas enrocan; ahora la partida será de maniobras.","Con a6 preparamos la ruptura b5, la clave de nuestro juego.","El rival frena b5 con a4, a cambio de ceder la casilla b4.","El caballo va a d7, preparando Ce5 o Cc5 para presionar el flanco de dama.","El caballo va a d2 para ir a c4 y presionar el peón de d6.","La torre va a e8 y ocupa la columna e semiabierta.","Las blancas juegan h3 para controlar g4 y evitar ...Cg4 o ...Ag4.","La torre va a b8 para apoyar el avance b5. Posición típica con juego activo en el flanco de dama."]},{"id":"cuatro-peones","name":"Cuatro Peones (8.Nf3 y e5)","moves":"d4 Nf6 c4 c5 d5 e6 Nc3 exd5 cxd5 d6 e4 g6 f4 Bg7 Nf3 O-O Be2 Re8 e5 dxe5 fxe5 Ng4 Bg5 Qb6 O-O Nxe5","idea":"Si el rival rompe con e5 sin Ab5+, el centro se abre a nuestro favor: ...Cg4 ataca e5, ...Db6 gana tiempo y recuperamos el peón con ...Cxe5.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, dejando abiertas varias defensas indias.","Las blancas ganan espacio con c4 y amplían su control del centro.","Atacamos d4 con c5. Es el inicio de la Benoni: retamos al rival a avanzar su peón.","El rival avanza a d5 y gana espacio. Si cambiara en c5, recuperaríamos el peón con ...e6 y ...Axc5.","Con e6 atacamos el peón de d5 y vamos a abrir la columna e. Es la idea de la Benoni Moderna.","Las blancas desarrollan el caballo y defienden d5 por segunda vez.","Cambiamos en d5: abrimos la columna e para nuestras torres y creamos una mayoría de peones en el flanco de dama.","El rival recaptura con el peón de c. Ahora tiene mayoría en el centro y nosotros en el flanco de dama.","Con d6 frenamos el avance e5 y abrimos la diagonal del alfil de c8.","Las blancas ocupan el centro con e4. Su plan a largo plazo será el avance e5 para abrir el juego.","Preparamos el fianchetto: en g7 el alfil será la mejor pieza de la Benoni, apuntando a la gran diagonal.","El rival juega f4, preparando el avance e5: es el Ataque de los Cuatro Peones.","El alfil llega a g7 y presiona e5 y la gran diagonal.","Las blancas desarrollan el caballo en lugar de dar Ab5+, y apoyan e5.","Enrocamos y ponemos el rey a salvo antes de que se abra el centro.","El alfil va a e2 y prepara el enroque blanco, sin prisa por romper en el centro.","La torre presiona el peón de e4 por la columna e, para frenar el avance e5.","Las blancas avanzan e5 de todas formas para abrir el juego y atacar el caballo de f6.","Cambiamos en e5 para abrir el centro, donde nuestras piezas están mejor preparadas.","El rival recaptura con el peón de f y vuelve a atacar el caballo.","El caballo salta a g4 y ataca el peón de e5, que ahora es débil.","El alfil ataca nuestra dama de d8 con tiempo y defiende indirectamente e7.","La dama sale a b6 con ganancia de tiempo, atacando el peón de b2 y la diagonal hacia g1.","Las blancas enrocan y defienden el rey de la diagonal de nuestra dama.","Recuperamos el peón de e5. Tenemos buena posición con piezas muy activas."]},{"id":"trampa-h3-b5","name":"Golpe 9...b5 contra h3 y Bd3","moves":"d4 Nf6 c4 c5 d5 e6 Nc3 exd5 cxd5 d6 e4 g6 Nf3 Bg7 h3 O-O Bd3 b5 Bxb5 Nxe4 Nxe4 Qa5+ Nfd2 Qxb5 Nxd6 Qa6","idea":"Con ...b5 sacrificamos un peón para debilitar e4: si Axb5, ...Cxe4 y ...Da5+ recuperan la pieza con juego activo.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, dejando abiertas varias defensas indias.","Las blancas ganan espacio con c4 y amplían su control del centro.","Atacamos d4 con c5. Es el inicio de la Benoni: retamos al rival a avanzar su peón.","El rival avanza a d5 y gana espacio. Si cambiara en c5, recuperaríamos el peón con ...e6 y ...Axc5.","Con e6 atacamos el peón de d5 y vamos a abrir la columna e. Es la idea de la Benoni Moderna.","Las blancas desarrollan el caballo y defienden d5 por segunda vez.","Cambiamos en d5: abrimos la columna e para nuestras torres y creamos una mayoría de peones en el flanco de dama.","El rival recaptura con el peón de c. Ahora tiene mayoría en el centro y nosotros en el flanco de dama.","Con d6 frenamos el avance e5 y abrimos la diagonal del alfil de c8.","Las blancas ocupan el centro con e4. Su plan a largo plazo será el avance e5 para abrir el juego.","Preparamos el fianchetto: en g7 el alfil será la mejor pieza de la Benoni, apuntando a la gran diagonal.","El rival desarrolla el caballo de rey, que apoya e5 y vigila g5.","El alfil llega a g7, apuntando a la gran diagonal hacia c3 y b2.","Con h3 las blancas impiden Ag4, que cambiaría el caballo de f3.","Enrocamos y ponemos el rey a salvo; ahora pensamos en golpear el centro.","El alfil va a d3 para defender e4. Parece sólido, pero deja el peón de b5 como cebo.","¡Sacrificamos el peón con b5! Si el rival lo toma con el alfil, el peón de e4 se queda con un solo defensor.","El rival toma el peón. Ahora e4 sólo está defendido por el caballo de c3.","¡Tomamos e4! Si el rival recaptura, el jaque ...Da5+ recuperará la pieza.","Las blancas recuperan la pieza con el caballo de c3.","¡Jaque de dama que también ataca el alfil de b5! Recuperamos la pieza entregada.","El rival tapa el jaque con el caballo de f3, que ahora defiende también e4.","La dama toma el alfil de b5. Hemos recuperado la pieza y el material está igualado.","El caballo toma el peón de d6 y ataca nuestra dama.","La dama se retira a a6, atacando el caballo de d6 y vigilando la diagonal. Posición compleja e igualada."]}]},{"id":"budapest","name":"Gambito Budapest","side":"b","eco":"A51–A52","group":"1.d4","blurb":"2...e5: gambito sorpresa contra 1.d4 2.c4. Las negras recuperan el peón con juego activo.","lines":[{"id":"bf4","name":"Principal (4.Bf4)","moves":"d4 Nf6 c4 e5 dxe5 Ng4 Bf4 Nc6 Nf3 Bb4+ Nbd2 Qe7 e3 Ngxe5 Nxe5 Nxe5 Be2 O-O O-O Bxd2 Qxd2 d6","idea":"Presión sobre e5 con ...Nc6, ...Bb4+ y ...Qe7. Recuperamos el peón y obtenemos un juego cómodo con el caballo fuerte en e5.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5 y c5.","Respondemos con Cf6: controlamos e4 e impedimos que las blancas jueguen e4 de inmediato.","Las blancas ganan espacio con c4 y presionan d5. Es la jugada que permite nuestro gambito.","¡El Gambito Budapest! Entregamos el peón de e5 para sacar las piezas rápido y presionar el peón que el rival acaba de ganar.","El rival acepta el gambito. Ahora su peón de e5 queda adelantado y será nuestro objetivo.","Atacamos de inmediato el peón de e5 con el caballo. La idea es recuperarlo con Cc6 y otras piezas.","Variante Rubinstein: el alfil defiende el peón de e5 desde f4. Es la respuesta más sólida y popular de las blancas.","Sumamos un segundo atacante al peón de e5. Ahora lo atacan dos caballos y lo defiende sólo el alfil.","El rival defiende e5 por segunda vez con el caballo. Ahora el peón tiene tantos defensores como atacantes.","¡Jaque con el alfil! Obligamos al rival a interponer una pieza, y así podremos sumar la dama a la presión sobre e5.","Interponen el caballo de d2, que defiende bien pero queda clavado. Si el rival juega Cc3, también es buena idea Axc3+ y doblar sus peones.","La dama se suma al ataque: ahora presionamos e5 con tres piezas. Además, De7 deja abierta la idea de Dxe5 o Cxe5 según convenga.","Las blancas desarrollan y abren la diagonal del alfil de f1. Si juegan a3, cuidado con la trampa: tras ...Cgxe5, axb4?? permite Cd3 mate.","Recuperamos el peón con el caballo de g4. Ya hemos devuelto el material y nuestras piezas están mejor colocadas.","El rival cambia un par de caballos para aliviar la presión sobre su posición.","Recapturamos con el otro caballo, que queda centralizado y muy fuerte en e5, sin peón que pueda expulsarlo fácilmente.","Las blancas desarrollan el alfil y preparan el enroque para poner el rey a salvo.","Enrocamos también. Nuestro rey queda seguro y la torre puede ir a e8 para apoyar el centro.","El rival termina de enrocar; ahora su caballo de d2 ya no está clavado contra el rey.","Cambiamos el alfil por el caballo de d2. Así eliminamos una pieza que podía ir a c4 o e4 a molestar a nuestro caballo.","Recapturan con la dama. Las blancas conservan la pareja de alfiles, pero nuestro juego es muy fácil.","Con d6 reforzamos el caballo de e5 y abrimos la diagonal del alfil de c8. Posición equilibrada y cómoda para nosotros."]},{"id":"trampa-a3","name":"Trampa del mate en d3 (7.a3? Ngxe5 8.axb4??)","moves":"d4 Nf6 c4 e5 dxe5 Ng4 Bf4 Nc6 Nf3 Bb4+ Nbd2 Qe7 a3 Ngxe5 axb4 Nd3#","idea":"Si el rival intenta ganar el alfil de b4 con a3 y axb4, el caballo da mate en d3. Es la trampa más famosa del Budapest.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5 y c5.","Respondemos con Cf6: controlamos e4 e impedimos que las blancas jueguen e4 de inmediato.","Las blancas ganan espacio con c4 y presionan d5. Es la jugada que permite nuestro gambito.","¡El Gambito Budapest! Entregamos el peón de e5 para sacar las piezas rápido y presionar el peón que el rival acaba de ganar.","El rival acepta el gambito. Ahora su peón de e5 queda adelantado y será nuestro objetivo.","Atacamos de inmediato el peón de e5 con el caballo. La idea es recuperarlo con Cc6 y otras piezas.","El alfil defiende e5. Es la Variante Rubinstein, la más habitual en la práctica.","Atacamos e5 por segunda vez. El caballo de c6 también vigila d4 y b4.","El rival defiende el peón con el caballo; ahora e5 está atacado dos veces y defendido dos veces.","Jaque con el alfil para forzar Cbd2 o Cc3 y luego sumar la dama al ataque.","Interponen el caballo de b1. Ahora el caballo de d2 está clavado y bloquea a la dama blanca la defensa de d3.","La dama ataca e5 por tercera vez. Las blancas no pueden defenderlo más veces y lo recuperaremos.","Las blancas atacan el alfil de b4 pensando en ganar una pieza. Es un error que permite nuestra trampa.","Recuperamos el peón con el caballo de g4 y dejamos el alfil de b4 colgando a propósito. Ahora el caballo amenaza d3.","¡El rival cae en la trampa y toma el alfil! Con el caballo de d2 clavado y el peón de e2 en su sitio, la casilla d3 no está bien defendida.","¡Jaque mate! El peón de e2 no puede capturar en d3 porque lo clava nuestra dama de e7, y el rey no tiene casillas. Lo correcto era 8.e3."]},{"id":"nf3","name":"Variante 4.Nf3","moves":"d4 Nf6 c4 e5 dxe5 Ng4 Nf3 Bc5 e3 Nc6 Be2 Ngxe5 Nxe5 Nxe5 O-O O-O Nc3 Re8 b3 a5 Bb2 Ra6","idea":"...Bc5 apunta a f2 y el peón se recupera. Después levantamos la torre por a6 hacia el flanco de rey para atacar.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5 y c5.","Respondemos con Cf6: controlamos e4 e impedimos que las blancas jueguen e4 de inmediato.","Las blancas ganan espacio con c4 y presionan d5. Es la jugada que permite nuestro gambito.","¡El Gambito Budapest! Entregamos el peón de e5 para sacar las piezas rápido y presionar el peón que el rival acaba de ganar.","El rival acepta el gambito. Ahora su peón de e5 queda adelantado y será nuestro objetivo.","Atacamos de inmediato el peón de e5 con el caballo. La idea es recuperarlo con Cc6 y otras piezas.","Las blancas defienden e5 con el caballo en lugar del alfil. Es una jugada natural que también desarrolla.","El alfil apunta directamente a f2, el punto débil de las blancas. Ojo: amenazamos Axf2+ con ataque.","El rival cierra la diagonal hacia f2 con e3. Ahora el alfil de c5 queda bien colocado pero no amenaza nada inmediato.","Sumamos el caballo de c6 a la presión sobre e5. Las blancas no podrán sostener el peón mucho tiempo.","Desarrollan el alfil para poder enrocar. Si juegan Cc3, seguimos con ...Cgxe5 igualmente.","Recuperamos el peón. El material vuelve a estar igualado y nuestro desarrollo es muy fluido.","Las blancas cambian caballos para quitarnos piezas activas.","Recapturamos con el otro caballo, que vuelve a e5, una casilla central magnífica.","El rival enroca y pone el rey a salvo; su posición es sólida pero algo pasiva.","Enrocamos también. Nuestra torre de f8 podrá ir a e8 y apoyar el caballo de e5.","Las blancas desarrollan el último caballo y vigilan e4 y d5.","La torre ocupa la columna e y protege el caballo de e5. También prepara una futura maniobra hacia e6.","El rival prepara el fianchetto del alfil para atacar nuestro caballo de e5 a lo largo de la gran diagonal.","Avanzamos el peón de a para poder sacar la torre de a8 por a6. Además, a5-a4 podría molestar la estructura de b3.","Las blancas colocan el alfil en la gran diagonal, apuntando a e5 y a nuestro enroque.","¡Levantamos la torre! Desde a6 puede pasar a h6 o g6 y unirse al ataque contra el rey blanco. Es un plan típico del Budapest."]},{"id":"e4","name":"Variante Alekhine (4.e4)","moves":"d4 Nf6 c4 e5 dxe5 Ng4 e4 Nxe5 f4 Nec6 Be3 Bb4+ Nc3 Qe7 Bd3 f5","idea":"Contra el gran centro, presionar con ...Bb4+ y ...Qh4+ cuando se pueda. Con ...f5 golpeamos e4 y abrimos líneas.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5 y c5.","Respondemos con Cf6: controlamos e4 e impedimos que las blancas jueguen e4 de inmediato.","Las blancas ganan espacio con c4 y presionan d5. Es la jugada que permite nuestro gambito.","¡El Gambito Budapest! Entregamos el peón de e5 para sacar las piezas rápido y presionar el peón que el rival acaba de ganar.","El rival acepta el gambito. Ahora su peón de e5 queda adelantado y será nuestro objetivo.","Atacamos de inmediato el peón de e5 con el caballo. La idea es recuperarlo con Cc6 y otras piezas.","Variante Alekhine: las blancas no defienden e5, sino que construyen un gran centro con e4 y luego f4.","Recuperamos el peón de inmediato. El caballo en e5 queda bien centralizado, aunque será atacado.","El rival expulsa el caballo con f4 y gana espacio. Su centro es grande, pero debilita la diagonal e1-h4 y su rey.","Retiramos el caballo a c6, desde donde presiona d4 y apoya ...Ab4+. Es la retirada más activa.","Las blancas desarrollan el alfil y controlan c5 y d4. Así evitan que juguemos ...Ac5.","Jaque con el alfil: obligamos al rival a bloquear con el caballo, que quedará clavado.","Cubren el jaque con el caballo. Ahora está clavado y no puede defender e4 con libertad.","La dama presiona e4 junto con el alfil clavador. También vigila la casilla c5 y prepara el enroque.","Las blancas defienden e4 con el alfil y preparan sacar el caballo de g1.","¡Golpeamos el centro con f5! Atacamos el peón de e4 y abrimos la columna f. Así el centro blanco empieza a romperse."]},{"id":"nc3-qd5","name":"Línea con 6.Nc3 Qe7 7.Qd5","moves":"d4 Nf6 c4 e5 dxe5 Ng4 Bf4 Nc6 Nf3 Bb4+ Nc3 Qe7 Qd5 Bxc3+ bxc3 f6 exf6 Nxf6 Qd3 d6","idea":"Si el rival tapa el jaque con Cc3 y se aferra al peón con Dd5, doblamos sus peones con ...Axc3+ y abrimos el juego con ...f6.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5 y c5.","Respondemos con Cf6: controlamos e4 e impedimos que las blancas jueguen e4 de inmediato.","Las blancas ganan espacio con c4 y presionan d5. Es la jugada que permite nuestro gambito.","¡El Gambito Budapest! Entregamos el peón de e5 para sacar las piezas rápido y presionar el peón que el rival acaba de ganar.","El rival acepta el gambito. Ahora su peón de e5 queda adelantado y será nuestro objetivo.","Atacamos de inmediato el peón de e5 con el caballo. La idea es recuperarlo con Cc6 y otras piezas.","El alfil defiende el peón de e5. Es la Variante Rubinstein.","Sumamos el caballo al ataque sobre e5. Es la respuesta estándar.","El rival defiende e5 con el caballo de f3, igual que en la línea principal.","Damos jaque para que el rival decida cómo cubrirlo; aquí elegirá el caballo de b1 a c3.","Interponen el caballo en c3 en lugar de d2. Así no bloquean a su dama, pero el caballo queda clavado.","La dama ataca e5 por tercera vez. Con el caballo de c3 clavado, el peón no puede sostenerse por medios normales.","Las blancas defienden e5 con la dama de forma agresiva, y amenazando además f7. Es una salida prematura de la dama.","Cambiamos el alfil por el caballo y doblamos los peones blancos del flanco de dama. Esa estructura será una debilidad duradera.","El rival recaptura con el peón; sus peones de c3 y c4 quedan doblados y aislados.","Con f6 atacamos el peón de e5 otra vez y abrimos la columna f. No temas por el rey: la dama y los caballos lo cubren.","Las blancas cambian el peón para no perderlo gratis. La columna f queda abierta para nosotros.","Recapturamos con el caballo de g4, que vuelve al centro y ataca la dama de d5.","La dama blanca se retira a d3. El peón está recuperado y el rival tiene peones débiles.","Con d6 abrimos el alfil de c8 y controlamos e5. Tenemos buen desarrollo y la mejor estructura de peones."]},{"id":"fajarowicz","name":"Fajarowicz (3...Ne4) y trampa 6.g3??","moves":"d4 Nf6 c4 e5 dxe5 Ne4 Nf3 d6 exd6 Bxd6 g3 Nxf2 Kxf2 Bxg3+ hxg3 Qxd1","idea":"Con 3...Ce4 buscamos un juego rápido de piezas. Si el rival descuida f2 y la diagonal de su dama, ...Cxf2 y ...Axg3+ ganan la dama.","notes":["El rival abre con el peón de dama, ocupando el centro y controlando e5 y c5.","Respondemos con Cf6: controlamos e4 e impedimos que las blancas jueguen e4 de inmediato.","Las blancas ganan espacio con c4 y presionan d5. Es la jugada que permite nuestro gambito.","¡El Gambito Budapest! Entregamos el peón de e5 para sacar las piezas rápido y presionar el peón que el rival acaba de ganar.","El rival acepta el gambito. Ahora su peón de e5 queda adelantado y será nuestro objetivo.","Variante Fajarowicz: en vez de Cg4, el caballo salta a e4. Es más arriesgada, pero el caballo queda muy activo y apunta a f2.","El rival desarrolla el caballo y vigila d2. Otras respuestas exigentes son 4.a3, contra ...Ab4+, y 4.Dc2, que ataca el caballo.","Atacamos el peón de e5 con d6 para abrir líneas: tras el cambio, el alfil de f8 saldrá a d6 apuntando al flanco de rey.","Las blancas capturan; ahora el peón de d6 está a punto de ser recuperado.","Recapturamos con el alfil, que apunta a g3 y h2. Atención: ya amenazamos ideas contra f2 con caballo y alfil.","Error del rival: quiere sacar el alfil por g2, pero debilita g3 y deja f2 sin defensa suficiente.","¡Sacrificamos el caballo en f2! Atacamos la dama de d1 y abrimos el camino hacia g3.","El rival toma el caballo con el rey. Si no lo hace, perdería la dama o la torre de h1.","¡Jaque con el alfil! Este sacrificio abre la columna d entre nuestra dama y la dama blanca.","Las blancas toman el alfil; si no, perderían todavía más material.","¡Ganamos la dama! Con la columna d abierta, nuestra dama captura la blanca. Hemos dado caballo y alfil por la dama: ventaja decisiva."]}]},{"id":"benko","name":"Gambito Benko","side":"b","eco":"A57–A59","group":"1.d4","blurb":"...c5 y ...b5: se entrega un peón por presión duradera en las columnas a y b.","lines":[{"id":"aceptado","name":"Aceptado","moves":"d4 Nf6 c4 c5 d5 b5 cxb5 a6 bxa6 g6 Nc3 Bxa6 e4 Bxf1 Kxf1 d6 g3 Bg7 Kg2 O-O Nf3 Nbd7 Re1 Qa5","idea":"Las torres en a y b y el alfil de g7 presionan el flanco de dama. Seguimos con ...Tfb8 y ...Db4 o ...Ce8-c7.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, manteniendo flexibles nuestros planes.","Las blancas ganan espacio con c4. Ahora atacaremos su centro de inmediato.","Golpeamos d4 con c5. Si el rival cambia en c5, recuperaremos el peón fácilmente con ...e6 y ...Axc5.","El rival avanza a d5 ganando espacio y cerrando el centro. Es la respuesta más ambiciosa.","¡El Gambito Benko! Ofrecemos el peón de b5 para abrir las columnas a y b contra el flanco de dama blanco.","Las blancas aceptan el peón. Es la respuesta más directa.","Ofrecemos también el peón de a. Si lo toman, abrimos la columna a y desarrollamos el alfil a a6 de un golpe.","El rival captura otra vez. Ya tiene un peón de ventaja, pero nosotros ganaremos mucho tiempo.","Preparamos el fianchetto del alfil de f8, que desde g7 presionará la gran diagonal hasta b2.","Las blancas desarrollan el caballo y vigilan b5 y e4.","Recuperamos el peón de a6 con el alfil, que ya está desarrollado y apunta a f1, impidiendo el enroque blanco.","El rival juega e4 y ofrece cambiar alfiles. Tras el cambio, su rey no podrá enrocar.","Cambiamos alfiles. Así el rey blanco tendrá que capturar y perderá el derecho a enrocar.","El rey recaptura en f1. Las blancas necesitarán varias jugadas (g3 y Rg2) para ponerlo a salvo.","Con d6 consolidamos el centro, controlamos e5 y preparamos ...Cbd7 y ...Ag7.","Las blancas preparan Rg2 para hacer un enroque artificial.","El alfil llega a g7, donde apunta a c3 y b2 por la gran diagonal. Es la pieza clave del Benko.","El rey blanco se esconde en g2. Ha gastado tres jugadas en lo que el enroque hace en una.","Enrocamos. Ahora la torre de f8 podrá ir a b8 para presionar la columna b.","El rival saca el caballo de g1 y defiende e5 y d4.","El caballo va a d7, desde donde puede saltar a b6, c5 o e5 y apoyar la presión en el flanco de dama.","Las blancas conectan torres y apoyan e5, pensando en el avance e5 para abrir el centro.","La dama sale a a5 y presiona el caballo de c3 y la columna a. El plan es seguir con ...Tfb8 y presión total en el flanco de dama."]},{"id":"fianchetto","name":"Aceptado con fianchetto (7.g3)","moves":"d4 Nf6 c4 c5 d5 b5 cxb5 a6 bxa6 g6 Nc3 Bxa6 g3 d6 Bg2 Bg7 Nf3 Nbd7 O-O O-O Rb1 Qa5","idea":"Las blancas enrocan normalmente con el fianchetto, pero nuestra presión en a y b sigue intacta: ...Da5, ...Tfb8 y ...Ce8-c7-b5.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, manteniendo flexibles nuestros planes.","Las blancas ganan espacio con c4. Ahora atacaremos su centro de inmediato.","Golpeamos d4 con c5. Si el rival cambia en c5, recuperaremos el peón fácilmente con ...e6 y ...Axc5.","El rival avanza a d5 ganando espacio y cerrando el centro. Es la respuesta más ambiciosa.","¡El Gambito Benko! Ofrecemos el peón de b5 para abrir las columnas a y b contra el flanco de dama blanco.","El rival acepta el gambito y captura en b5, como en la línea principal.","Seguimos con a6 para abrir la columna a y sacar el alfil de dama con tiempo.","Las blancas capturan; ahora tienen dos peones de más por un momento.","Preparamos el alfil en g7. Recuperaremos un peón en a6 cuando nos convenga.","Desarrollo natural del caballo, que controla b5 y e4.","Recuperamos un peón con el alfil. Las columnas a y b ya están abiertas para nuestras torres.","En vez de e4, las blancas eligen el fianchetto para enrocar sin problemas. Es una de las líneas más sólidas contra el Benko.","Afianzamos el centro y controlamos e5 y c5. El peón de d6 es la base de nuestra estructura.","El alfil se coloca en g2 y defiende el rey enrocado.","Nuestro alfil va a g7 y presiona la gran diagonal contra c3 y b2.","Las blancas desarrollan el caballo del rey y preparan el enroque.","El caballo va a d7 para ir a b6 o e5 y dejar libre la casilla f6 si el alfil lo necesita.","El rival enroca. Su rey está seguro, pero el peón de más se ve poco por ahora.","Enrocamos también. Las torres irán pronto a a8 y b8.","Las blancas defienden b2 con la torre para evitar la presión del alfil de g7 y la columna b.","La dama sale a a5 y presiona c3. Seguimos con ...Tfb8 y ...Ce8-c7-b5, ideas típicas para recuperar el peón o dominar el flanco."]},{"id":"nf3","name":"Rehusado (4.Nf3)","moves":"d4 Nf6 c4 c5 d5 b5 Nf3 bxc4 Nc3 g6 e4 d6 Bxc4 Bg7 O-O O-O","idea":"Las negras toman c4 y se desarrollan con fianchetto. Se llega a una estructura parecida a la Benoni con juego cómodo.","notes":["El rival abre con el peón de dama y ocupa el centro.","Desarrollamos el caballo y controlamos e4, manteniendo flexibles nuestros planes.","Las blancas ganan espacio con c4. Ahora atacaremos su centro de inmediato.","Golpeamos d4 con c5. Si el rival cambia en c5, recuperaremos el peón fácilmente con ...e6 y ...Axc5.","El rival avanza a d5 ganando espacio y cerrando el centro. Es la respuesta más ambiciosa.","¡El Gambito Benko! Ofrecemos el peón de b5 para abrir las columnas a y b contra el flanco de dama blanco.","El rival no acepta el peón y prefiere desarrollarse.","Tomamos el peón de c4. El rival lo recuperará, pero perdemos la presión en b5 a cambio de un juego sencillo.","Las blancas desarrollan el caballo y preparan e4 para recuperar el peón con el alfil.","Preparamos el fianchetto del alfi // Jugadas de la línea, terminando siempre en una jugada del usuario
const LINE_CACHE = new Map();
function lineData(o, l) {
  const key = o.id + "/" + l.id;
  if (LINE_CACHE.has(key)) return LINE_CACHE.get(key);
  const g = new Chess(), sans = [], fromTo = [];
  for (const m of l.moves.split(" ")) { const r = g.move(m); if (!r) break; sans.push(r.san); fromTo.push([r.from, r.to]); }
  while (sans.length && ((sans.length - 1) % 2 === 0 ? "w" : "b") !== o.side) { sans.pop(); fromTo.pop(); }
  const notes = (l.notes || []).slice(0, sans.length);
  const d = { key, sans, fromTo, notes };
  LINE_CACHE.set(key, d);
  return d;
}

/* ---------- estado y persistencia ---------- */
const LS_KEY = "libro-aperturas-v1";
let store = { lines: {}, n: 5, updated: 0, sound: true, arrows: true };
try { const raw = localStorage.getItem(LS_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
let cloud = { db: null, ref: null, state: "local", writing: null, timer: 0 };

// El Gambito Evans era una línea de la Italiana: su progreso pasa al nuevo capítulo
function migrate() {
  const old = store.lines["italiana/evans"], neu = "evans/clasica-ba5";
  if (old && !store.lines[neu]) store.lines = Object.assign({}, store.lines, { [neu]: old });
  if (![5, 8, 12, ALL].includes(store.n)) store.n = store.n > 12 ? ALL : store.n > 8 ? 12 : store.n > 5 ? 8 : 5;
}
migrate();

function persist() {
  store.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
  if (!cloud.ref) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(pushCloud, 1200);
}
async function pushCloud() {
  if (cloud.writing) { await cloud.writing.catch(() => {}); }
  const body = JSON.parse(JSON.stringify({ lines: store.lines, n: store.n, sound: store.sound, arrows: store.arrows, updated: store.updated }));
  cloud.writing = cloud.ref.set(body)
    .then(() => { cloud.state = "cloud"; updateSyncNote(); })
    .catch(e => { cloud.state = e && e.code === "quota_exceeded" ? "full" : "local"; updateSyncNote(); });
  return cloud.writing;
}
function mergeRemote(remote) {
  if (!remote) return;
  const lines = remote.lines || {};
  for (const k of Object.keys(lines)) {
    const mine = store.lines[k];
    if (!mine || (lines[k].last || 0) > (mine.last || 0)) store.lines[k] = lines[k];
  }
  if ((remote.updated || 0) > (store.updated || 0)) {
    if (remote.n) store.n = remote.n;
    if (typeof remote.sound === "boolean") store.sound = remote.sound;
    if (typeof remote.arrows === "boolean") store.arrows = remote.arrows;
  }
  migrate();
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
}
(async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    cloud.db = db; cloud.ref = ref; cloud.state = "cloud";
    if (snap.exists) { mergeRemote(snap.data()); if (view.name !== "trainer") render(); }
    updateSyncNote();
  } catch (e) { cloud.state = "local"; updateSyncNote(); }
})();
function syncText() {
  if (cloud.state === "cloud") return "Tu progreso se guarda en tu cuenta y se sincroniza entre dispositivos.";
  if (cloud.state === "full") return "No se pudo guardar en tu cuenta (almacenamiento lleno). Se guarda en este navegador.";
  return "Tu progreso se guarda en este navegador.";
}
function updateSyncNote() { const el = $("#sync-note"); if (el) el.textContent = syncText(); }

/* ---------- sonido (sintetizado, sin archivos) ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === "suspended") AC.resume().catch(() => {});
  return AC;
}
document.addEventListener("pointerdown", () => { if (store.sound) audio(); }, true);
function knock(c, t, vol, freq) {
  const len = 0.05, buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 3);
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 1.4;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(bp).connect(g).connect(c.destination); src.start(t);
  const o = c.createOscillator(), og = c.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(freq / 9, t); o.frequency.exponentialRampToValueAtTime(freq / 16, t + .08);
  og.gain.setValueAtTime(vol * .5, t); og.gain.exponentialRampToValueAtTime(.001, t + .09);
  o.connect(og).connect(c.destination); o.start(t); o.stop(t + .1);
}
function clack(c, t, vol, pitch = 1) {
  const len = 0.012, buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 2);
  const src = c.createBufferSource(); src.buffer = buf;
  const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
  const ng = c.createGain(); ng.gain.value = vol * .8;
  src.connect(hp).connect(ng).connect(c.destination); src.start(t);
  for (const [f, d, v] of [[1150, .045, .55], [2480, .028, .35], [3900, .018, .2]]) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = f * pitch;
    g.gain.setValueAtTime(vol * v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .01);
  }
}
function beep(c, t, f, dur, vol, type = "sine") {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function sfx(kind) {
  if (!store.sound) return;
  const c = audio(); if (!c) return;
  const t = c.currentTime + .005;
  if (kind === "move") knock(c, t, .9, 1700);
  else if (kind === "capture") { knock(c, t, .7, 1500); clack(c, t + .004, 1, 1); clack(c, t + .032, .75, .92); }
  else if (kind === "check") { knock(c, t, .9, 1700); beep(c, t + .03, 1046, .16, .12); }
  else if (kind === "castle") { knock(c, t, .8, 1700); knock(c, t + .09, .8, 1500); }
  else if (kind === "error") { beep(c, t, 150, .22, .14, "square"); }

/* ---------- repetición espaciada ---------- */
function rec(key) { return store.lines[key]; }

  if (r.box >= MASTERED_BOX) return "dominada";

}
const STATUS_LABEL = { nueva: "Nueva", aprendiendo: "Aprendiendo", pendiente: "Toca repasar", repaso: "En repaso", dominada: "Dominada" };
function grade(key, mistakes) {
  const now = Date.now();
  const r = Object.assign({ box: 0, reps: 0, lapses: 0 }, rec(key));
  const box = mistakes === 0 ? Math.min(r.box + 1, INTERVALS.length - 1) : 0;
  const next = { box, reps: r.reps + 1, lapses: r.lapses + (mistakes ? 1 : 0), last: now,

}

  const now = Date.now(), out = [];
  for (const o of OPENINGS) for (const l of activeLines(o)) if (isDue(o.id + "/" + l.id, now)) out.push([o, l]);
  return out;
}

/* ---------- entrenador ---------- */
function startTrainer(queue, qi, mode, title) {

}

}

}

    const r = T.game.move(T.d.sans[T.ply]); T.ply++; T.busy = false; T.wrongHere = 0;
    moveSound(r);
    if (T.mode === "drill") T.msg = { cls: "", text: "El rival juega " + toES(r.san) + ". Te toca." };
    else T.msg = null;
    if (T.mode === "learn" && T.ply >= T.d.sans.length) T.msg = { cls: "done", text: "Fin de la variante." };

}
function expectedMove() { return T.d.fromTo[T.ply]; }
function tryMove(from, to) {

  if (!r) { T.sel = null; renderBoard(); return; }
  const want = T.d.sans[T.ply];
  if (strip(r.san) !== strip(want)) {
    T.game.undo();
    T.wrong = [from, to]; T.sel = null;
    sfx("error");
    const b = $("#board"); if (b) { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
    if (T.mode === "learn") {
      T.msg = { cls: "err", text: `${toES(r.san)} no es la jugada de la línea. La buena es ${toES(want)}: sigue la flecha.` };
    } else {
      T.mistakes++; T.wrongHere++;
      T.msg = { cls: "err", text: `${toES(r.san)} no es la jugada del repertorio.${T.wrongHere >= 2 ? " Mira la casilla marcada." : " Inténtalo otra vez."}` };
      if (T.wrongHere >= 2) T.hint = expectedMove()[0];

    return;
  }

  T.ply++; T.sel = null; T.hint = null; T.wrong = null; T.wrongHere = 0;
  if (T.ply >= T.d.sans.length) return finishLine();

}

  const when = r.box === 0 ? "la repetirás hasta hacerla sin fallos" : `próximo repaso en ${INTERVALS[r.box]} día${INTERVALS[r.box] > 1 ? "s" : ""}`;
  T.msg = T.mistakes === 0
    ? { cls: "done", text: `¡Línea completa sin errores! ${when[0].toUpperCase() + when.slice(1)}.` }
    : { cls: "err", text: `Línea completa con ${T.mistakes} error${T.mistakes > 1 ? "es" : ""}: ${when}.` };

function giveHint() {

  moveSound(r);

  T.game = new Chess();
  let r = null;
  for (let i = 0; i < p; i++) r = T.game.move(T.d.sans[i]);
  T.ply = p; T.sel = null; T.hint = null; T.wrong = null;

  const isLearn = T.mode === "learn", total = T.d.sans.length, atEnd = T.ply >= total;
  const hasNext = T.qi < T.queue.length - 1;
  const sound = `<button class="tb" data-act="sound" aria-pressed="${store.sound}" aria-label="Sonido">${ico(store.sound ? "soundOn" : "soundOff")}<span>Sonido</span></button>`;
  const mode = `<button class="tb" data-act="mode" data-m="${isLearn ? "drill" : "learn"}">${ico(isLearn ? "target" : "book")}<span>${isLearn ? "Practicar" : "Aprender"}</span></button>`;
  const nextLbl = `Siguiente`;
  if (isLearn) {
    const main = hasNext
      ? `<button class="tb-main ${atEnd ? "primary" : ""}" data-act="next">${nextLbl}</button>`
      : `<button class="tb-main ${atEnd ? "primary" : ""}" data-act="mode" data-m="drill">Practicar</button>`;
    return `${sound}${main}
      ${hasNext ? mode : ""}
      <button class="tb big" data-act="ply" data-p="${T.ply - 1}" aria-label="Jugada anterior" ${T.ply === 0 ? "disabled" : ""}>${ico("prev")}</button>
      <button class="tb big" data-act="ply" data-p="${T.ply + 1}" aria-label="Jugada siguiente" ${atEnd ? "disabled" : ""}>${ico("next")}</button>`;
  }
  let main;
  if (T.done) main = hasNext ? `<button class="tb-main primary" data-act="next">${nextLbl}</button>`
    : `<button class="tb-main primary" data-act="retry">Repetir</button>`;
  else main = `<button class="tb-main" data-act="show">Ver jugada${T.mistakes ? ` <span class="sub">· ${T.mistakes} err.</span>` : ""}</button>`;
  return `${sound}<button class="tb" data-act="hint" ${T.done ? "disabled" : ""}>${ico("hint")}<span>Pista</span></button>${main}${mode}
    <button class="tb" data-act="retry">${ico("restart")}<span>Reiniciar</span></button>`;
}
function renderTrainer() {
  if (!T || view.name !== "trainer") return;
  renderBoard();
  const total = T.d.sans.length, inQueue = T.queue.length > 1;
  $("#tv-title").innerHTML = `<div class="eyebrow"><span class="side-dot ${T.o.side}" aria-hidden="true"></span>${esc(T.o.name)}${inQueue ? ` · ${T.qi + 1} de ${T.queue.length}` : ""} · ${T.mode === "learn" ? "Aprender" : "Practicar"}</div><strong>${esc(T.l.name)}</strong>`;
  $("#prog").style.width = (total ? T.ply / total * 100 : 0) + "%";
  const card = $("#card"); card.innerHTML = cardHTMLFor(); card.scrollTop = 0;
  $("#side").innerHTML = arrowToggle() + movesHTMLFor() + linesListHTML();
  $("#bar").innerHTML = barHTML();
  $("#sheet-host").innerHTML = T.sheet ? `<div class="scrim" data-act="sheet-close"></div>
    <div class="sheet" role="dialog" aria-label="Jugadas"><div class="row"><h3>${esc(T.l.name)}</h3><button class="btn small" data-act="sheet-close">Cerrar</button></div>${arrowToggle()}
    ${movesHTMLFor()}${linesListHTML()}</div>` : "";
}

/* ---------- arrastrar y tocar ---------- */
let drag = null;
function sqAt(x, y) { const el = document.elementFromPoint(x, y); const s = el && el.closest && el.closest("[data-sq]"); return s ? s.dataset.sq : null; }
function onDown(e) {
  if (!canMove()) return;
  const s = e.target.closest("[data-sq]"); if (!s) return;
  const name = s.dataset.sq, p = T.game.get(name);
  if (T.sel && T.sel !== name && !(p && p.color === T.o.side)) { tryMove(T.sel, name); return; }
  if (!p || p.color !== T.o.side) { T.sel = null; renderBoard(); return; }
  e.preventDefault();
  const size = s.getBoundingClientRect().width;
  const ghost = document.createElement("div");
  ghost.className = "drag"; ghost.style.width = ghost.style.height = size + "px";
  ghost.style.backgroundImage = `url("${PIECES[p.color + p.type]}")`;
  ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
  document.body.appendChild(ghost);
  drag = { from: name, ghost, moved: false, x: e.clientX, y: e.clientY };
  T.sel = name; renderBoard();
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp, { once: true });
  window.addEventListener("pointercancel", onUp, { once: true });
}
function onMove(e) {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) drag.moved = true;
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
}
function onUp(e) {
  window.removeEventListener("pointermove", onMove);
  if (!drag) return;
  const d = drag; drag = null; d.ghost.remove();
  const to = sqAt(e.clientX, e.clientY);
  if (d.moved && to && to !== d.from) tryMove(d.from, to);
  else renderBoard();
}

/* ---------- eventos ---------- */
function findOpening(id) { return OPENINGS.find(o => o.id === id); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "setn") { store.n = +b.dataset.n; persist(); render(); }
  else if (a === "filter") { view.filter = b.dataset.f; render(); }
  else if (a === "open") { view = Object.assign({}, view, { name: "opening", opening: findOpening(b.dataset.o) }); render(); window.scrollTo(0, 0); }
  else if (a === "home") { view = Object.assign({}, view, { name: "home" }); render(); }
  else if (a === "learn" || a === "drill") { const o = view.opening; startTrainer(o.lines.map(l => [o, l]), +b.dataset.i, a, o.name); }
  else if (a === "drill-all") { const o = view.opening; const now = Date.now();
    const q = activeLines(o).map(l => [o, l]).sort((x, y) => (isDue(o.id + "/" + y[1].id, now) - isDue(o.id + "/" + x[1].id, now)));
    startTrainer(q, 0, "drill", o.name); }
  else if (a === "review") { startTrainer(dueList(), 0, "drill", "Repaso"); }
  else if (a === "back") { if (RO) RO.disconnect(); view = Object.assign({}, view, { name: T.title === "Repaso" ? "home" : "opening", opening: T.o }); T = null; render(); window.scrollTo(0, 0); }
  else if (a === "mode") setMode(b.dataset.m);
  else if (a === "ply") { gotoPly(+b.dataset.p); }
  else if (a === "hint") giveHint();
  else if (a === "show") showMove();
  else if (a === "retry") { loadLine(); renderTrainer(); }
  else if (a === "next") gotoLine(T.qi + 1);
  else if (a === "goto-line") gotoLine(+b.dataset.i);
  else if (a === "sound") { store.sound = !store.sound; persist(); if (store.sound) { audio(); sfx("move"); } renderTrainer(); }
  else if (a === "arrows") { store.arrows = !store.arrows; persist(); renderTrainer(); }
  else if (a === "sheet") { T.sheet = !T.sheet; renderTrainer(); }
  else if (a === "sheet-close") { T.sheet = false; renderTrainer(); }
  else if (a === "reset") { view.confirmReset = true; render(); }
  else if (a === "reset-no") { view.confirmReset = false; render(); }
  else if (a === "reset-yes") { store = Object.assign({}, store, { lines: {} }); view.confirmReset = false; persist(); render(); }
});
document.addEventListener("keydown", e => {
  if (view.name !== "trainer" || !T) return;
  if (e.key === "Escape" && T.sheet) { T.sheet = false; renderTrainer(); return; }
  if (T.mode !== "learn") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); gotoPly(T.ply + 1); }
  else if (e.key === "ArrowLeft") gotoPly(T.ply - 1);
  else if (e.key === "Home") gotoPly(0);
  else if (e.key === "End") gotoPly(T.d.sans.length);
});

render();
</script>
