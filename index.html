enemos el centro y maniobramos Cbd2-f1-g3 para atacar en el flanco de rey.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Morphy: el rival pregunta al alfil. Si 4.Axc6 dxc6 5.Cxe5?, ...Dd4 recupera el peón con buen juego.","Mantenemos la clavada retirando el alfil a a4. Así conservamos la pieza y la presión sobre c6.","El caballo se desarrolla y ataca nuestro peón de e4. El rival quiere contraatacar en el centro.","Enrocamos sin miedo: si ...Cxe4, d4 o Te1 recuperan el peón con ventaja de desarrollo.","El rival desarrolla el alfil con calma y prepara su enroque. Ahora sí amenaza ...b5 y ...Cxe4.","La torre defiende e4. Ahora sí amenazamos Axc6 seguido de Cxe5, porque e4 ya está protegido.","El rival rompe la clavada y echa a nuestro alfil de a4, ganando espacio en el flanco de dama.","El alfil se retira a b3, donde apunta a f7 desde la diagonal a2-g8. Es su mejor casilla.","El rival refuerza e5 con un peón, libera al alfil de c8 y evita sorpresas en el centro.","Preparamos d4 con apoyo y damos al alfil la casilla c2 por si el rival juega ...Ca5.","Las negras enrocan y llegan a la posición base de la Cerrada. Ahora eligen su plan.","Evitamos ...Ag4, que clavaría nuestro caballo y presionaría d4. Ahora d4 está listo para la próxima jugada.","La Breyer: el caballo retrocede para reubicarse en d7, desde donde apoyará e5 y dejará libre el peón de c.","Aprovechamos el tiempo para ocupar el centro con d4. Ahora e5 está bajo presión.","El caballo llega a d7 y refuerza e5. Las negras forman un bloque sólido y elástico.","Nuestro caballo de dama inicia la maniobra clásica hacia f1 y g3.","El alfil sale a b7 para presionar nuestro peón de e4 a lo largo de la gran diagonal.","Protegemos e4 por segunda vez y despejamos b3. El alfil queda bien situado en la diagonal b1-h7.","El rival refuerza e5 y prepara ...Af8, otra maniobra típica de la Breyer para reorganizar sus piezas.","El caballo sigue su camino hacia g3, desde donde controlará f5 y h5 y apoyará el ataque en el flanco de rey."]},{"id":"berlinesa-d3","name":"Defensa Berlinesa con 4.d3","moves":"e4 e5 Nf3 Nc6 Bb5 Nf6 d3 Bc5 c3 O-O O-O d6 h3 a6 Ba4 Ba7 Re1","idea":"Evitamos el final del Muro de Berlín con 4.d3: partida maniobrera con damas, con el plan h3, Te1, Cbd2-f1-g3 y quizás d4.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Berlinesa: el rival ataca e4 de inmediato en vez de jugar ...a6.","El Anti-Berlinesa: protegemos e4 con calma y evitamos el final del Muro. Partida maniobrera con piezas.","El rival coloca el alfil en su diagonal más activa, apuntando a f2.","Preparamos d4 para echar al alfil de c5 y damos a nuestro alfil una retirada por a4 y c2.","El rival pone su rey a salvo y espera a ver nuestro plan antes de decidir el suyo.","Enrocamos nosotros también. Plan típico: h3, Te1, Cbd2-f1-g3 y quizás d4.","El rival refuerza e5 y abre la diagonal de su alfil de c8, que amenaza ir a g4.","Evitamos ...Ag4, que clavaría el caballo de f3. Es una jugada útil en casi todas las líneas.","El rival pregunta a nuestro alfil, que ya no tiene mucho que hacer en b5.","Conservamos el alfil en la diagonal a4-e8; más adelante pasará a c2 o b3 según convenga.","El rival retira el alfil a a7 para que no lo moleste d4 ni b4. Desde a7 sigue mirando a f2.","La torre ocupa la columna e y prepara Cbd2-f1. La lucha es lenta y maniobrera, ideal para entender planes."]},{"id":"cambio","name":"Variante del Cambio","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Bxc6 dxc6 O-O f6 d4 exd4 Nxd4 c5 Nb3 Qxd1 Rxd1","idea":"Mayoría de peones 4 contra 3 en el flanco de rey para un buen final blanco; el rival tiene a cambio la pareja de alfiles.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Morphy: el rival pregunta al alfil antes de desarrollar el caballo de rey.","La Variante del Cambio: entregamos el alfil por el caballo para dañar la estructura de peones negra.","El rival recaptura hacia el centro y abre líneas para sus alfiles. Tiene la pareja de alfiles.","Enrocamos y ahora sí amenazamos Cxe5, porque el contraataque ...Dd4 ya no funciona.","El rival defiende e5 con el peón de f. Es sólido, aunque le quita la casilla f6 a su caballo.","Abrimos el centro para cambiar peones y llegar a un final con una mayoría sana en el flanco de rey.","El rival cambia en d4. Mantener e5 con ...Ag4 es otra opción, pero así simplifica.","Recapturamos con el caballo, que queda centralizado. Nuestra mayoría 4 contra 3 en el flanco de rey es la clave.","El rival echa a nuestro caballo y gana espacio. Sus peones doblados controlan casillas importantes.","Retiramos el caballo a b3 y ofrecemos el cambio de damas: queremos un final.","El rival cambia damas. En el final, su pareja de alfiles compensa en parte su peor estructura.","Recapturamos con la torre, que toma la columna d. Plan: Cc3, Ae3 y avanzar f4-e5 con la mayoría."]},{"id":"clasica","name":"Defensa Clásica (3...Ac5)","moves":"e4 e5 Nf3 Nc6 Bb5 Bc5 O-O Nd4 Nxd4 Bxd4 c3 Bb6 d4 c6 Ba4 d6 Na3","idea":"Ganamos tiempos contra el alfil negro con c3 y d4 y ocupamos el centro. El caballo irá a c4 para atacar al alfil de b6.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Clásica: el alfil sale a c5, su casilla más activa, y mira a f2.","Enrocamos primero. Después prepararemos c3 y d4, ganando tiempo contra el alfil.","El rival lleva el caballo a d4 para cambiarlo y quitar presión sobre e5. Es la línea principal de 4...Cd4.","Cambiamos caballos. Ahora el alfil negro que recapture en d4 quedará expuesto al avance c3.","El rival recaptura con el alfil, que ocupa d4 pero puede ser atacado enseguida.","Echamos al alfil con el peón y preparamos d4 con ganancia de tiempo.","El alfil se retira a b6 y sigue apuntando a f2 desde la diagonal a7-g1.","Ocupamos el centro con tiempo: atacamos e5 y ganamos espacio.","El rival ataca nuestro alfil de b5 y prepara ...d6 o ...d5 para sostener el centro.","Retiramos el alfil a a4, manteniendo la diagonal hacia e8.","El rival sostiene e5 con el peón. Su posición es sólida, pero algo pasiva.","El caballo va a c4 por a3 para atacar al alfil de b6 y presionar d6. Tenemos más espacio."]},{"id":"schliemann","name":"Gambito Schliemann","moves":"e4 e5 Nf3 Nc6 Bb5 f5 Nc3 fxe4 Nxe4 d5 Nxe5 dxe4 Nxc6 Qg5 Qe2 Nf6 f4 Qxf4 Ne5+ c6 d4 Qh4+ g3 Qh3 Bc4","idea":"Contragolpe agudo en f5. Respondemos con 4.Cc3 y el golpe Cxe5-Cxc6; tras el jaque a la descubierta las piezas negras quedan descoordinadas.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","El Gambito Schliemann: el rival ataca e4 con el peón de f. Es agresivo y arriesgado.","Defendemos e4 desarrollando. Es la respuesta más sólida y principal contra el Schliemann.","El rival captura en e4 y abre la columna f para su torre.","Recuperamos el peón. Nuestro caballo se centraliza y el rey negro queda algo expuesto.","El rival ataca el caballo y ocupa el centro. Es la continuación principal.","Golpe central: tomamos e5 aprovechando la clavada del caballo de c6. Si ...dxe4, Cxc6 crea amenazas.","El rival gana una pieza de momento, pero nuestro caballo de e5 está listo para entrar en c6.","El caballo toma en c6 y amenaza Cxd8. Además, si se mueve, el alfil de b5 dará jaque.","La mejor: la dama escapa y ataca a la vez g2 y nuestro alfil de b5 por la quinta fila.","Defendemos el alfil de b5 y presionamos e4. Si 7...Dxg2?, 8.Dh5+ deja al rey negro muy expuesto.","El rival desarrolla el caballo y sostiene e4. Ahora amenaza ganar nuestro caballo con ...bxc6.","Atacamos a la dama con el peón. Si ...Dxf4, el caballo dará jaque a la descubierta.","El rival toma en f4, pero su rey sigue en la diagonal de nuestro alfil de b5.","¡Jaque a la descubierta! El caballo vuelve a e5 y el alfil de b5 da jaque al rey.","El rival tapa el jaque con el peón, que además ataca a nuestro alfil.","Atacamos la dama con el alfil de c1, cuya diagonal ya está abierta, y ganamos tiempo.","La dama se aparta con jaque. Nuestro rey sigue en el centro, pero las piezas negras están descoordinadas.","Tapamos el jaque con el peón y echamos otra vez a la dama.","La dama se aparta a h3, lejos de nuestras piezas, desde donde molesta a nuestro flanco de rey.","Retiramos el alfil atacado por c6 y apuntamos a g8. Es la línea principal, con juego favorable para nosotros."]},{"id":"arcangel","name":"Arcángel (5...b5 y ...Bb7)","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O b5 Bb3 Bb7 Re1 Bc5 c3 d6 d4 Bb6","idea":"Los dos alfiles negros apuntan al centro y al enroque blanco."},{"id":"neo-arcangel","name":"Neo-Arcángel (5...b5 y ...Bc5)","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O b5 Bb3 Bc5 a4 Rb8 c3 d6 d4 Bb6","idea":"a4 ataca la cadena b5; ...Rb8 la mantiene."},{"id":"steinitz-moderna","name":"Steinitz Moderna (4...d6)","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 d6 c3 Bd7 d4 Nf6 O-O Be7","idea":"Las negras mantienen e5 a toda costa; las blancas ganan espacio."},{"id":"clasica-bc5","name":"Defensa Clásica (3...Bc5)","moves":"e4 e5 Nf3 Nc6 Bb5 Bc5 c3 Nf6 O-O O-O d4 Bb6","idea":"c3 y d4 ganan tiempo sobre el alfil de c5."},{"id":"bird","name":"Defensa Bird (3...Nd4)","moves":"e4 e5 Nf3 Nc6 Bb5 Nd4 Nxd4 exd4 O-O c6 Bc4 Nf6 Re1 d6 c3","idea":"Cambiar caballos y atacar el peón d4, que queda débil."}]},{"id":"escocesa","name":"Apertura Escocesa","side":"w","eco":"C44–C45","group":"1.e4 e5","blurb":"Abrir el centro de inmediato con 3.d4 y jugar con piezas activas.","lines":[{"id":"mieses","name":"Variante Mieses (4...Nf6)","moves":"e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Nf6 Nxc6 bxc6 e5 Qe7 Qe2 Nd5 c4 Ba6 b3","idea":"Expulsar al caballo con c4 y aprovechar la estructura de peones negra.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","Recuperamos el peón con el caballo, que queda centralizado. El juego se abre sin complicaciones.","Las negras atacan e4 desarrollando el caballo, la respuesta más popular a alto nivel.","Cambiamos en c6 para doblar los peones negros antes de avanzar e5.","El rival recaptura hacia el centro, aunque su estructura de peones queda dañada.","Expulsamos al caballo de f6 y ganamos espacio: es la Variante Mieses.","La dama ataca el peón de e5, que ya no puede ser defendido por un peón, y nos obliga a protegerlo.","Defendemos e5 con la dama; las damas quedan enfrentadas en la columna e. El alfil de f1 saldrá después.","El caballo se instala en d5, su mejor casilla, desde donde vigila c3, e3 y f4.","Atacamos al caballo de d5 ganando espacio en el centro.","Las negras clavan nuestro peón de c4 contra la dama, así su caballo de d5 no está realmente amenazado.","Reforzamos c4 con el peón. Seguiremos con Ab2, g3 y Ag2, aprovechando los peones débiles del rival."]},{"id":"clasica","name":"Variante Clásica (4...Bc5)","moves":"e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Bc5 Be3 Qf6 c3 Nge7 Bc4 O-O O-O Bb6 Nc2","idea":"Proteger d4 con c3 y desarrollar con normalidad, manteniendo un centro sólido.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","Recuperamos el peón con el caballo, que queda centralizado. El juego se abre sin complicaciones.","La Variante Clásica: el alfil ataca a nuestro caballo de d4.","Defendemos el caballo con el alfil, desarrollando a la vez.","La dama negra presiona d4 y f2, amenazando ganar el caballo.","Reforzamos d4 con el peón: ahora el caballo está bien protegido.","Las negras desarrollan el caballo a e7 para no tapar a su dama de f6.","El alfil ocupa una diagonal activa contra f7 y prepara el enroque.","El rival enroca y pone su rey a salvo antes de buscar contrajuego en el centro.","Enrocamos también; la torre de f1 protege f2 de la dama negra.","Las negras retiran el alfil para mantenerlo en la diagonal que presiona d4 y e3.","Retiramos el caballo de d4, muy presionado, a c2, donde defiende e3. Prepararemos Cd2 y f4 con un centro sólido."]},{"id":"cuatro-caballos","name":"Escocesa de los Cuatro Caballos (4...Cf6 5.Cc3)","moves":"e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Nf6 Nc3 Bb4 Nxc6 bxc6 Bd3 d5 exd5 cxd5 O-O O-O Bg5 c6 Qf3 Be7 Rae1","idea":"Desarrollo sólido: cambiamos en c6, abrimos la columna e y presionamos con Ag5, Df3 y Tae1.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","Recuperamos el peón con el caballo, que queda centralizado. El juego se abre sin complicaciones.","Las negras atacan nuestro peón de e4 desarrollando el caballo.","Defendemos e4 con el caballo: es la Escocesa de los Cuatro Caballos, sólida y con desarrollo rápido.","El alfil clava nuestro caballo de c3, volviendo a amenazar e4.","Cambiamos el caballo de d4 antes de seguir, doblando los peones negros.","El rival recaptura hacia el centro, preparando la ruptura ...d5.","Protegemos e4 con el alfil y preparamos el enroque.","Las negras rompen en el centro, liberando su juego.","Cambiamos el peón central y abrimos la columna e para nuestras torres.","Las negras recuperan con el peón y controlan el centro, pero su peón de a7 queda aislado.","Enrocamos; el rey queda a salvo y la torre lista para la columna e.","El rival también enroca, y el juego queda equilibrado pero rico.","Clavamos al caballo de f6 contra la dama, presionando d5 de forma indirecta.","Las negras refuerzan d5 para liberar a la dama de su defensa.","La dama refuerza la clavada sobre f6 y prepara Tae1 con presión en el flanco de rey.","El rival retira el alfil a e7 para deshacer la clavada.","Llevamos la torre a la columna e abierta. Todas nuestras piezas están activas y vigilamos la casilla e5."]},{"id":"clasica-cxc6","name":"Variante Clásica, 5.Cxc6 Df6","moves":"e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Bc5 Nxc6 Qf6 Qd2 dxc6 Nc3 Be6 Na4 Rd8 Bd3","idea":"Cambiamos en c6 y paramos el mate en f2; después buscamos cambiar el fuerte alfil de c5 con Ca4.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","Recuperamos el peón con el caballo, que queda centralizado. El juego se abre sin complicaciones.","El alfil negro ataca nuestro caballo central y apunta a f2, igual que en la Variante Clásica.","En lugar de defenderlo, cambiamos el caballo: así evitamos toda la presión sobre d4.","¡Jugada intermedia! La dama amenaza mate en f2 antes de recapturar en c6.","Paramos el mate: la dama defiende f2 por la segunda fila y deja libre c3 para el caballo.","Ahora sí, las negras recapturan, abriendo la columna d y la diagonal de su alfil de c8.","Desarrollamos el caballo; buscaremos cambiar el fuerte alfil de c5 con Ca4.","El rival desarrolla y se prepara para enrocar largo.","Atacamos al alfil de c5 para eliminar la pareja de alfiles negra.","La torre ocupa la columna d, apuntando directamente a nuestra dama de d2.","Tapamos la columna d con el alfil, que protege e4. A largo plazo nuestra estructura de peones es mejor."]},{"id":"steinitz","name":"Variante Steinitz (4...Qh4)","moves":"e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Qh4 Nb5 Bb4+ Bd2 Qxe4+ Be2 Kd8 O-O Bxd2 Nxd2","idea":"Las negras ganan un peón, pero el rey queda en el centro y nosotros nos desarrollamos con tiempos.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","Recuperamos el peón con el caballo, que queda centralizado. El juego se abre sin complicaciones.","La Variante Steinitz: la dama ataca nuestro peón de e4 de forma prematura.","Contraatacamos: el caballo amenaza Cxc7+, doble a rey y torre.","Las negras dan jaque para desviar nuestro alfil antes de capturar en e4.","Cubrimos el jaque con el alfil, ofreciendo el peón de e4.","El rival se come el peón de e4 con jaque. Ha ganado material, pero su dama está muy expuesta.","Tapamos el jaque desarrollando el alfil. Ahora volvemos a amenazar Cxc7+.","El rey defiende c7, pero pierde el derecho a enrocar y queda en el centro.","Enrocamos: tenemos un peón menos, pero mucho mejor desarrollo y el rey negro está expuesto.","Las negras cambian el alfil para simplificar la posición.","Recapturamos atacando a la dama. Con Af3, Te1 y Cc4 tendremos un ataque fuerte contra el rey negro."]},{"id":"gambito-escoces","name":"Gambito Escocés","moves":"e4 e5 Nf3 Nc6 d4 exd4 Bc4 Nf6 e5 d5 Bb5 Ne4 Nxd4 Bd7 Bxc6 bxc6 O-O Be7 f3 Nc5 f4","idea":"Desarrollo antes de recuperar el peón, buscando iniciativa con el espacio que da e5.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","Gambito Escocés: en lugar de recuperar el peón, desarrollamos el alfil apuntando a f7.","Las negras desarrollan atacando e4; es la respuesta más sólida.","Avanzamos con tiempo contra el caballo de f6 y ganamos espacio en el centro.","Contraataque central: el peón ataca nuestro alfil y el caballo negro encuentra la casilla e4.","El alfil se retira clavando al caballo de c6, que defiende el peón de d4.","El caballo negro se instala en e4, una casilla muy activa.","Recuperamos el peón. El material está igualado y tenemos espacio gracias al peón de e5.","Las negras desclavan el caballo de c6 para que pueda volver a defenderse, completando el desarrollo.","Cambiamos el alfil por el caballo, doblando los peones negros.","El rival recaptura con el peón, con una estructura débil en el flanco de dama.","Enrocamos, poniendo el rey a salvo y preparando el avance f3-f4 con apoyo de la torre.","Las negras desarrollan su alfil y preparan el enroque.","Atacamos al caballo de e4, que debe abandonar su buena casilla.","El caballo se retira a c5, desde donde vigila e4 y d3, pero ya no ocupa el centro.","Avanzamos f4 para apoyar e5 y preparar f5 con ataque en el flanco de rey."]},{"id":"gambito-escoces-c3","name":"Gambito Escocés (4...Ac5 5.c3)","moves":"e4 e5 Nf3 Nc6 d4 exd4 Bc4 Bc5 c3 Nf6 e5 d5 Bb5 Ne4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 O-O O-O","idea":"Ofrecemos un segundo peón con c3; tras e5 y cxd4 nos quedamos con un buen centro d4-e5.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","Gambito Escocés: en lugar de recuperar el peón, desarrollamos el alfil apuntando a f7.","Las negras protegen el peón de d4 con el alfil, que además apunta a nuestro punto f2.","Ofrecemos otro peón para abrir líneas, al estilo del Giuoco Piano.","El rival desarrolla y ataca e4. Si ...dxc3, Cxc3 nos da un desarrollo enorme.","Atacamos al caballo de f6 ganando espacio; no tiene buenas casillas a las que retirarse.","La respuesta correcta: el peón contraataca nuestro alfil.","El alfil se retira a b5 clavando al caballo de c6, que es el defensor del peón de d4.","El caballo se instala en e4, una casilla fuerte en el centro, apoyado por el peón de d5.","Recuperamos el peón y formamos el centro d4-e5, atacando además al alfil de c5.","El alfil sale con jaque para no tener que retroceder ante nuestro centro de peones.","Cubrimos con el alfil para cambiar piezas y aliviar la presión sobre nuestra posición.","Las negras cambian los alfiles, aliviando un poco su posición antes de enrocar.","Recapturamos con el caballo, que ataca al caballo de e4.","El rival enroca y pone su rey a salvo antes de buscar contrajuego en el centro.","Enrocamos. Tenemos un buen centro con d4 y e5; el plan es Tc1 y presionar en la columna c."]},{"id":"goring","name":"Gambito Göring (4.c3)","moves":"e4 e5 Nf3 Nc6 d4 exd4 c3 dxc3 Nxc3 Bb4 Bc4 d6 O-O Bxc3 bxc3 Nf6 e5 Nxe5 Nxe5 dxe5 Qb3 Qe7 Ba3 c5 Bb5+","idea":"Damos un peón por un desarrollo rapidísimo; la pareja de alfiles y las líneas abiertas hostigan al rey negro.","notes":["Abrimos con el peón de rey, buscando un juego abierto y activo.","El rival ocupa también el centro con su peón de rey y libera su alfil de f8 y su dama.","Atacamos el peón de e5 desarrollando el caballo hacia el centro y preparando la ruptura d4.","Las negras defienden e5 con el caballo, la respuesta más natural.","La Escocesa: rompemos el centro de inmediato, atacando e5 por segunda vez.","El rival cambia, la única forma razonable de no perder el peón de e5.","El Gambito Göring: ofrecemos un peón para desarrollar rápidamente las piezas.","Las negras aceptan el gambito y ganan un peón; a cambio nos dejan el centro libre para d4.","Recapturamos con el caballo: un peón menos, pero ventaja de desarrollo y control de d5.","El alfil clava nuestro caballo de c3 y presiona e4, que queda con menos defensores.","El alfil se dirige a la diagonal de f7, como en la Italiana, y deja el camino libre para enrocar.","El rival controla e5 y abre el alfil de c8, evitando de momento nuestro avance e5.","Enrocamos sin preocuparnos por el caballo; queremos abrir líneas.","Las negras cambian el caballo y nos doblan los peones.","Recuperamos; tenemos la pareja de alfiles y la columna b semiabierta.","El rival desarrolla el caballo de rey y ataca nuestro peón de e4.","Abrimos líneas contra el rey negro, que todavía no ha enrocado.","Las negras capturan el peón con el caballo, que queda en el centro.","Cambiamos caballos para abrir aún más la posición.","El rival recaptura, pero su rey sigue en el centro.","Doble amenaza: la dama apunta a f7 junto al alfil y también ataca b7.","Las negras defienden f7 con la dama, aunque así la colocan en la diagonal de nuestro alfil de c1.","Atacamos la dama e impedimos el enroque corto negro.","El rival tapa la diagonal del alfil de a3 con un peón para salvar la dama.","Jaque: el rey negro sigue sin enrocar y nuestros alfiles dominan. Tenemos compensación de sobra por los dos peones."]}]},{"id":"gambito-rey","name":"Gambito de Rey","side":"w","eco":"C30–C39","group":"1.e4 e5","blurb":"2.f4: el gambito romántico. Se ofrece un peón para abrir la columna f y dominar el centro.","lines":[{"id":"kieseritzky","name":"Aceptado, Kieseritzky","moves":"e4 e5 f4 exf4 Nf3 g5 h4 g4 Ne5 Nf6 Bc4 d5 exd5 Bd6 d4","idea":"Socavar la cadena de peones negra con h4 y ocupar e5.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","Las negras aceptan el gambito: ganan un peón, pero nos ceden el centro y la columna f semiabierta.","Desarrollamos el caballo e impedimos el molesto jaque ...Dh4+.","Las negras protegen el peón de f4 con g5, la defensa clásica.","Atacamos la cadena de peones negra antes de que se consolide.","El peón avanza atacando nuestro caballo de f3, que tiene que decidir adónde ir.","El Gambito Kieseritzky: el caballo salta a e5, casilla central y activa, apuntando a f7 y g4.","La Defensa Berlín: el caballo ataca e4 y se desarrolla.","El alfil apunta a f7, coordinado con el caballo de e5.","Las negras devuelven el peón para cortar la diagonal y abrir su juego.","Capturamos el peón y mantenemos la presión: el peón de d5 corta la diagonal del alfil de c8.","El alfil ataca nuestro caballo de e5, la pieza clave de la variante.","Reforzamos el caballo y abrimos el alfil de c1, que pronto atacará el peón de f4."]},{"id":"moderna","name":"Aceptado, Defensa Moderna (3...d5)","moves":"e4 e5 f4 exf4 Nf3 d5 exd5 Nf6 Bb5+ c6 dxc6 Nxc6 d4 Bd6 O-O","idea":"Las negras devuelven el peón para desarrollarse; las blancas se quedan con el centro.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","Las negras aceptan el gambito: ganan un peón, pero nos ceden el centro y la columna f semiabierta.","Desarrollamos el caballo e impedimos el molesto jaque ...Dh4+.","La Defensa Moderna: las negras devuelven el peón para abrir su juego en el centro.","Capturamos el peón central; nuestro peón de d5 incomoda el desarrollo negro.","El caballo se desarrolla y prepara la recaptura en d5.","Jaque, desarrollando con tiempo y sujetando el peón de d5.","Las negras cubren con un peón, ofreciendo cambios.","Capturamos el peón y mantenemos el equilibrio material de momento.","El rival recupera con el caballo, desarrollándose.","Ocupamos el centro con el peón de dama y abrimos el alfil de c1 para recuperar f4.","Las negras protegen el peón de f4 con el alfil, que además ocupa una buena diagonal.","Enrocamos. El plan es c4, Cc3 y recuperar el peón de f4 en el momento oportuno."]},{"id":"fischer","name":"Aceptado, Defensa Fischer (3...d6)","moves":"e4 e5 f4 exf4 Nf3 d6 d4 g5 h4 g4 Ng1 Nf6 Bxf4 Nxe4 Bd3","idea":"La retirada Ng1 parece rara, pero el peón f4 acabará cayendo.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","Las negras aceptan el gambito: ganan un peón, pero nos ceden el centro y la columna f semiabierta.","Desarrollamos el caballo e impedimos el molesto jaque ...Dh4+.","La Defensa Fischer: el peón controla e5 y prepara ...g5 sin permitir Ce5.","Ocupamos el centro, que es nuestra compensación por el peón.","Las negras protegen f4 con el peón de g, aunque así debilitan su flanco de rey.","Atacamos la cadena de peones negra antes de que ...h6 la consolide.","El peón avanza atacando nuestro caballo, que no tiene una casilla buena como e5.","¡La retirada! Parece extraña, pero el caballo volverá por e2 y el peón de f4 queda débil.","Las negras desarrollan el caballo atacando nuestro peón de e4.","Recuperamos el peón del gambito y desarrollamos el alfil con tiempo.","El rival toma el peón de e4 y su caballo queda en el centro.","Atacamos el caballo de e4 desarrollando; tenemos la columna f semiabierta y mejor desarrollo."]},{"id":"cunningham","name":"Aceptado, Defensa Cunningham (3...Ae7)","moves":"e4 e5 f4 exf4 Nf3 Be7 Bc4 Nf6 e5 Ng4 O-O Nc6 d4","idea":"Desarrollamos rápido con Ac4, ganamos espacio con e5 y d4 y aprovechamos la columna f tras el enroque.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","Las negras aceptan el gambito: ganan un peón, pero nos ceden el centro y la columna f semiabierta.","Desarrollamos el caballo e impedimos el molesto jaque ...Dh4+.","La Defensa Cunningham: el alfil prepara ...Ah4+ para molestar a nuestro rey.","Desarrollamos el alfil contra f7. Si ...Ah4+, lo habitual es Rf1: perdemos el enroque, pero ganamos tiempo contra el alfil.","Las negras desarrollan el caballo y atacan nuestro peón de e4.","Ganamos espacio expulsando al caballo de f6 de su mejor casilla.","El caballo se va a g4, buscando saltar a e3 o f2 para molestar a nuestro rey.","Enrocamos; la torre de f1 vigila f2 y el peón de f4.","Las negras desarrollan el otro caballo y presionan nuestro peón de e5.","Reforzamos e5. Si ...d5, exd6 al paso abre la columna e y la torre de f1 apunta al peón de f4."]},{"id":"alfil","name":"Gambito de Alfil (3.Ac4)","moves":"e4 e5 f4 exf4 Bc4 Nf6 Nc3 c6 Bb3 d5 exd5 cxd5 d4 Bd6 Nge2 O-O O-O","idea":"Desarrollamos el alfil antes que el caballo; tras d4 y Cge2 recuperamos el peón de f4.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","Las negras aceptan el gambito y ganan un peón; a cambio nos dejan el centro libre para d4.","El Gambito de Alfil: desarrollamos el alfil antes que el caballo. Si ...Dh4+, Rf1 sin peligro.","La defensa más sólida: el caballo se desarrolla y ataca e4.","Defendemos e4 con el caballo, que además vigila la casilla d5.","Las negras preparan ...d5 para romper el centro con tiempo sobre nuestro alfil.","Retiramos el alfil de antemano, evitando que ...d5 lo ataque con tiempo.","Las negras rompen en el centro y atacan nuestro peón de e4.","Capturamos y abrimos líneas, sin dejar al rival un peón fuerte en e4.","El rival recaptura con el peón y se queda con el centro.","Ocupamos el centro y abrimos el alfil de c1 para recuperar f4.","Las negras protegen el peón de f4 con el alfil, que además ocupa una buena diagonal.","El caballo va a e2 para atacar el peón de f4 sin estorbar al peón de f.","El rival enroca y pone su rey a salvo antes de que abramos la columna f.","Enrocamos; la columna f se abrirá cuando recuperemos el peón con Cxf4 o Axf4."]},{"id":"rehusado","name":"Rehusado Clásico (2...Bc5)","moves":"e4 e5 f4 Bc5 Nf3 d6 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2","idea":"El alfil en c5 impide el enroque corto; c3 y d4 lo expulsan.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","El Gambito de Rey Rehusado: el alfil se coloca en la diagonal a7-g1 e impide nuestro enroque corto.","Desarrollamos. ¡Nunca fxe5?? por ...Dh4+ y ...Dxe4+, ganando la torre de h1!","Las negras refuerzan e5 y mantienen el alfil en c5.","Preparamos d4 para expulsar al molesto alfil de c5.","El rival desarrolla el caballo de rey y ataca nuestro peón de e4.","Rompemos en el centro atacando el alfil de c5, que debe moverse o cambiar.","Las negras cambian las piezas para simplificar la posición.","Recuperamos con el peón y logramos un centro de peones ideal.","El alfil da jaque para no retroceder y molestar nuestro desarrollo.","Cubrimos con el alfil para cambiarlo: sin ese alfil, ya podremos enrocar corto.","Las negras cambian las piezas para simplificar la posición.","Recapturamos con el caballo, que defiende e4. Tenemos un gran centro y ya podemos enrocar."]},{"id":"falkbeer","name":"Contragambito Falkbeer","moves":"e4 e5 f4 d5 exd5 e4 d3 Nf6 dxe4 Nxe4 Nf3 Bc5 Qe2","idea":"Las negras contraatacan en el centro; Qe2 clava el caballo de e4.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","El Contragambito Falkbeer: las negras contraatacan en el centro en lugar de aceptar.","Capturamos el peón y mantenemos el equilibrio material de momento.","Las negras empujan e4, cortando nuestro desarrollo; el peón es una espina en nuestra posición.","Atacamos el peón de e4 de inmediato para disolverlo.","El rival sostiene el peón con el caballo, que a la vez se desarrolla.","Capturamos el peón y mantenemos el equilibrio material de momento.","El caballo se centraliza en e4, una casilla muy activa en nuestro campo.","Desarrollamos el caballo y controlamos e5; también preparamos el enroque.","Las negras apuntan a f2 y amenazan tácticas sobre nuestro rey.","Clavamos al caballo de e4 contra el rey y amenazamos ganarlo. Las negras tendrán que defenderlo con ...Af5."]},{"id":"rehusado-d6","name":"Rehusado con 2...d6","moves":"e4 e5 f4 d6 Nf3 Nc6 Bc4 Nf6 d3 Be7 O-O O-O Nc3","idea":"Las negras defienden e5 con calma; desarrollamos y preparamos f5 o fxe5 para usar la columna f.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","Las negras rehúsan con ...d6, defendiendo e5 de forma sólida.","Desarrollamos atacando e5. Si ...exf4, llegamos a la Defensa Fischer.","El rival refuerza e5 con el caballo y mantiene el centro cerrado.","El alfil apunta a f7, aprovechando la futura columna f.","Las negras desarrollan una pieza más y se preparan para el enroque.","Protegemos e4 y abrimos el alfil de c1; el centro queda sólido.","El rival desarrolla el alfil a e7 y prepara el enroque corto.","Enrocamos; la torre de f1 apoya el avance f5 o el cambio en e5.","Las negras enrocan y ponen el rey a salvo, aunque f7 sigue en el punto de mira.","Completamos el desarrollo. El plan es f5 para ganar espacio o fxe5 para abrir la columna f contra f7."]},{"id":"muzio","name":"Gambito Muzio (5.O-O)","moves":"e4 e5 f4 exf4 Nf3 g5 Bc4 g4 O-O gxf3 Qxf3 Qf6 e5 Qxe5 d3 Bh6 Nc3 Ne7 Bd2 Nbc6 Rae1 Qf5 Nd5","idea":"Entregamos el caballo de f3 para abrir la columna f y atacar f7 con todas las piezas.","notes":["Abrimos con el peón de rey, preparando el gambito.","El rival responde con el peón de rey, disputando el centro y abriendo diagonales a su dama y su alfil.","¡El Gambito de Rey! Ofrecemos el peón de f para desviar el peón de e5 y abrir la columna f.","Las negras aceptan el gambito: ganan un peón, pero nos ceden el centro y la columna f semiabierta.","Desarrollamos el caballo e impedimos el molesto jaque ...Dh4+.","Las negras defienden f4 con g5, la defensa clásica del peón ganado.","El alfil apunta a f7. Si ahora ...g4, entregamos el caballo.","El peón ataca nuestro caballo de f3; en lugar de retirarlo, lo vamos a entregar.","¡El Gambito Muzio! Dejamos el caballo y enrocamos: abrimos la columna f contra f7.","Las negras toman la pieza y ya tienen un caballo de ventaja.","Recuperamos con la dama; vamos una pieza por debajo, pero con un ataque terrible sobre f7.","La mejor defensa: la dama protege f7 y el peón de f4.","Sacrificamos otro peón para abrir líneas y desviar a la dama.","El rival acepta el segundo peón y su dama queda en el centro, expuesta.","Abrimos el alfil de c1 para recuperar f4 y atacar.","Las negras defienden el peón de f4 con el alfil para no ceder más material.","Desarrollamos el caballo, que prepara saltar a d5 con amenazas sobre c7 y f6.","El caballo se desarrolla a e7 y protege las casillas d5 y f5.","Preparamos Tae1 para atacar la dama en la columna e.","Las negras desarrollan una pieza más y se preparan para el enroque.","La torre ataca la dama: todas nuestras piezas participan en el ataque.","La dama se retira a f5, ofreciendo el cambio de damas para frenar el ataque.","El caballo salta a d5, amenazando Cxe7, Cf6+ y más. A cambio de la pieza tenemos un ataque peligrosísimo."]}]},{"id":"vienesa","name":"Apertura Vienesa","side":"w","eco":"C25–C29","group":"1.e4 e5","blurb":"Con 2.Cc3 protegemos e4 y preparamos f4 o Ac4. Combina un juego sólido con gambitos y trampas muy agudos.","lines":[{"id":"gambito-vienes","name":"Gambito Vienés (3.f4 d5)","moves":"e4 e5 Nc3 Nf6 f4 d5 fxe5 Nxe4 Nf3 Be7 d4 O-O Bd3 f5 exf6 Bxf6 O-O","idea":"Atacamos e5 con f4 y, tras ...d5, ganamos espacio con fxe5 y d4. Luego echamos al caballo de e4 y usamos la columna f abierta.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5 y disputa el centro de forma simétrica.","La Vienesa: desarrollamos el caballo y protegemos e4. Según lo que haga el rival prepararemos f4 o Ac4.","El rival desarrolla el caballo y ataca e4. Es la respuesta más popular.","¡El Gambito Vienés! Atacamos e5 con el peón de f. Si 3...exf4?, 4.e5 echa al caballo con ventaja.","La mejor respuesta: el rival contraataca en el centro en lugar de tomar en f4.","Tomamos en e5 y el peón echa al caballo de f6. Ganamos espacio en el flanco de rey.","El caballo salta a e4, donde está muy activo. Pronto lo atacaremos.","Desarrollamos y protegemos e5. Es la línea principal; también se juega 5.Df3 o 5.d3.","El rival desarrolla y prepara el enroque. El caballo de e4 sigue molestando.","Construimos un centro fuerte con e5 y d4. Ahora Ad3 atacará al caballo de e4.","El rival enroca y prepara ...f6 o ...f5 para romper nuestro centro.","Atacamos el caballo de e4, la pieza más activa del rival.","El rival sostiene el caballo con ...f5. Ahora podemos capturar al paso.","¡Capturamos al paso! exf6 abre la columna f para nuestra torre tras el enroque.","El rival recaptura con el alfil, que ahora apunta a d4.","Enrocamos y la torre llega a la columna f abierta. Plan: Ce2 o Axe4, presión sobre f7 y un centro sólido."]},{"id":"frankenstein-dracula","name":"Variante Frankenstein-Drácula (3...Cxe4 4.Dh5 Cd6 5.Ab3 Cc6)","moves":"e4 e5 Nc3 Nf6 Bc4 Nxe4 Qh5 Nd6 Bb3 Nc6 Nb5 g6 Qf3 f5 Qd5 Qe7 Nxc7+ Kd8 Nxa8 b6 d3 Bb7 h4","idea":"Respondemos al truco ...Cxe4 con 4.Dh5 y amenazas de mate en f7. Ganamos la torre de a8 y luego atacamos el rey negro descolocado.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5 y disputa el centro de forma simétrica.","La Vienesa: desarrollamos el caballo y protegemos e4. Según lo que haga el rival prepararemos f4 o Ac4.","El rival desarrolla el caballo y ataca e4. Es la respuesta más popular.","Desarrollamos el alfil apuntando a f7. Invitamos al truco ...Cxe4, que lleva a posiciones muy agudas.","El rival usa un truco de horquilla: si 4.Cxe4?, ...d5 ataca alfil y caballo y recupera la pieza.","¡La respuesta correcta! Amenazamos Dxf7 mate. Ojo: si 4...Cf6??, 5.Dxf7# es mate.","La única buena: el caballo tapa la diagonal del alfil hacia f7 y ataca a nuestro alfil de c4.","Retiramos el alfil manteniendo la presión sobre f7. Ahora amenazamos Dxe5+.","El rival defiende e5 con el caballo. Entramos en la Frankenstein-Drácula, una de las líneas más locas.","Amenazamos Cxd6+ seguido de Dxf7 mate. El rival tiene que ser muy preciso.","El rival echa a nuestra dama de h5. La dama debe irse, pero seguirá mirando f7.","La dama vuelve a amenazar Dxf7 mate. El rival debe tapar la columna f.","El rival cierra el paso con ...f5. A cambio, su rey queda expuesto en la diagonal a2-g8.","¡Doble amenaza! La dama apunta a f7 (mate con el alfil de b3) y a la vez preparamos Cxc7+.","La dama defiende f7. Ahora entra nuestro caballo con jaque.","Capturamos con jaque y atacamos también la torre de a8.","El rey se aparta. El rival apuesta a atrapar luego a nuestro caballo en a8.","Ganamos la torre. El caballo de a8 está atrapado, pero tenemos calidad y peón de ventaja.","El rival encierra el caballo con ...b6: planea ...Ab7 para capturarlo más tarde.","Abrimos la diagonal del alfil de c1 y protegemos e4. No hay prisa por salvar al caballo.","El alfil prepara ...Axa8 y apunta a la gran diagonal. El rival busca contraataque con ...f4 y ...Cd4.","La jugada teórica: con h4 activamos la torre por h3 y atacamos el flanco de rey. Juego muy agudo."]},{"id":"trampa-cxe4-ae7","name":"Trampa 3...Cxe4 con 5...Ae7","moves":"e4 e5 Nc3 Nf6 Bc4 Nxe4 Qh5 Nd6 Bb3 Be7 Nf3 Nc6 Nxe5 O-O Nd5 Nxe5 Qxe5 Re8 O-O Bf8 Qf4","idea":"Si el rival juega el truco ...Cxe4, 4.Dh5 le obliga a defenderse. Tras 5...Ae7 recuperamos el peón y salimos con piezas muy activas.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5 y disputa el centro de forma simétrica.","La Vienesa: desarrollamos el caballo y protegemos e4. Según lo que haga el rival prepararemos f4 o Ac4.","El rival desarrolla el caballo y ataca e4. Es la respuesta más popular.","Desarrollamos el alfil apuntando a f7. Invitamos al truco ...Cxe4, que lleva a posiciones muy agudas.","El rival usa un truco de horquilla: si 4.Cxe4?, ...d5 ataca alfil y caballo y recupera la pieza.","¡La respuesta correcta! Amenazamos Dxf7 mate. Ojo: si 4...Cf6??, 5.Dxf7# es mate.","La única buena: el caballo tapa la diagonal del alfil hacia f7 y ataca a nuestro alfil de c4.","Retiramos el alfil manteniendo la presión sobre f7. Ahora amenazamos Dxe5+.","El rival desarrolla el alfil y prepara el enroque. Es más sólido que la Frankenstein-Drácula.","Atacamos e5 con el caballo. Queremos recuperar el peón con buen juego.","El rival defiende e5 con el caballo. Aun así podemos tomar.","Tomamos en e5 y recuperamos el peón. Presionamos f7 con la dama, el caballo y el alfil de b3.","El rival enroca y defiende f7 con la torre. Su rey ya está a salvo, pero nuestras piezas siguen muy activas.","El caballo salta a d5 y amenaza Cxe7+. Nuestras piezas atacan con mucha actividad.","El rival cambia nuestro caballo de e5, que era nuestra pieza atacante más peligrosa.","Recapturamos con la dama, que queda muy activa en el centro y presiona e7 y g7.","La torre refuerza e7 y prepara ...Af8, que dejará a nuestra dama atacada por la torre.","Enrocamos y ponemos el rey a salvo antes de que se abra la columna e.","El alfil se retira y ahora la torre de e8 ataca a nuestra dama.","La dama se retira a f4, desde donde mira f7 y el flanco de rey. Posición activa y cómoda."]},{"id":"cc6-ac4","name":"Línea con 2...Cc6 3.Ac4 Cf6 4.d3","moves":"e4 e5 Nc3 Nc6 Bc4 Nf6 d3 Bb4 Bg5 h6 Bxf6 Bxc3+ bxc3 Qxf6 Ne2 d6 O-O","idea":"Desarrollo sólido con Ac4 y d3; tras los cambios, el caballo va por e2 para preparar f4 y abrir la columna f.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5 y disputa el centro de forma simétrica.","La Vienesa: desarrollamos el caballo y protegemos e4. Según lo que haga el rival prepararemos f4 o Ac4.","El rival desarrolla el caballo y defiende e5; luego elegirá entre ...Cf6 y ...Ac5.","El alfil apunta a f7, el punto débil de la posición negra.","El rival desarrolla y ataca e4, que de momento defiende nuestro caballo de c3.","Protegemos e4 con el peón y abrimos la diagonal del alfil de c1. Sólido y flexible.","El rival clava nuestro caballo de c3 y aumenta la presión sobre e4.","Respondemos con la misma moneda: clavamos el caballo de f6, que es el que ataca e4.","El rival pregunta a nuestro alfil para decidir ya si lo cambiamos o lo retiramos.","Cambiamos en f6 para no perder tiempo y alterar la coordinación negra.","El rival cambia antes de recapturar y nos dobla los peones de c.","Recapturamos hacia el centro. Los peones doblados controlan d4 y la columna b queda abierta.","La dama recupera la pieza y queda activa en f6, mirando f2.","Desarrollamos el caballo por e2 para dejar libre el peón de f y jugar f4 más adelante.","El rival refuerza e5 y abre paso a su alfil de c8.","Enrocamos. Plan: f4 para abrir la columna f, con el alfil de c4 apuntando a f7."]},{"id":"ac5","name":"Línea con 2...Ac5 (3.Cf3 d6)","moves":"e4 e5 Nc3 Bc5 Nf3 d6 d4 exd4 Nxd4 Nf6 Bg5 h6 Bh4 O-O Nb3 Bb4 Bd3 Re8 O-O","idea":"Abrimos el centro con d4, echamos al alfil con Cb3 y completamos el desarrollo con Ad3 y enroque. Posición equilibrada y rica.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5 y disputa el centro de forma simétrica.","La Vienesa: desarrollamos el caballo y protegemos e4. Según lo que haga el rival prepararemos f4 o Ac4.","El rival saca el alfil a c5, mirando f2. Si 3.Dg4?, ...Cf6! y la trampa se vuelve contra nosotros.","Desarrollamos atacando e5. Amenazamos Cxe5 con el truco de la horquilla d4.","La mejor: el rival defiende e5 con el peón. Si 3...Cc6?!, 4.Cxe5! nos da ventaja.","Abrimos el centro atacando e5 y ganando espacio. Nuestro desarrollo es más rápido.","El rival cambia en d4 y abre la columna e y la diagonal de su alfil de c5.","Recapturamos con el caballo, bien centralizado. Tenemos más espacio en el centro.","El rival desarrolla el caballo y ataca nuestro peón de e4, defendido por el caballo de c3.","Clavamos el caballo de f6 para reducir la presión sobre e4.","El rival pregunta al alfil para romper la clavada sobre su caballo de f6.","Mantenemos la clavada retirando el alfil a h4. El caballo de f6 sigue sin poder moverse con libertad.","El rival enroca y mantiene la tensión, con su rey ya a salvo.","Atacamos el alfil de c5 con el caballo y lo obligamos a decidir.","El alfil se coloca en b4, clavando nuestro caballo de c3 y presionando e4.","Protegemos e4 y desarrollamos el último alfil. Ya podemos enrocar.","La torre presiona e4 por la columna e, junto al alfil que clava nuestro caballo de c3.","Enrocamos. Si ...Axc3 bxc3, el rival puede ir a por e4 con ...g5 y ...Cxe4: posición equilibrada y aguda."]},{"id":"trampa-ac5-cc6","name":"Trampa 2...Ac5 3.Cf3 Cc6?! 4.Cxe5!","moves":"e4 e5 Nc3 Bc5 Nf3 Nc6 Nxe5 Nxe5 d4 Bd6 dxe5 Bxe5 Bd3","idea":"El truco de la horquilla: Cxe5 y d4 recuperan la pieza y nos dan la pareja de alfiles y el centro.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5 y disputa el centro de forma simétrica.","La Vienesa: desarrollamos el caballo y protegemos e4. Según lo que haga el rival prepararemos f4 o Ac4.","El rival saca el alfil a c5, mirando f2. Si 3.Dg4?, ...Cf6! y la trampa se vuelve contra nosotros.","Desarrollamos atacando e5. Amenazamos Cxe5 con el truco de la horquilla d4.","Error típico: el rival desarrolla el caballo, pero deja e5 expuesto al truco de la horquilla.","¡Tomamos en e5! Si ...Cxe5, d4 ataca a la vez al alfil y al caballo y recuperamos la pieza.","El rival recupera la pieza. Tampoco sirve 4...Axf2+ 5.Rxf2 Cxe5 6.d4, que también es bueno para nosotros.","¡La horquilla de peón! Atacamos alfil y caballo a la vez.","El alfil se retira defendiendo el caballo, pero ahora tomamos en e5.","Ganamos el caballo. El rival recuperará el peón con el alfil.","El rival recupera material, pero nos ha cedido la pareja de alfiles y el centro.","Desarrollamos y preparamos f4 para echar al alfil con tiempo. Clara ventaja blanca."]}]},{"id":"danes","name":"Gambito Danés y del Centro","side":"w","eco":"C21–C22","group":"1.e4 e5","blurb":"Tras 2.d4 exd4 sacrificamos uno o dos peones (3.c3) por un desarrollo rapidísimo, o recuperamos con la dama en el Gambito del Centro.","lines":[{"id":"doble-aceptacion","name":"Doble aceptación (4...cxb2 5.Axb2 d6)","moves":"e4 e5 d4 exd4 c3 dxc3 Bc4 cxb2 Bxb2 d6 Qb3 Qd7 Nc3 Nc6 Nf3","idea":"Con dos peones menos tenemos dos alfiles apuntando a f7 y g7 y un desarrollo muy superior. Plan: enrocar, Cd5 y e5 contra el rey en el centro.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5, ocupa su parte del centro y frena nuestro avance d4 sin preparación.","Atacamos el peón de e5 de inmediato. Si el rival toma, podemos recuperar o sacrificar.","El rival captura en d4. Ahora elegimos: recuperar con la dama (Gambito del Centro) o jugar c3.","¡El Gambito Danés! Ofrecemos un peón para abrir líneas y desarrollarnos a toda velocidad.","El rival acepta. Ahora tenemos que jugar rápido: cada tiempo cuenta.","No recuperamos: ofrecemos un segundo peón. El alfil apunta a f7 y el desarrollo es lo único que importa.","La doble aceptación: el rival toma otro peón. Ahora nuestros dos alfiles apuntan al flanco de rey.","Recapturamos con el alfil, que barre la gran diagonal hasta g7. Dos peones menos, pero piezas muy activas.","El rival corta la diagonal de nuestro alfil de b2 hacia g7 y se prepara a desarrollarse.","La dama ataca f7 (junto al alfil de c4) y b7 a la vez. El rival tiene que defender con cuidado.","La dama defiende f7 por la séptima fila; el peón de b7 lo protege
