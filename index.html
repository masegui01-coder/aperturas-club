 columna c y un claro dominio de espacio."]},{"id":"pianissimo-d3","name":"Pianissimo, 4.d3 y c3","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 d3 Nf6 O-O d6 c3 a6 a4 Ba7 Nbd2 O-O h3","idea":"a4 gana espacio y da casilla al alfil; Nbd2-f1-g3 en el futuro."},{"id":"o-o-d3","name":"Enroque temprano, 4.O-O","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 O-O Nf6 d3 d6 c3 O-O Re1 a6 a4 Ba7 h3","idea":"El mismo esquema lento con el rey a salvo cuanto antes."},{"id":"piano-b4","name":"Giuoco Piano, 5.b4","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 b4 Bb6 d3 d6 a4 a6 O-O O-O","idea":"Ganar espacio en el flanco de dama y amenazar a5 contra el alfil."},{"id":"piano-e5","name":"Giuoco Piano, 6.e5","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 e5 d5 Bb5 Ne4 cxd4 Bb6","idea":"e5 expulsa al caballo; las negras contestan en el centro con ...d5."},{"id":"piano-qe7","name":"Giuoco Piano, 4...Qe7","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Qe7 d4 Bb6 O-O Nf6 Re1 d6 h3","idea":"Las negras mantienen e5 con la dama; las blancas consolidan el centro."},{"id":"fritz","name":"Dos Caballos, Variante Fritz (5...Nd4)","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nd4 c3 b5 Bf1 Nxd5 cxd4 Qxg5 Bxb5+ Kd8","idea":"Las negras sacrifican material por la iniciativa; c3 y Bf1 son la respuesta precisa."},{"id":"blackburne","name":"Contra 3...Nd4 (trampa Blackburne)","moves":"e4 e5 Nf3 Nc6 Bc4 Nd4 Nxd4 exd4 c3","idea":"No tomes en e5 (Nxe5? Qg5!). Cambia el caballo y gana el centro con c3."}]},{"id":"evans","name":"Gambito Evans","side":"w","eco":"C51–C52","group":"1.e4 e5","blurb":"Gambito agresivo de la Italiana: sacrificamos el peón b4 para ganar tiempos con c3 y d4, abrir la columna e y atacar f7 con el rey negro aún en el centro.","lines":[{"id":"clasica-ba5","name":"Línea principal (7...Ab6 8.cxd4 Cf6 9.e5)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O Bb6 cxd4 Nf6 e5 Ne4 Qe2 d5 exd6 Bf5 Nc3 Qxd6 Nxe4","idea":"Con 9.e5 echamos al caballo y tras 10.De2 d5 11.exd6 al paso la columna e se abre: el Ce4 queda clavado y las negras pierden material.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde simétrico y disputa las casillas centrales d4 y f4.","Desarrollamos el caballo atacando el peón de e5: la jugada más natural.","Las negras defienden e5 con el caballo mientras desarrollan.","El alfil apunta a f7, la casilla más débil del campo negro, defendida sólo por el rey.","El rival copia la idea: su alfil también mira a f7 y controla d4. Es el Giuoco Piano.","¡Gambito Evans! Entregamos el peón b para desviar el Ac5 y ganar tiempos con c3 y d4.","Aceptan el gambito capturando con el alfil: tienen peón de más, pero su alfil ya ha movido dos veces.","Atacamos el alfil con tiempo y preparamos d4 para levantar el centro e4-d4.","El alfil se retira a a5, la casilla principal: desde ahí clava el peón c3 contra nuestro rey.","Golpe central: atacamos e5 y abrimos líneas mientras el rival sigue sin desarrollar.","Las negras capturan en d4; ahora tienen dos peones de más en el centro.","Enrocamos: 7.cxd4 era ilegal porque el Aa5 clava el peón c3 contra el rey. Ahora la torre entra en juego.","El alfil se retira a b6 antes de que lo hostiguemos: presiona d4 y f2 y queda a salvo de Db3 o Da4.","Recuperamos con el peón: centro ideal e4-d4 y el Ab6 choca contra d4. El rival sigue con un peón de más.","El rival ataca e4 de inmediato. Es natural, pero permite que nuestro centro avance con tiempo.","¡Avanzamos atacando el caballo! Ganamos espacio y preparamos abrir la columna e.","El caballo salta al centro, pero en e4 está expuesto y sin casillas de retirada cómodas.","Atacamos el caballo y la dama se coloca en la columna e, frente al rey negro todavía en e8.","Las negras deben jugar d5 para proteger el caballo; parece sólido, pero permite capturar al paso.","¡exd6 al paso! La columna e queda abierta y el Ce4 queda clavado contra el rey por nuestra dama.","El rival sostiene el caballo con el alfil. Si 11...O-O?, 12.Dxe4 y ganamos una pieza limpia.","Sumamos otro atacante sobre e4. El caballo clavado no puede moverse y no tiene más defensores.","Recuperan el peón de d6, pero no resuelven la clavada: la pieza de e4 sigue cayendo.","Ganamos la pieza: si 13...Axe4, 14.Dxe4+ gracias a la columna e. Pieza de más y rey negro en el centro."]},{"id":"salto-ng4","name":"Salto 9...Cg4","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O Bb6 cxd4 Nf6 e5 Ng4 Nc3 d6 h3 O-O Bg5 Qe8 hxg4","idea":"Tras 9.e5 Cg4 el caballo se queda sin retirada: con Cc3, h3 y Ag5 lo cazamos y ganamos pieza por peones.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras toman en d4 para no ceder el centro y quedan con dos peones de más.","Enrocamos antes de recuperar: con el rey en g1 se acaba la clavada del peón c3 y la torre va a la columna e.","El alfil se retira a b6 antes de que lo hostiguemos: presiona d4 y f2 y queda a salvo de Db3 o Da4.","Recuperamos con el peón: centro ideal e4-d4 y el Ab6 choca contra d4. El rival sigue con un peón de más.","Las negras desarrollan atacando e4; nuestra respuesta será otra vez el avance e5.","Atacamos el caballo de f6 con el peón y ganamos espacio en el centro.","Salto 9...Cg4: el caballo ataca e5 desde el flanco, pero en g4 puede quedar atrapado.","Desarrollamos con calma: el caballo controla d5 y e4 y quita casillas a las piezas negras.","El rival golpea e5 para abrir el centro y buscar una salida a su caballo.","Preguntamos al caballo de g4: sus retiradas son malas y e5 sigue sostenido por d4.","Las negras enrocan ignorando la amenaza. Tampoco salva 11...Ch6: tras 12.Ag5 Dd7 13.Te1 la presión en la columna e decide.","Desarrollamos con tiempo atacando la dama: primero la echamos y luego capturamos el caballo.","La dama se aparta del ataque y presiona e5 desde la columna e.","Capturamos el caballo: pieza de más por un par de peones y la columna h entreabierta para atacar."]},{"id":"error-ng8","name":"Error 9...Cg8","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O Bb6 cxd4 Nf6 e5 Ng8 d5 Na5 Bd3 Ne7 d6 cxd6 exd6","idea":"La retirada 9...Cg8 nos regala tiempos: d5 y d6 asfixian a las negras y el rey se queda sin enroque.","notes":["Empezamos con 1.e4: centro, desarrollo rápido y partidas abiertas.","El rival contesta 1...e5, la defensa más clásica, y lucha por d4 y f4.","Atacamos e5 con el caballo y lo desarrollamos hacia el centro.","Defensa natural del peón de e5 con desarrollo; el caballo también vigila d4.","Apuntamos a f7 con el alfil: será un blanco constante en todo el gambito.","El alfil negro sale a c5 y frena nuestro avance d4. Es el momento del gambito.","4.b4: damos un peón de flanco para ganar el centro con tiempo. Idea de William Evans (1827).","Aceptan el gambito capturando con el alfil: tienen peón de más, pero su alfil ya ha movido dos veces.","Atacamos el alfil con tiempo y preparamos d4 para levantar el centro e4-d4.","El alfil se retira a a5, la casilla principal: desde ahí clava el peón c3 contra nuestro rey.","Golpe central: atacamos e5 y abrimos líneas mientras el rival sigue sin desarrollar.","Las negras capturan en d4; ahora tienen dos peones de más en el centro.","Enrocamos: 7.cxd4 era ilegal porque el Aa5 clava el peón c3 contra el rey. Ahora la torre entra en juego.","El alfil se retira a b6 antes de que lo hostiguemos: presiona d4 y f2 y queda a salvo de Db3 o Da4.","Recuperamos con el peón: centro ideal e4-d4 y el Ab6 choca contra d4. El rival sigue con un peón de más.","Las negras desarrollan atacando e4, pero el caballo se expone a nuestro avance e5.","Echamos al caballo con el peón y ganamos espacio con tiempo.","Error 9...Cg8: el caballo vuelve a casa y las negras pierden todavía más tiempo de desarrollo.","Seguimos ganando tiempos: atacamos el Cc6 y ampliamos nuestro espacio.","El caballo va al borde para atacar nuestro Ac4, el gran atacante de f7.","Retiramos el alfil a d3: desde ahí apunta a h7 y sigue controlando e4.","Por fin sale el caballo de rey, pero el rival sigue sin enrocar y muy atrasado.","¡Clavamos una cuña en d6! Atacamos el Ce7 y el peón c7, estrangulando la posición negra.","El rival captura en d6; cualquier otra jugada permitía dxe7 o dxc7 ganando material.","Recapturamos con el peón: el Ce7 vuelve a estar atacado y la columna e se abre hacia el rey negro."]},{"id":"defensa-qe7","name":"Defensa 8...De7","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O Bb6 cxd4 Qe7 e5 d5 exd6 Qxd6 Re1+ Be6 Ba3 Qd7 d5","idea":"La dama negra en e7 se convierte en blanco: e5, exd6 al paso, Te1+ y Aa3 la persiguen con el rey en el centro.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde simétrico y disputa las casillas centrales d4 y f4.","Desarrollamos el caballo atacando el peón de e5: la jugada más natural.","Las negras defienden e5 con el caballo mientras desarrollan.","El alfil apunta a f7, la casilla más débil del campo negro, defendida sólo por el rey.","El rival copia la idea: su alfil también mira a f7 y controla d4. Es el Giuoco Piano.","¡Gambito Evans! Entregamos el peón b para desviar el Ac5 y ganar tiempos con c3 y d4.","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras toman en d4 para no ceder el centro y quedan con dos peones de más.","Enrocamos antes de recuperar: con el rey en g1 se acaba la clavada del peón c3 y la torre va a la columna e.","El alfil se retira a b6 antes de que lo hostiguemos: presiona d4 y f2 y queda a salvo de Db3 o Da4.","Recuperamos con el peón: centro ideal e4-d4 y el Ab6 choca contra d4. El rival sigue con un peón de más.","Defensa 8...De7: la dama presiona e4 y prepara ...d6, pero se coloca en la columna e.","Avanzamos: quitamos f6 al caballo y el peón de e5 frena el desarrollo negro.","Las negras atacan el centro. Ojo: si 9...Cxd4?, 10.Cxd4 Axd4 11.Dxd4 y nos quedamos con pieza de más.","Capturamos al paso: abrimos la columna e justo donde está la dama negra.","El rival recupera con la dama, pero su rey sigue en el centro.","¡Jaque en la columna abierta! Ganamos tiempo y el rey negro sigue sin enrocar.","Las negras tapan con el alfil, que queda clavado contra el rey.","Idea típica del Evans: el alfil desde a3 ataca la dama y controla f8, impidiendo el enroque corto.","La dama se aparta y prepara el enroque largo, la única salida del rey.","Golpe final: atacamos a la vez el Ae6 clavado y el Cc6. Las negras pierden material."]},{"id":"normal-morphy","name":"Posición Normal: Ataque Morphy (9.Cc3)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O d6 cxd4 Bb6 Nc3 Na5 Bd3 Ne7 h3 O-O Rb1","idea":"Desarrollamos todo con Cc3, Ad3, h3 y Tb1: espacio y piezas activas a cambio del peón, sin prisa por recuperarlo.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","Aceptan el gambito capturando con el alfil: tienen peón de más, pero su alfil ya ha movido dos veces.","Atacamos el alfil con tiempo y preparamos d4 para levantar el centro e4-d4.","El alfil se retira a a5, la casilla principal: desde ahí clava el peón c3 contra nuestro rey.","Golpe central: atacamos e5 y abrimos líneas mientras el rival sigue sin desarrollar.","Las negras capturan en d4; ahora tienen dos peones de más en el centro.","Enrocamos: 7.cxd4 era ilegal porque el Aa5 clava el peón c3 contra el rey. Ahora la torre entra en juego.","Las negras protegen su peón extra de d4 y abren la diagonal del Ac8.","Recuperamos el centro: e4-d4 frente a un peón de más negro. Con el rey en g1 ya no hay clavada en c3.","Posición Normal del Evans: el alfil presiona d4 desde b6 y las negras conservan su peón extra.","Ataque Morphy: el caballo protege e4 y prepara Cd5 o e5 en el momento justo.","El rival busca cambiar nuestro Ac4, el mejor atacante. Contra 9...Ag4 la idea es 10.Da4 (Ataque Fraser).","Conservamos el alfil en d3, apuntando al flanco de rey. 10.Ag5 (Ataque Göring) es otra opción.","Desarrollo flexible: el caballo podrá ir a g6 o c6 y deja libre el peón f.","Quitamos g4 al alfil y al caballo negros: jugada útil antes de lanzar el ataque.","Las negras enrocan; su rey está a salvo, pero les falta espacio.","Torre a la columna b semiabierta: presiona b7 y puede ir a b5. Iniciativa clara por el peón."]},{"id":"ulvestad","name":"Posición Normal: Variante Ulvestad (9.d5)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O d6 cxd4 Bb6 d5 Na5 Bb2 Ne7 Bd3 O-O Nc3 Ng6 Ne2","idea":"Ganamos espacio con d5 y desarrollamos el alfil a b2 contra g7; la trampa ...Cxc4? Axg7 está siempre presente.","notes":["Empezamos con 1.e4: centro, desarrollo rápido y partidas abiertas.","El rival contesta 1...e5, la defensa más clásica, y lucha por d4 y f4.","Atacamos e5 con el caballo y lo desarrollamos hacia el centro.","Defensa natural del peón de e5 con desarrollo; el caballo también vigila d4.","Apuntamos a f7 con el alfil: será un blanco constante en todo el gambito.","El alfil negro sale a c5 y frena nuestro avance d4. Es el momento del gambito.","4.b4: damos un peón de flanco para ganar el centro con tiempo. Idea de William Evans (1827).","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras toman en d4 para no ceder el centro y quedan con dos peones de más.","Enrocamos antes de recuperar: con el rey en g1 se acaba la clavada del peón c3 y la torre va a la columna e.","Las negras protegen su peón extra de d4 y abren la diagonal del Ac8.","Recuperamos el centro: e4-d4 frente a un peón de más negro. Con el rey en g1 ya no hay clavada en c3.","Posición Normal del Evans: el alfil presiona d4 desde b6 y las negras conservan su peón extra.","Variante Ulvestad: avanzamos atacando el Cc6 y ganamos espacio. A cambio, el Ab6 mira libre hacia f2.","El caballo va al borde para atacar nuestro Ac4, el gran atacante de f7.","¡No retiramos el Ac4! Alfil a la gran diagonal contra g7: si 10...Cxc4?, 11.Axg7 gana la torre de h8.","Las negras desarrollan sin caer en la trampa; el caballo vigila d5 y puede ir a g6.","Ahora sí retiramos el alfil a d3, apuntando al futuro enroque negro.","El rival enroca corto, justo hacia donde apuntan nuestros dos alfiles.","Desarrollamos el último caballo, controlando e4 y preparando su traslado al flanco de rey.","El caballo se acerca a la defensa del rey y vigila f4 y e5.","El caballo va hacia g3 o d4: reagrupamos para atacar en el flanco de rey con f4 o Dd2."]},{"id":"lasker","name":"Defensa Lasker (6...d6)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 d6 O-O Bb6 dxe5 dxe5 Qxd8+ Nxd8 Nxe5 Be6 Nd2 Bxc4 Ndxc4 Ne6 a4","idea":"Las negras devuelven el peón y cambian damas; recuperamos material con Cxe5 y buscamos un final cómodo con más espacio.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde simétrico y disputa las casillas centrales d4 y f4.","Desarrollamos el caballo atacando el peón de e5: la jugada más natural.","Las negras defienden e5 con el caballo mientras desarrollan.","El alfil apunta a f7, la casilla más débil del campo negro, defendida sólo por el rey.","El rival copia la idea: su alfil también mira a f7 y controla d4. Es el Giuoco Piano.","¡Gambito Evans! Entregamos el peón b para desviar el Ac5 y ganar tiempos con c3 y d4.","Aceptan el gambito capturando con el alfil: tienen peón de más, pero su alfil ya ha movido dos veces.","Atacamos el alfil con tiempo y preparamos d4 para levantar el centro e4-d4.","El alfil se retira a a5, la casilla principal: desde ahí clava el peón c3 contra nuestro rey.","Golpe central: atacamos e5 y abrimos líneas mientras el rival sigue sin desarrollar.","Defensa Lasker 6...d6: en vez de capturar, las negras sostienen e5 y buscan simplificar.","Enrocamos y mantenemos la tensión; el rival debe decidir qué hacer con su Aa5.","El alfil va a b6, donde presiona d4 y f2 y se aleja de golpes como Da4+.","Abrimos el centro. Alternativa agresiva: 8.Db3, atacando f7 sin cambiar damas.","Las negras recapturan y la columna d queda abierta entre las damas.","Cambiamos damas con jaque. 9.Db3 Df6 10.Ag5 mantiene más tensión, pero esta línea es la principal.","El caballo recaptura y queda en d8, defendiendo f7 aunque algo descolocado.","Recuperamos el peón del gambito: material igualado y el caballo de e5 presiona f7.","El rival ofrece cambiar nuestro fuerte Ac4 y tapa la diagonal hacia f7.","Desarrollamos para recapturar en c4 con el caballo, sin estropear nuestra estructura.","Las negras cambian alfiles para quitarnos la pieza que presionaba f7.","Recapturamos: el caballo de c4 ataca el Ab6 y controla d6. Final cómodo y activo.","El caballo de d8 se recoloca en e6, rumbo a d4 o c5.","Avanzamos a4-a5 para expulsar al Ab6: más espacio en el flanco de dama y presión duradera."]},{"id":"anderssen-nf6","name":"Defensa Anderssen (7...Cf6)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O Nf6 Ba3 d6 e5 Ne4 exd6 cxd6 Qe2 d5 Nxd4 Nxd4 cxd4","idea":"Con 8.Aa3 impedimos el enroque corto; tras e5 y la apertura de la columna e recuperamos el peón con el rey negro en el centro.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras toman en d4 para no ceder el centro y quedan con dos peones de más.","Enrocamos antes de recuperar: con el rey en g1 se acaba la clavada del peón c3 y la torre va a la columna e.","Defensa Anderssen 7...Cf6: desarrollan atacando e4, aunque el caballo será blanco de e5.","El alfil en a3 controla f8 e impide el enroque corto. 8.e5 d5 9.Ab5 es la otra gran opción.","El rival tapa la diagonal a3-f8 con el peón para poder enrocar.","Golpe central: atacamos el Cf6 y el peón d6 a la vez.","El caballo salta al centro y amenaza ...Cxc3, apoyado por el Aa5 que también ataca c3.","Capturamos en d6 para abrir la columna e frente al rey negro.","Las negras recapturan; el peón de d6 vuelve a tapar la diagonal de nuestro Aa3.","Atacamos el Ce4 y nos instalamos en la columna e, con el rey negro todavía en e8.","El rival defiende el caballo y ataca nuestro Ac4, que está protegido por la dama.","Recuperamos el peón: si ...dxc4, Dxe4+ recupera la pieza con jaque gracias a la columna e.","Las negras cambian caballos para aliviar la presión.","Material igualado, centro firme y el Aa3 sigue vigilando f8: el enroque negro no es sencillo."]},{"id":"mieses","name":"Defensa Mieses (7...Cge7)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O Nge7 cxd4 d5 exd5 Nxd5 Ba3 Be6 Nbd2 Bb4 Bxb4 Ncxb4 Ne4","idea":"Las negras devuelven el peón con ...d5 para liberarse; respondemos con Aa3 y Cbd2-e4, presionando c5 y el enroque.","notes":["Empezamos con 1.e4: centro, desarrollo rápido y partidas abiertas.","El rival contesta 1...e5, la defensa más clásica, y lucha por d4 y f4.","Atacamos e5 con el caballo y lo desarrollamos hacia el centro.","Defensa natural del peón de e5 con desarrollo; el caballo también vigila d4.","Apuntamos a f7 con el alfil: será un blanco constante en todo el gambito.","El alfil negro sale a c5 y frena nuestro avance d4. Es el momento del gambito.","4.b4: damos un peón de flanco para ganar el centro con tiempo. Idea de William Evans (1827).","Aceptan el gambito capturando con el alfil: tienen peón de más, pero su alfil ya ha movido dos veces.","Atacamos el alfil con tiempo y preparamos d4 para levantar el centro e4-d4.","El alfil se retira a a5, la casilla principal: desde ahí clava el peón c3 contra nuestro rey.","Golpe central: atacamos e5 y abrimos líneas mientras el rival sigue sin desarrollar.","Las negras capturan en d4; ahora tienen dos peones de más en el centro.","Enrocamos: 7.cxd4 era ilegal porque el Aa5 clava el peón c3 contra el rey. Ahora la torre entra en juego.","Defensa Mieses 7...Cge7: el caballo apoyará ...d5 para devolver el peón y liberar el juego.","Recuperamos el centro. Si eliges 8.Cg5, cuidado: tras 8...O-O? 9.Dh5 h6 10.Cxf7 Txf7 11.Axf7+ ganamos.","El rival rompe en el centro y devuelve el peón: es la idea de esta defensa.","Capturamos y abrimos el juego: nuestras piezas están mejor desarrolladas.","El caballo recaptura y ocupa el centro, aunque ahí será blanco de nuestras piezas.","Alfil a a3: corta la diagonal a3-f8 y retrasa el enroque corto negro.","Las negras protegen el Cd5 y siguen desarrollando.","Desarrollamos el caballo hacia e4, desde donde apuntará a c5, d6 y g5.","El rival ofrece cambiar alfiles para poder enrocar.","Cambiamos: así no dejamos que su alfil se active en c3.","Recapturan con el caballo de c6, que amenaza saltar a d3 o c2.","El caballo llega a e4 con ideas de Cc5 contra b7 y e6. Juego activo con material igualado."]},{"id":"comprometida","name":"Defensa Comprometida (7...dxc3)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O dxc3 Qb3 Qf6 e5 Qg6 Nxc3 Nge7 Ba3 O-O Rad1","idea":"Por dos peones conseguimos un desarrollo aplastante: Db3 contra f7, e5 con tiempo, Cxc3 y Aa3 ante un rival atrasado.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde simétrico y disputa las casillas centrales d4 y f4.","Desarrollamos el caballo atacando el peón de e5: la jugada más natural.","Las negras defienden e5 con el caballo mientras desarrollan.","El alfil apunta a f7, la casilla más débil del campo negro, defendida sólo por el rey.","El rival copia la idea: su alfil también mira a f7 y controla d4. Es el Giuoco Piano.","¡Gambito Evans! Entregamos el peón b para desviar el Ac5 y ganar tiempos con c3 y d4.","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras toman en d4 para no ceder el centro y quedan con dos peones de más.","Enrocamos antes de recuperar: con el rey en g1 se acaba la clavada del peón c3 y la torre va a la columna e.","Defensa Comprometida 7...dxc3: el rival se come otro peón y nos da una ventaja de desarrollo enorme.","¡Atacamos f7 de inmediato! La dama y el Ac4 forman una batería contra el punto débil.","La dama defiende f7. Es lo mejor; tras 8...De7 9.Cxc3 seguimos con mucho ataque.","Atacamos la dama con tiempo y le quitamos la casilla f6.","La dama se retira a g6, desde donde vigila g7 y la casilla e4.","Recuperamos un peón y desarrollamos: amenazamos Cd5 o Cb5 rumbo a c7.","Las negras desarrollan el caballo para poder enrocar.","¡Alfil a a3! Presiona e7 y la diagonal hacia f8, el gran recurso del Evans.","El rival enroca, pero su posición sigue pasiva y con el flanco de dama sin desarrollar.","Torre a la columna d: todas nuestras piezas en juego. Compensación de sobra por los peones."]},{"id":"anderssen-be7","name":"Variante Anderssen (5...Ae7) – Línea Kasparov","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Be7 d4 Na5 Be2 exd4 Qxd4 Nf6 e5 Nc6 Qh4 Nd5 Qg3 g6 O-O Nb6 c4","idea":"Contra el sólido 5...Ae7, 6.d4 Ca5 7.Ae2 y 8.Dxd4 (Kasparov–Anand, 1995): la dama ataca g7 y ganamos espacio en el flanco de rey.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","Aceptan el gambito capturando con el alfil: peón de más, pero tiempos perdidos.","Atacamos el alfil con tiempo y preparamos d4: así se cobra la compensación del peón.","Variante Anderssen 5...Ae7: retirada sólida; el alfil defiende el flanco de rey y no se expone en a5.","Seguimos con el plan: atacamos e5 y abrimos líneas.","El rival ataca nuestro Ac4 para cambiarlo o desviarlo de f7.","Conservamos el alfil. Si 7...d6, 8.Da4+ c6 9.dxe5 dxe5 10.Cxe5 y recuperamos el peón con buen juego.","Las negras capturan en el centro y abren la columna d para nuestra dama.","Idea de Kasparov: recapturamos con la dama, que ataca g7 mientras el Ca5 está fuera de juego.","El rival tapa la diagonal hacia g7 y desarrolla el caballo con ataque a e4.","Atacamos el caballo con tiempo y ganamos espacio en el flanco de rey.","El caballo de a5 vuelve al juego atacando nuestra dama.","La dama se aparta hacia el flanco de rey, donde presiona h7 y apoya el ataque.","El caballo ocupa d5, una casilla central firme, y vigila f4 y c3.","Atacamos g7 otra vez y obligamos a las negras a debilitar su enroque.","Las negras protegen g7, pero las casillas negras f6 y h6 quedan débiles.","Enrocamos; planeamos Ah6 para impedir el enroque corto del rival.","El caballo se retira a b6 para no ser expulsado por c4.","Ganamos espacio y quitamos d5. Kasparov siguió con Td1 y Ah6 y ganó con un ataque célebre."]},{"id":"short-qb3","name":"Línea Short (7.Db3)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 Qb3 Qe7 O-O Bb6 cxd4 Nxd4 Nxd4 Bxd4 Nc3 Nf6 Ba3","idea":"Atacamos f7 con Db3 antes de enrocar; tras O-O, cxd4 y Cc3, el Aa3 deja al rey negro atrapado en el centro.","notes":["Empezamos con 1.e4: centro, desarrollo rápido y partidas abiertas.","El rival contesta 1...e5, la defensa más clásica, y lucha por d4 y f4.","Atacamos e5 con el caballo y lo desarrollamos hacia el centro.","Defensa natural del peón de e5 con desarrollo; el caballo también vigila d4.","Apuntamos a f7 con el alfil: será un blanco constante en todo el gambito.","El alfil negro sale a c5 y frena nuestro avance d4. Es el momento del gambito.","4.b4: damos un peón de flanco para ganar el centro con tiempo. Idea de William Evans (1827).","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras toman en d4 para no ceder el centro y quedan con dos peones de más.","Línea de Short (7.Db3): atacamos f7 antes de enrocar; la batería dama-alfil obliga a defender.","La dama defiende f7. 7...Df6 también es posible y suele llevar a juego parecido tras 8.O-O.","Ahora enrocamos: con el rey fuera de e1 el peón c3 ya no está clavado.","El alfil se retira a b6, protegiendo d4 y alejándose de golpes tácticos.","Recuperamos el centro con e4 y d4; ahora el Ab6 queda frente a un muro de peones.","El rival se lleva el peón, pero así cambiamos piezas y abrimos líneas.","Recapturamos con el caballo y eliminamos el fuerte Cd4.","Las negras tienen dos peones de más, pero su desarrollo está muy atrasado.","Desarrollamos y amenazamos Cd5, atacando la dama y el peón c7.","El rival desarrolla el caballo de rey e intenta enrocar cuanto antes.","Atacamos la dama de e7 y cortamos el enroque: rey negro en el centro, compensación clara."]},{"id":"showalter","name":"Rehusado 4...Ab6: Variante Showalter (5.a4 a6 6.Cc3)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bb6 a4 a6 Nc3 Nf6 Nd5 Nxd5 exd5 Nd4 a5 Ba7 d6","idea":"Contra el gambito rehusado ganamos espacio con a4-a5 y saltamos a d5: el Ab6 queda arrinconado y d6 asfixia a las negras.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde simétrico y disputa las casillas centrales d4 y f4.","Desarrollamos el caballo atacando el peón de e5: la jugada más natural.","Las negras defienden e5 con el caballo mientras desarrollan.","El alfil apunta a f7, la casilla más débil del campo negro, defendida sólo por el rey.","El rival copia la idea: su alfil también mira a f7 y controla d4. Es el Giuoco Piano.","¡Gambito Evans! Entregamos el peón b para desviar el Ac5 y ganar tiempos con c3 y d4.","Gambito Evans Rehusado 4...Ab6: el rival no acepta el peón y mantiene su alfil en la diagonal hacia f2.","Amenazamos a5 para atrapar el alfil: ganamos espacio en el flanco de dama con tiempo.","El rival da una casilla de retirada al alfil en a7.","Variante Showalter: desarrollamos el caballo y preparamos Cd5 contra el Ab6.","Las negras desarrollan el caballo de rey y atacan nuestro peón de e4.","Ocupamos d5 atacando el Ab6 y el Cf6; amenazamos cambiar en b6 doblando sus peones.","El rival cambia el caballo intruso para no sufrir Cxb6 y peones doblados.","Recapturamos con el peón ganando espacio y atacando el Cc6 con tiempo.","El caballo se centraliza en d4 en lugar de retirarse.","Echamos al alfil de b6, que pierde el apoyo del Cd4.","El alfil se retira a a7: sigue en la diagonal, pero lejos del juego.","¡Cuña en d6! Atacamos c7 y bloqueamos el desarrollo negro: clara ventaja de espacio."]},{"id":"evans-bc5","name":"5...Ac5 (6.d4 exd4 7.cxd4)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Bc5 d4 exd4 cxd4 Bb4+ Nbd2 Nf6 d5 Ne7 Qb3 Bxd2+ Nxd2 d6 O-O O-O Bb2","idea":"El alfil vuelve a c5 y lo atacamos otra vez con d4: centro e4-d4, Db3 contra b4 y f7, y pareja de alfiles por el peón.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","Aceptan el peón capturando con el alfil, que pronto volverá a ser atacado.","Atacamos el alfil con tiempo y preparamos d4: así se cobra la compensación del peón.","5...Ac5: el alfil vuelve a c5, pero allí será atacado de nuevo por d4. El rival pierde más tiempos.","Atacamos el alfil y e5 a la vez: ganamos un tiempo directamente.","Las negras capturan en el centro y abren la columna d para nuestra dama.","Recuperamos con el peón: centro ideal e4-d4. 7.O-O también es buena, con juego similar a la Posición Normal.","El alfil da jaque para no ser expulsado y buscar cambiar piezas.","Tapamos con el caballo, desarrollando. 8.Rf1 es la alternativa sin cambiar piezas.","El rival desarrolla y ataca e4; nuestro peón d4 pronto avanzará con tiempo.","Avanzamos con tiempo sobre el Cc6 y ganamos espacio.","El caballo se retira a e7, desde donde puede ir a g6 o volver a d5.","Atacamos el Ab4 y f7 a la vez: la típica doble presión del Evans.","Las negras cambian en d2 para salvar el alfil atacado por nuestra dama.","Recapturamos con el caballo, que podrá ir a c4 o volver a f3.","El rival bloquea el centro y abre la salida del Ac8.","Enrocamos y completamos la seguridad de nuestro rey.","Las negras también enrocan y ponen su rey a salvo en el flanco de rey.","Alfil a la gran diagonal contra el enroque negro: espacio y pareja de alfiles a cambio del peón."]},{"id":"linea-h6","name":"Línea rara 6...h6","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 h6 d5 Nce7 Nxe5 Nf6 d6 cxd6 Nxf7 Qc7 Nxd6+ Kd8 O-O","idea":"Contra la lenta 6...h6 ganamos espacio con d5, recuperamos en e5 y con d6 abrimos el camino del Ac4 hacia f7.","notes":["Empezamos con 1.e4: centro, desarrollo rápido y partidas abiertas.","El rival contesta 1...e5, la defensa más clásica, y lucha por d4 y f4.","Atacamos e5 con el caballo y lo desarrollamos hacia el centro.","Defensa natural del peón de e5 con desarrollo; el caballo también vigila d4.","Apuntamos a f7 con el alfil: será un blanco constante en todo el gambito.","El alfil negro sale a c5 y frena nuestro avance d4. Es el momento del gambito.","4.b4: damos un peón de flanco para ganar el centro con tiempo. Idea de William Evans (1827).","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Línea rara 6...h6: jugada lenta que no lucha por el centro. Aprovechamos para ganar espacio con tiempo.","Avanzamos atacando el Cc6: el caballo no tiene buenas casillas.","El caballo se retira a e7 y deja el peón de e5 sin su defensor natural.","Ganamos el peón de e5: material igualado y el caballo apunta a f7. Contra 8...b5 seguimos 9.Dh5.","El rival desarrolla y ataca e4, pero f7 queda débil.","¡Golpe! El peón ataca e7 y c7 y despeja la diagonal del Ac4 hacia f7. Lo mejor para el rival era 9...O-O.","Las negras capturan, pero f7 se queda defendido sólo por el rey.","¡Cxf7! Atacamos la dama y la torre de h8 a la vez.","La dama escapa del caballo y ataca nuestro Ac4, que ahora parece colgado.","Jaque: el caballo gana el peón de d6 y además defiende el Ac4.","El rey se mueve a d8 y pierde para siempre el derecho a enrocar.","Enrocamos: peón de más, rey negro en el centro y amenazas como e5 o Ag5."]},{"id":"leonhardt","name":"Contragambito Leonhardt (6...b5)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 b5 Bxb5 Nxd4 Nxd4 exd4 O-O Ne7 cxd4 O-O Qa4 c6 Bd3","idea":"Las negras devuelven un peón para alejar nuestro alfil de f7; recuperamos en d4 y quedamos con mejor centro y desarrollo.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde simétrico y disputa las casillas centrales d4 y f4.","Desarrollamos el caballo atacando el peón de e5: la jugada más natural.","Las negras defienden e5 con el caballo mientras desarrollan.","El alfil apunta a f7, la casilla más débil del campo negro, defendida sólo por el rey.","El rival copia la idea: su alfil también mira a f7 y controla d4. Es el Giuoco Piano.","¡Gambito Evans! Entregamos el peón b para desviar el Ac5 y ganar tiempos con c3 y d4.","Aceptan el gambito capturando con el alfil: tienen peón de más, pero su alfil ya ha movido dos veces.","Atacamos el alfil con tiempo y preparamos d4 para levantar el centro e4-d4.","El alfil se retira a a5, la casilla principal: desde ahí clava el peón c3 contra nuestro rey.","Golpe central: atacamos e5 y abrimos líneas mientras el rival sigue sin desarrollar.","Contragambito Leonhardt 6...b5: devuelven un peón para desviar nuestro alfil de c4 y aliviar f7.","Aceptamos: el alfil deja de mirar a f7, pero ganamos el peón y seguimos desarrollando.","El rival elimina nuestro peón central de d4 con el caballo.","Cambiamos caballos: el Cd4 era demasiado fuerte para dejarlo ahí.","Las negras recapturan; su peón de d4 queda aislado y avanzado.","Enrocamos antes de recuperar: el peón de d4 no se va a escapar.","El caballo desarrolla y vigila d5 y c6, preparando el enroque.","Recuperamos el peón: material igualado y centro e4-d4 para nosotros.","El rival enroca y pone su rey a salvo antes de que abramos más líneas.","La dama ataca el Aa5 y defiende nuestro Ab5 a la vez.","Las negras atacan nuestro alfil de b5 con el peón y ganan un tiempo.","Retiramos el alfil a d3, apuntando al enroque; el Aa5 sigue atacado. Buen centro y juego cómodo."]},{"id":"waller","name":"Ataque Waller (7...d6 8.Db3)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O d6 Qb3 Qd7 cxd4 Bb6 Bb5 a6 Ba4 Kf8 Bb2","idea":"En lugar de recuperar en d4 atacamos f7 y b7 con la dama; luego Ab5 clava el Cc6 y el rey negro pierde el enroque.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras toman en d4 para no ceder el centro y quedan con dos peones de más.","Enrocamos antes de recuperar: con el rey en g1 se acaba la clavada del peón c3 y la torre va a la columna e.","Las negras protegen su peón de d4 y abren la diagonal del Ac8.","Ataque Waller: la dama ataca f7 y b7. Si 8...Ae6, 9.Axe6 fxe6 10.Cxd4 y recuperamos con juego activo.","La dama protege f7 por la segunda fila, pero estorba al desarrollo negro.","Ahora sí recuperamos el peón central, con centro e4-d4.","El alfil se retira a b6, a salvo, y presiona nuestro peón de d4.","Clavamos el Cc6 contra la dama de d7 y amenazamos d5.","El rival pregunta al alfil para romper la molesta clavada del Cc6.","Mantenemos la clavada: la amenaza d5 sigue en el aire.","Las negras deshacen la clavada moviendo el rey y renuncian al enroque.","Desarrollamos el último alfil a la gran diagonal. El rey negro en f8 será objetivo de ataque."]},{"id":"sanders-alapin","name":"Defensa Sanders-Alapin (6...d6 7.O-O Ad7)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 d6 O-O Bd7 dxe5 dxe5 Qb3 Qf6 Bg5 Qg6 Bd5 f6 Be3 Nge7 Qxb7","idea":"Abrimos el centro con dxe5 y atacamos f7 y b7 con Db3 y Ag5-d5: recuperamos el peón con piezas muy activas.","notes":["Empezamos con 1.e4: centro, desarrollo rápido y partidas abiertas.","El rival contesta 1...e5, la defensa más clásica, y lucha por d4 y f4.","Atacamos e5 con el caballo y lo desarrollamos hacia el centro.","Defensa natural del peón de e5 con desarrollo; el caballo también vigila d4.","Apuntamos a f7 con el alfil: será un blanco constante en todo el gambito.","El alfil negro sale a c5 y frena nuestro avance d4. Es el momento del gambito.","4.b4: damos un peón de flanco para ganar el centro con tiempo. Idea de William Evans (1827).","El rival acepta el peón: gana material pero pierde tiempo con su alfil.","Expulsamos el alfil con tiempo y preparamos el avance d4.","Retirada a a5: el alfil se mantiene activo y clava el peón c3 mientras nuestro rey esté en e1.","Atacamos e5 y ocupamos el centro: aquí está la compensación del peón.","Las negras sostienen e5 con d6, sin capturar en d4.","Enrocamos y mantenemos la tensión: el peón de d4 sigue atacando e5.","Defensa Sanders-Alapin 7...Ad7: desarrollo modesto que apoya el Cc6 y prepara ...Ab6.","Abrimos el centro: se abre la columna d y nuestras piezas ganan actividad.","Las negras recapturan con el peón y la columna d queda abierta.","Batería contra f7 y ataque a b7: la dama entra con fuerza.","La dama negra defiende f7, pero se expone a nuestro Ag5 con tiempo.","Atacamos la dama con tiempo mientras desarrollamos.","La dama se retira a g6, desde donde sigue protegiendo f7.","El alfil se centraliza y presiona c6 y f7; amenazamos Axc6.","El rival expulsa nuestro Ag5, pero debilita su enroque.","Retiramos el alfil a e3, apuntando a a7 y c5 desde una casilla segura.","Las negras desarrollan el caballo atacando nuestro Ad5.","Recuperamos el peón del gambito en b7 y atacamos la torre de a8. Material igualado y dama activa."]},{"id":"rehusado-a5","name":"Rehusado 4...Ab6 5.a4 a5 6.b5","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bb6 a4 a5 b5 Nd4 Nxd4 Bxd4 c3 Bb6 d4 Qe7 O-O d6 Na3","idea":"Si el rival frena con ...a5, avanzamos b5 ganando espacio; tras cambiar el Cd4 levantamos el centro con c3 y d4.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","Gambito Rehusado 4...Ab6: el alfil sigue apuntando a f2 y el rival no toma el peón.","Amenazamos a5 para atrapar el Ab6 y ganamos espacio en el flanco de dama.","El rival frena nuestro peón con ...a5, pero entonces avanzamos b5 ganando espacio.","Atacamos el Cc6 y fijamos el peón a5: dominamos el flanco de dama.","El caballo se centraliza. ¡Ojo! Si 7.Cxe5?, 7...Dg5 ataca e5 y g2 con ventaja negra.","Cambiamos el fuerte caballo central antes de que se instale en d4.","El alfil recaptura y queda en d4, donde lo atacaremos con c3.","Atacamos el alfil con tiempo y preparamos d4: así se cobra la compensación del peón.","El alfil vuelve a b6, otra vez mirando a f2 desde lejos.","Construimos el centro ideal e4-d4 con tiempo, atacando e5.","La dama defiende e5 y deja libre la casilla d8 al rey.","Enrocamos y ponemos el rey a salvo; la torre podrá ir a e1.","Las negras sostienen e5 con el peón y abren la diagonal de su Ac8.","El caballo sale por a3 hacia c2 para apoyar d4; seguiremos con Te1. Más espacio y juego cómodo."]},{"id":"contragambito","name":"Contragambito Evans (4...d5)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 d5 exd5 Nxb4 O-O Nf6 Nxe5 Nbxd5 d4 Bd6 Bb5+ c6 Nxc6 bxc6 Bxc6+ Bd7 Bxa8","idea":"El rival abre el centro con ...d5; tras Cxe5 y d4, el jaque Ab5+ y el golpe Cxc6 nos dan la torre de a8.","notes":["Empezamos con 1.e4: centro, desarrollo rápido y partidas abiertas.","El rival contesta 1...e5, la defensa más clásica, y lucha por d4 y f4.","Atacamos e5 con el caballo y lo desarrollamos hacia el centro.","Defensa natural del peón de e5 con desarrollo; el caballo también vigila d4.","Apuntamos a f7 con el alfil: será un blanco constante en todo el gambito.","El alfil negro sale a c5 y frena nuestro avance d4. Es el momento del gambito.","4.b4: damos un peón de flanco para ganar el centro con tiempo. Idea de William Evans (1827).","Contragambito Evans 4...d5: el rival abre el centro atacando nuestro Ac4 en vez de tomar el peón.","Capturamos: el peón de d5 ataca el Cc6 y nos quedamos con un peón central.","El caballo se come el peón b4 y vigila d5 y c2, amenazando entrar en nuestro campo.","Enrocamos poniendo el rey a salvo antes de abrir el juego.","Las negras desarrollan el caballo y atacan nuestro peón de d5.","Ganamos el peón de e5; el caballo apunta a f7 y c6 desde el centro.","El rival recupera el peón de d5 con el caballo de b4.","Atacamos el Ac5 con el peón, ganando tiempo y ocupando el centro.","El alfil se retira a d6 atacando nuestro caballo de e5.","Jaque que obliga a tapar con c6 y prepara un golpe táctico en c6.","Tapar con el peón es lo mejor; con 9...Rf8 el rival perdería el enroque.","¡Golpe! El caballo come c6 y amenaza la dama de d8.","Las negras capturan el caballo, pero ahora llega el jaque en c6.","Recuperamos la pieza con jaque, atacando también la torre de a8.","El rival tapa el jaque con el alfil; la torre de a8 no puede salvarse.","Ganamos la torre: tras ...Dxa8 tenemos torre y dos peones por dos piezas menores, con buena posición."]},{"id":"stone-ware","name":"Variante Stone-Ware (5...Ad6)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Bd6 d4 Nf6 O-O O-O Re1 h6 Nbd2 Re8 Bb3","idea":"El alfil de d6 tapa al peón d7: con d4, enroque, Te1 y Cbd2 tenemos centro y espacio a cambio del peón.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde simétrico y disputa las casillas centrales d4 y f4.","Desarrollamos el caballo atacando el peón de e5: la jugada más natural.","Las negras defienden e5 con el caballo mientras desarrollan.","El alfil apunta a f7, la casilla más débil del campo negro, defendida sólo por el rey.","El rival copia la idea: su alfil también mira a f7 y controla d4. Es el Giuoco Piano.","¡Gambito Evans! Entregamos el peón b para desviar el Ac5 y ganar tiempos con c3 y d4.","Aceptan el gambito capturando con el alfil: peón de más, pero tiempos perdidos.","Atacamos el alfil con tiempo y preparamos d4: así se cobra la compensación del peón.","Variante Stone-Ware 5...Ad6: el alfil defiende e5, pero tapa el peón d7 y frena el desarrollo negro.","Atacamos e5 de todos modos: ganamos espacio en el centro.","El rival desarrolla el caballo y presiona nuestro peón de e4.","Enrocamos; si ...Cxe4, la torre llegará a e1 y la columna e se abrirá a nuestro favor.","Las negras también enrocan y ponen su rey a salvo en el flanco de rey.","Torre a la columna e: defiende e4 y prepara presión sobre e5.","El rival juega h6 para evitar Ag5 y Cg5 sobre su enroque.","Desarrollamos el caballo, que puede ir a f1-g3 o a c4.","La torre negra refuerza e5 y se coloca en la columna e.","Mantenemos la diagonal hacia f7 y evitamos ...d5 o ...Ca5 con tiempo. Centro y espacio por el peón."]},{"id":"mayet","name":"Defensa Mayet (5...Af8)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Bf8 d4 d6 O-O Na5 Be2 Nf6 dxe5 dxe5 Qa4+ c6 Nxe5","idea":"El alfil vuelve a f8 y nos regala tiempos: abrimos con dxe5 y el jaque Da4+ nos permite recuperar el peón en e5.","notes":["Peón de rey dos casillas: tomamos el centro y abrimos diagonales para dama y alfil.","Respuesta clásica: las negras plantan su propio peón en el centro.","El caballo ataca e5 y despeja la primera fila para el enroque corto.","El caballo negro protege e5 y vigila d4, la casilla de nuestro futuro avance.","Alfil a c4: presiona f7 y controla d5, preparando un juego abierto y rápido.","Las negras sacan su alfil a c5, simétrico al nuestro, apuntando a f2.","Ofrecemos el peón b4: si lo toman, c3 y d4 llegan con tiempo y abrimos líneas contra el rey.","Aceptan el peón capturando con el alfil, que pronto volverá a ser atacado.","Atacamos el alfil con tiempo y preparamos d4: así se cobra la compensación del peón.","Defensa Mayet 5...Af8: el alfil vuelve a casa. Es sólido, pero nos regala un gran tiempo de desarrollo.","Atacamos e5 y ocupamos el centro aprovechando el tiempo regalado.","El rival defiende e5 con el peón d6, cerrando aún más su alfil de f8.","Enrocamos; con el rey a salvo todo está listo para abrir el juego.","El caballo va a a5 para atacar nuestro Ac4 y cambiarlo.","Retiramos el alfil a e2 sin permitir el cambio por el caballo.","Las negras desarrollan el caballo atacando nuestro peón de e4.","Abrimos el centro: el peón e5 negro queda sin el apoyo de d6.","Las negras recapturan con el peón y la columna d queda abierta.","¡Jaque con doble propósito! Además de dar jaque, la dama ataca el Ca5.","Tapan con c6; el Ca5 sigue defendido por la dama de d8 a través de la diagonal d8-a5.","Recuperamos el peón del gambito: material igualado, centro abierto y mejor desarrollo."]}]},{"id":"ruy-lopez","name":"Ruy López","side":"w","eco":"C60–C99","group":"1.e4 e5","blurb":"El alfil a b5 presiona al caballo que defiende e5. La apertura abierta más estudiada.","lines":[{"id":"cerrada","name":"Variante Cerrada","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3","idea":"h3 evita ...Ag4 y prepara d4. Plan típico: Cbd2-f1-g3 para presionar el flanco de rey.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Morphy: el rival pregunta al alfil. Si 4.Axc6 dxc6 5.Cxe5?, ...Dd4 recupera el peón con buen juego.","Mantenemos la clavada retirando el alfil a a4. Así conservamos la pieza y la presión sobre c6.","El caballo se desarrolla y ataca nuestro peón de e4. El rival quiere contraatacar en el centro.","Enrocamos sin miedo: si ...Cxe4, d4 o Te1 recuperan el peón con ventaja de desarrollo.","El rival desarrolla el alfil con calma y prepara su enroque. Ahora sí amenaza ...b5 y ...Cxe4.","La torre defiende e4. Ahora sí amenazamos Axc6 seguido de Cxe5, porque e4 ya está protegido.","El rival rompe la clavada y echa a nuestro alfil de a4, ganando espacio en el flanco de dama.","El alfil se retira a b3, donde apunta a f7 desde la diagonal a2-g8. Es su mejor casilla.","El rival refuerza e5 con un peón, libera al alfil de c8 y evita sorpresas en el centro.","Preparamos d4 con apoyo y damos al alfil la casilla c2 por si el rival juega ...Ca5.","Las negras enrocan y llegan a la posición base de la Cerrada. Ahora eligen su plan.","Evitamos ...Ag4, que clavaría nuestro caballo y presionaría d4. Ahora d4 está listo para la próxima jugada."]},{"id":"berlinesa","name":"Defensa Berlinesa","moves":"e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Nd6 Bxc6 dxc6 dxe5 Nf5 Qxd8+ Kxd8 Nc3 Ke8 h3","idea":"El famoso «muro de Berlín»: final sin damas en el que nuestra mayoría de peones en el flanco de rey es la baza a largo plazo.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Berlinesa: en vez de ...a6, el rival contraataca en e4 de inmediato.","Enrocamos y dejamos el peón de e4: lo recuperaremos con ventaja de desarrollo.","El rival acepta el peón. Su caballo en e4 queda algo expuesto ante d4 y Te1.","Abrimos el centro: amenazamos Te1 y dxe5, con el rey negro todavía sin enrocar.","El caballo se retira atacando a nuestro alfil de b5. Es la entrada al famoso Muro de Berlín.","Cambiamos el alfil por el caballo para doblar los peones del rival y recuperar luego el peón.","El rival recaptura hacia el centro y abre la diagonal de su alfil de c8. Tiene la pareja de alfiles.","Recuperamos el peón y echamos al caballo de d6. Nuestro peón de e5 gana mucho espacio.","El caballo va a f5, su mejor casilla en esta línea. Desde ahí controla d4, e7 y h4.","Cambiamos damas con jaque: el rey negro pierde el enroque. Es el final del Muro de Berlín.","El rey recaptura. Las negras tienen peones doblados, pero la pareja de alfiles y una posición muy sólida.","Desarrollamos el caballo mirando e4 y d5. Nuestra mayoría en el flanco de rey será la clave del final.","El rey vuelve a e8 para conectar sus torres y quedarse en una posición defensiva cómoda.","Evitamos ...Ag4 y preparamos g4 para echar al caballo de f5. Plan: Td1, b3 y Ab2."]},{"id":"marshall","name":"Ataque Marshall","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O c3 d5 exd5 Nxd5 Nxe5 Nxe5 Rxe5 c6 d4 Bd6 Re1","idea":"Las negras dan un peón por un fuerte ataque contra nuestro rey. Tenemos que defender con precisión (g3, Te1) y quedarnos con el peón de más.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Morphy: el rival pregunta al alfil. Si 4.Axc6 dxc6 5.Cxe5?, ...Dd4 recupera el peón con buen juego.","Mantenemos la clavada retirando el alfil a a4. Así conservamos la pieza y la presión sobre c6.","El caballo se desarrolla y ataca nuestro peón de e4. El rival quiere contraatacar en el centro.","Enrocamos sin miedo: si ...Cxe4, d4 o Te1 recuperan el peón con ventaja de desarrollo.","El rival desarrolla el alfil con calma y prepara su enroque. Ahora sí amenaza ...b5 y ...Cxe4.","La torre defiende e4. Ahora sí amenazamos Axc6 seguido de Cxe5, porque e4 ya está protegido.","El rival rompe la clavada y echa a nuestro alfil de a4, ganando espacio en el flanco de dama.","El alfil se retira a b3, donde apunta a f7 desde la diagonal a2-g8. Es su mejor casilla.","El rival enroca y deja la puerta abierta a su gambito favorito.","Preparamos d4 y damos casilla al alfil, pero esto permite el sacrificio del Ataque Marshall.","¡El Marshall! El rival entrega el peón de e5 a cambio de un desarrollo rapidísimo y ataque contra nuestro rey.","Aceptamos el reto y capturamos. Es lo más directo; la alternativa d3 evita la teoría pero es más pasiva.","El rival recupera en d5 con el caballo, que queda centralizado y apunta a f4.","Tomamos el peón de e5 y quedamos con un peón de más. Ahora el rival tiene que demostrar su compensación.","El rival cambia caballos para acelerar su desarrollo y abrir líneas contra nuestro enroque.","Recapturamos con la torre. Está activa, pero será blanco de los ataques del rival.","El rival protege el caballo de d5 y abre la diagonal a su dama. Prepara ...Ad6 y ...Dh4.","Desarrollamos el centro y abrimos la diagonal de nuestro alfil de c1, que hace falta para defender.","El alfil ataca la torre y apunta a h2. Las negras preparan ...Dh4 para atacar el flanco de rey.","Retiramos la torre. Tras ...Dh4 jugaremos g3 y tras ...Dh3, Ae3 y Cd2: defensa precisa con un peón de más."]},{"id":"anti-marshall","name":"Anti-Marshall (8.a4)","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O a4 Bb7 d3 d6 Nc3 Na5 Ba2 b4 Ne2","idea":"Con 8.a4 presionamos b5 y esquivamos el sacrificio ...d5 del Marshall. Partida de maniobras: c3, Cg3 y presión en el flanco de rey.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Morphy: el rival pregunta al alfil. Si 4.Axc6 dxc6 5.Cxe5?, ...Dd4 recupera el peón con buen juego.","Mantenemos la clavada retirando el alfil a a4. Así conservamos la pieza y la presión sobre c6.","El caballo se desarrolla y ataca nuestro peón de e4. El rival quiere contraatacar en el centro.","Enrocamos sin miedo: si ...Cxe4, d4 o Te1 recuperan el peón con ventaja de desarrollo.","El rival desarrolla el alfil con calma y prepara su enroque. Ahora sí amenaza ...b5 y ...Cxe4.","La torre defiende e4. Ahora sí amenazamos Axc6 seguido de Cxe5, porque e4 ya está protegido.","El rival rompe la clavada y echa a nuestro alfil de a4, ganando espacio en el flanco de dama.","El alfil se retira a b3, donde apunta a f7 desde la diagonal a2-g8. Es su mejor casilla.","El rival enroca e invita al Ataque Marshall: si ahora 8.c3, puede sacrificar un peón con 8...d5.","El Anti-Marshall: en vez de c3 atacamos b5 con el peón de a y evitamos el sacrificio ...d5.","El rival desarrolla el alfil hacia la gran diagonal, presionando e4. Si axb5 axb5 Txa8, el alfil recaptura.","Protegemos e4 con calma. Sin c3, el plan blanco es más lento, pero evitamos toda la teoría del Marshall.","El rival refuerza e5 y libera su juego; ahora ...Ca5 o ...b4 están en el aire.","Desarrollamos el caballo y presionamos b5 por segunda vez, junto con el peón de a4.","El caballo ataca a nuestro alfil de b3 para quitarlo de la diagonal que apunta a f7.","Conservamos el alfil en a2, donde sigue mirando a f7 y queda a salvo del caballo de a5.","El rival avanza para echar a nuestro caballo de c3 y ganar espacio en el flanco de dama.","El caballo se recoloca por e2 rumbo a g3 para apoyar el juego en el flanco de rey. Planes: Cg3, c3 y d4."]},{"id":"abierta","name":"Variante Abierta","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Nxe4 d4 b5 Bb3 d5 dxe5 Be6 c3 Bc5 Nbd2 O-O Bc2","idea":"Las negras toman e4 y juegan activamente con ...d5 y ...Ae6. Nosotros apuntamos al caballo de e4 y al rey negro, con el peón de e5 dando espacio.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Morphy: el rival pregunta al alfil. Si 4.Axc6 dxc6 5.Cxe5?, ...Dd4 recupera el peón con buen juego.","Mantenemos la clavada retirando el alfil a a4. Así conservamos la pieza y la presión sobre c6.","El caballo se desarrolla y ataca nuestro peón de e4. El rival quiere contraatacar en el centro.","Enrocamos sin miedo: si ...Cxe4, d4 o Te1 recuperan el peón con ventaja de desarrollo.","La Variante Abierta: el rival captura el peón de e4. Es teoría seria, no un error.","Abrimos el centro de inmediato: amenazamos dxe5 y Te1, aprovechando que el rey negro sigue en el centro.","El rival rompe la clavada antes de que Te1 sea fuerte. Tras ...exd4?, Te1 sería muy peligroso.","El alfil se retira a b3 y apunta a d5 y f7. Ahora el caballo de e4 necesita apoyo.","El rival sostiene su caballo con ...d5 y devuelve el peón de forma activa, liberando su juego.","Recuperamos el peón y ganamos espacio con el peón de e5, que molesta a las piezas negras.","El alfil defiende d5. Las negras tienen piezas activas; nosotros, la estructura más sana.","Damos al alfil la casilla c2 y controlamos d4. Es la jugada más clásica en esta posición.","El alfil se coloca en su casilla más activa y apunta a f2, apoyando al caballo de e4.","Desafiamos al caballo de e4, la pieza clave del rival. Cambiarlo debilita su centro.","El rival enroca y mantiene la tensión. Si ...Cxf2?!, entramos en complicaciones muy conocidas.","El alfil presiona e4 por segunda vez. El caballo tendrá que decidirse y nuestro alfil apuntará al enroque negro."]},{"id":"chigorin","name":"Cerrada, Variante Chigorin (9...Ca5)","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Na5 Bc2 c5 d4 Qc7 Nbd2 cxd4 cxd4","idea":"Las negras ganan espacio en el flanco de dama con ...Ca5 y ...c5. Mantenemos el centro e4-d4 y llevamos el caballo a b3 o al flanco de rey.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde simétrico: su peón de e5 frena nuestro avance y también disputa el centro.","Desarrollamos el caballo atacando el peón de e5. Es la jugada más natural y obliga al rival a defenderlo.","El rival defiende e5 con el caballo y a la vez desarrolla una pieza hacia el centro.","La Ruy López: el alfil ataca al caballo que defiende e5. No hay amenaza inmediata, pero la presión durará toda la partida.","La Defensa Morphy: el rival pregunta al alfil. Si 4.Axc6 dxc6 5.Cxe5?, ...Dd4 recupera el peón con buen juego.","Mant
