 h8 podrá tomar en d8.","Interponemos la dama. Si tapamos con otra pieza, ...Txd8 recupera la dama igual; así cambiamos un alfil.","El rival cambia damas definitivamente y llegamos a un final.","Recapturamos. El material está igualado y la teoría considera este final equilibrado; el rival tiene mayoría en el flanco de dama."]},{"id":"aceptado-cc6","name":"Aceptado con 4.Ac4 Cc6","moves":"e4 e5 d4 exd4 c3 dxc3 Bc4 Nc6 Nxc3 Bb4 Nf3 d6 O-O Bxc3 bxc3","idea":"Si el rival no toma b2, recuperamos tiempo con Cxc3 y, tras los cambios, tenemos la pareja de alfiles y el centro por un peón.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5, ocupa su parte del centro y frena nuestro avance d4 sin preparación.","Atacamos el peón de e5 de inmediato. Si el rival toma, podemos recuperar o sacrificar.","El rival captura en d4. Ahora elegimos: recuperar con la dama (Gambito del Centro) o jugar c3.","¡El Gambito Danés! Ofrecemos un peón para abrir líneas y desarrollarnos a toda velocidad.","El rival acepta. Ahora tenemos que jugar rápido: cada tiempo cuenta.","No recuperamos: ofrecemos un segundo peón. El alfil apunta a f7 y el desarrollo es lo único que importa.","El rival no toma el segundo peón y desarrolla. Así evita abrir la gran diagonal a nuestro alfil de c1.","El caballo se desarrolla en c3 capturando el peón. Seguimos con un solo peón de menos.","El rival clava el caballo y piensa cambiarlo para frenar nuestro avance e5.","Desarrollamos y preparamos el enroque. Las piezas blancas dominan el centro.","El rival frena e5 y abre la diagonal a su alfil de c8.","Enrocamos y dejamos que cambie en c3: recapturaremos con el peón hacia el centro.","El rival cambia en c3 para doblar nuestros peones y quitarnos un atacante.","Recapturamos. A cambio del peón tenemos la pareja de alfiles, el centro y columnas abiertas. Plan: Db3, e5 o Aa3."]},{"id":"aceptado-cxc3","name":"Aceptado con 4.Cxc3 (4...Ab4)","moves":"e4 e5 d4 exd4 c3 dxc3 Nxc3 Bb4 Bc4 Bxc3+ bxc3 d6 Qb3 Qe7 Ne2","idea":"Recuperamos con el caballo y nos conformamos con un peón de menos. Tras ...Axc3 tenemos la pareja de alfiles y presión sobre f7 y b7.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5, ocupa su parte del centro y frena nuestro avance d4 sin preparación.","Atacamos el peón de e5 de inmediato. Si el rival toma, podemos recuperar o sacrificar.","El rival captura en d4. Ahora elegimos: recuperar con la dama (Gambito del Centro) o jugar c3.","¡El Gambito Danés! Ofrecemos un peón para abrir líneas y desarrollarnos a toda velocidad.","El rival acepta. Ahora tenemos que jugar rápido: cada tiempo cuenta.","Recuperamos con el caballo en lugar de dar el segundo peón. Más sólido: un solo peón de gambito.","La idea de Alekhine: el rival clava el caballo y planea cambiarlo para frenar nuestro desarrollo.","Desarrollamos el alfil hacia f7. No nos importa que cambie en c3.","El rival cambia con jaque y nos dobla los peones, pero nos deja la pareja de alfiles.","Recapturamos hacia el centro. La columna b se abre para nuestra torre y nuestra dama.","El rival frena e5 y prepara el desarrollo de su alfil de c8.","La dama ataca f7 y b7 a la vez. Es la idea típica del Danés.","La dama defiende f7 y vigila e4; el peón de b7 lo protege el alfil de c8.","Desarrollamos el caballo por e2 para no tapar el peón de f y enrocar pronto. Tenemos la pareja de alfiles."]},{"id":"gambito-centro","name":"Gambito del Centro (3.Dxd4)","moves":"e4 e5 d4 exd4 Qxd4 Nc6 Qe3 Nf6 Nc3 Bb4 Bd2 O-O O-O-O Re8 Bc4","idea":"Recuperamos el peón con la dama, la llevamos a e3 (Ataque Paulsen) y enrocamos largo: enroques opuestos y ataque en el flanco de rey.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","El rival responde con e5, ocupa su parte del centro y frena nuestro avance d4 sin preparación.","Atacamos el peón de e5 de inmediato. Si el rival toma, podemos recuperar o sacrificar.","El rival captura en d4. Ahora elegimos: recuperar con la dama (Gambito del Centro) o jugar c3.","El Gambito del Centro: recuperamos el peón con la dama. La dama queda expuesta, pero nos quedamos con el centro.","El rival desarrolla atacando a nuestra dama. Es la respuesta lógica.","El Ataque Paulsen: la dama va a e3, donde impide ...d5 y podrá pasar a g3 para presionar g7.","El rival desarrolla el caballo y ataca nuestro peón de e4.","Defendemos e4 desarrollando. Ojo: 5.e5? Cg4 atacaría a nuestra dama.","El rival clava el caballo y aumenta la presión sobre e4.","Desclavamos el caballo y preparamos el enroque largo, que llevará la torre a la columna d.","El rival enroca y prepara ...Te8 para atacar e4 por la columna abierta.","Enrocamos largo: con enroques opuestos habrá ataques. Nuestra torre ya está en la columna d.","La torre presiona e4 por la columna e, con nuestra dama de e3 detrás.","Desarrollamos el último alfil apuntando a f7. Posición dinámica; planes: f3 o Dg3 y ataque en el flanco de rey."]}]},{"id":"smith-morra","name":"Gambito Smith-Morra","side":"w","eco":"B21","group":"1.e4 c5","blurb":"Contra la Siciliana entregamos un peón con 3.c3 para desarrollarnos rápido y usar las columnas c y d abiertas. Lleno de trampas para el rival.","lines":[{"id":"clasica","name":"Variante Clásica (...Cc6, ...d6, ...e6)","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6 O-O Nf6 Qe2 Be7 Rd1 e5 Be3 O-O Rac1","idea":"Desarrollo modelo: De2, Td1 y Tac1 con las torres en las columnas abiertas. Si el rival juega ...e5, la casilla d5 es nuestra.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","La Siciliana: el rival lucha por d4 desde el flanco y busca un juego desequilibrado.","Atacamos el centro de inmediato. Si el rival toma, ofreceremos el Gambito Smith-Morra.","El rival captura en d4, como en casi todas las sicilianas.","¡El Smith-Morra! Ofrecemos un peón para desarrollarnos rápido y abrir las columnas c y d.","El rival acepta el gambito. Tiene un peón de más, pero tendrá que defenderse con cuidado.","Recapturamos con el caballo, que ya está desarrollado y controla d5 y b5.","El rival desarrolla el caballo, vigila d4 y e5 y se prepara para defender su peón de más.","Desarrollamos el otro caballo. Plan típico: Ac4, O-O, De2 y Td1, con las torres en las columnas abiertas.","El rival controla e5 y frena nuestro avance central. Es la formación clásica.","El alfil apunta a f7 y e6. Ojo: si 6...Ag4?, 7.Axf7+ Rxf7 8.Cg5+ y 9.Dxg4 gana un peón.","El rival cierra la diagonal de nuestro alfil hacia f7. Es la defensa más sólida.","Enrocamos. Ahora el plan es De2 y Td1 para presionar d6 por la columna abierta.","El rival desarrolla el caballo; con ...e6 ya jugado, el golpe e5 no es tan peligroso.","La dama deja libre d1 para la torre y apoya un futuro e5.","El rival desarrolla el alfil y prepara el enroque.","La torre a la columna d presiona d6. Amenazamos e5 con apertura de líneas.","El rival cierra la columna d y frena e5, aunque deja la casilla d5 débil.","Desarrollamos el alfil, controlando c5 y b6, y conectamos las torres.","El rival enroca. Todas sus piezas están desarrolladas, pero la casilla d5 es nuestra.","La segunda torre ocupa la columna c. Plan: Cd5, Ab5 y presión en c7. Buena compensación por el peón."]},{"id":"scheveningen-a6","name":"Formación Scheveningen con ...a6 y ...Dc7","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6 O-O Nf6 Qe2 a6 Rd1 Qc7 Bf4 Be7 Rac1","idea":"El rival se defiende con ...a6 y ...Dc7. Presionamos d6 con Td1 y Af4 y ponemos la torre frente a su dama en la columna c.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","La Siciliana: el rival lucha por d4 desde el flanco y busca un juego desequilibrado.","Atacamos el centro de inmediato. Si el rival toma, ofreceremos el Gambito Smith-Morra.","El rival captura en d4, como en casi todas las sicilianas.","¡El Smith-Morra! Ofrecemos un peón para desarrollarnos rápido y abrir las columnas c y d.","El rival acepta el gambito. Tiene un peón de más, pero tendrá que defenderse con cuidado.","Recapturamos con el caballo, que ya está desarrollado y controla d5 y b5.","El rival desarrolla el caballo, vigila d4 y e5 y se prepara para defender su peón de más.","Desarrollamos el otro caballo. Plan típico: Ac4, O-O, De2 y Td1, con las torres en las columnas abiertas.","El rival controla e5 y frena nuestro avance central. Es la formación clásica.","El alfil apunta a f7 y e6. Ojo: si 6...Ag4?, 7.Axf7+ Rxf7 8.Cg5+ y 9.Dxg4 gana un peón.","El rival cierra la diagonal de nuestro alfil hacia f7. Es la defensa más sólida.","Enrocamos. Ahora el plan es De2 y Td1 para presionar d6 por la columna abierta.","El rival desarrolla el caballo; con ...e6 ya jugado, el golpe e5 no es tan peligroso.","La dama deja libre d1 para la torre y apoya el avance e5.","El rival evita Cb5 y prepara ...b5, pero retrasa una vez más su desarrollo.","La torre presiona d6 por la columna abierta. Amenazamos la ruptura e5.","La dama defiende d6 y vigila e5, pero se coloca en la columna c, frente a nuestra futura torre.","El alfil presiona d6 y apoya e5. Ahora la ruptura e5 es una amenaza seria.","El rival defiende d6 por segunda vez y prepara el enroque.","La torre se enfrenta a la dama de c7 por la columna c. Ideas: Cd5 o Cb5 con tácticas. Gran actividad."]},{"id":"siberiana","name":"Variante Siberiana (...e6, ...Cf6 y ...Dc7)","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 e6 Bc4 Nf6 O-O Qc7 Nb5 Qb8 e5 Nxe5 Nxe5 Qxe5 Re1","idea":"Evitamos la trampa siberiana (De2 Cg4 h3?? Cd4!) echando a la dama con Cb5 y abriendo líneas con e5. El rey negro sigue en el centro.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","La Siciliana: el rival lucha por d4 desde el flanco y busca un juego desequilibrado.","Atacamos el centro de inmediato. Si el rival toma, ofreceremos el Gambito Smith-Morra.","El rival captura en d4, como en casi todas las sicilianas.","¡El Smith-Morra! Ofrecemos un peón para desarrollarnos rápido y abrir las columnas c y d.","El rival acepta el gambito. Tiene un peón de más, pero tendrá que defenderse con cuidado.","Recapturamos con el caballo, que ya está desarrollado y controla d5 y b5.","El rival desarrolla el caballo, vigila d4 y e5 y se prepara para defender su peón de más.","Desarrollamos el otro caballo. Plan típico: Ac4, O-O, De2 y Td1, con las torres en las columnas abiertas.","El rival controla d5 y abre la diagonal a su alfil de f8.","El alfil apunta a e6 y f7. Nuestras piezas ocupan sus mejores casillas.","El rival desarrolla el caballo y ataca nuestro peón de e4.","Enrocamos y ponemos el rey a salvo; e4 sigue defendido por el caballo de c3.","La Siberiana. ¡Trampa! Si 8.De2 Cg4 9.h3??, ...Cd4! gana nuestra dama (10.Cxd4 Dh2#).","Echamos a la dama con tiempo y evitamos la trampa. El caballo amenaza Cc7+ y Cd6+.","La dama se retira a b8, desde donde sigue vigilando c7 y d6.","¡Abrimos líneas! Entregamos otro peón para echar al caballo de f6 y activar la torre.","El rival toma con el caballo. Si no lo hace, avanzaremos exf6 o ganaremos espacio.","Cambiamos el caballo y obligamos a la dama de b8 a salir a la columna e.","La dama recupera en e5, pero queda en la columna e, frente a nuestra futura torre.","La torre ataca a la dama. El rey negro sigue en el centro y amenazamos Cd6+ o Af4: gran iniciativa."]},{"id":"trampa-cd5-nge7","name":"Trampa Cd5 contra ...Cge7","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 e6 Bc4 a6 O-O Nge7 Bg5 f6 Be3 Ng6 Bb3 b5 Nd5 exd5 exd5 Nce5 d6","idea":"Contra el plan ...a6 y ...Cge7, provocamos ...f6 con Ag5 y sacrificamos en d5 para abrir la columna e contra el rey negro.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","La Siciliana: el rival lucha por d4 desde el flanco y busca un juego desequilibrado.","Atacamos el centro de inmediato. Si el rival toma, ofreceremos el Gambito Smith-Morra.","El rival captura en d4, como en casi todas las sicilianas.","¡El Smith-Morra! Ofrecemos un peón para desarrollarnos rápido y abrir las columnas c y d.","El rival acepta el gambito. Tiene un peón de más, pero tendrá que defenderse con cuidado.","Recapturamos con el caballo, que ya está desarrollado y controla d5 y b5.","El rival desarrolla el caballo, vigila d4 y e5 y se prepara para defender su peón de más.","Desarrollamos el otro caballo. Plan típico: Ac4, O-O, De2 y Td1, con las torres en las columnas abiertas.","El rival controla d5 y abre la diagonal a su alfil de f8.","El alfil apunta a e6 y f7. Nuestras piezas ocupan sus mejores casillas.","El rival impide Cb5 y prepara ...b5. Es la formación Paulsen.","Enrocamos y completamos el desarrollo del flanco de rey.","El caballo va a e7 rumbo a g6, donde no lo molestará e5. Pero aquí empiezan los trucos.","Atacamos el caballo de e7 y provocamos ...f6, que debilita la diagonal a2-g8 y la casilla e6.","El rival defiende con ...f6, pero su rey queda más expuesto en la diagonal de nuestro alfil.","Retiramos el alfil, que ahora apunta a b6 y c5. El avance ...f6 ya ha creado debilidades.","El caballo llega a g6, donde controla e5 y f4 y protege al rey negro.","Retiramos el alfil antes de que ...b5 lo eche con tiempo. Sigue mirando a e6 y g8.","El rival gana espacio y prepara ...Ab7, pero descuida el centro y la casilla b6.","¡Golpe típico! Sacrificamos el caballo en d5 para abrir la columna e. Lo mejor para el rival era 11...Tb8.","El rival acepta la pieza. La columna e se abre y su rey sigue en el centro.","Recapturamos y atacamos el caballo de c6. El peón de d5 se clava como una cuña en la posición negra.","El caballo se centraliza en e5 para tapar la columna e.","Avanzamos d6: encerramos al alfil de f8 y amenazamos Ad5 y Te1. Ataque muy fuerte por la pieza."]},{"id":"trampa-e5","name":"Trampa 6...Cf6? 7.e5!","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 Nf6 e5 dxe5 Qxd8+ Nxd8 Nb5 Rb8 Nxe5","idea":"Si el rival desarrolla el caballo antes de ...e6, el golpe e5 abre la diagonal hacia f7 y nuestro caballo apunta a c7.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","La Siciliana: el rival lucha por d4 desde el flanco y busca un juego desequilibrado.","Atacamos el centro de inmediato. Si el rival toma, ofreceremos el Gambito Smith-Morra.","El rival captura en d4, como en casi todas las sicilianas.","¡El Smith-Morra! Ofrecemos un peón para desarrollarnos rápido y abrir las columnas c y d.","El rival acepta el gambito. Tiene un peón de más, pero tendrá que defenderse con cuidado.","Recapturamos con el caballo, que ya está desarrollado y controla d5 y b5.","El rival desarrolla el caballo, vigila d4 y e5 y se prepara para defender su peón de más.","Desarrollamos el otro caballo. Plan típico: Ac4, O-O, De2 y Td1, con las torres en las columnas abiertas.","El rival controla e5 y frena nuestro avance central. Es la formación clásica.","El alfil apunta a f7: si el rival no juega ...e6, esa diagonal será un problema para él.","Error típico: el rival desarrolla el caballo antes de ...e6. Ahora tenemos un golpe central.","¡Atacamos el caballo! Si 7...Cxe5?, 8.Cxe5 dxe5 9.Axf7+ Rxf7 10.Dxd8 gana la dama.","El rival captura con el peón, lo mejor. Ahora cambiamos damas con jaque.","Cambiamos damas con jaque. El rey negro ya no enrocará y c7 queda débil.","El rival recaptura con el caballo para no perder el enroque... pero c7 queda sin defensa.","Amenazamos Cc7+, horquilla al rey y a la torre de a8. El rival debe defenderse con precisión.","La mejor defensa: la torre sale de a8 y evita la horquilla. Si 9...Rd7??, 10.Cxe5+ Re8 11.Cc7#.","Recuperamos un peón con amenazas sobre f7 y c7. Gran iniciativa en el final pese al peón de menos."]},{"id":"declinado-cf6","name":"Declinado con 3...Cf6 (Alapin)","moves":"e4 c5 d4 cxd4 c3 Nf6 e5 Nd5 cxd4 d6 Nf3 Nc6 Bc4 Nb6 Bb5 dxe5 Nxe5 Bd7 Bxc6 Bxc6 O-O g6 Nc3","idea":"El rival declina y pasamos a una Siciliana Alapin: peón aislado en d4 pero piezas activas y un caballo fuerte en e5.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","La Siciliana: el rival lucha por d4 desde el flanco y busca un juego desequilibrado.","Atacamos el centro de inmediato. Si el rival toma, ofreceremos el Gambito Smith-Morra.","El rival captura en d4, como en casi todas las sicilianas.","¡El Smith-Morra! Ofrecemos un peón para desarrollarnos rápido y abrir las columnas c y d.","El rival declina atacando e4. Pasamos a una estructura de Siciliana Alapin.","Echamos al caballo con el peón y ganamos espacio; el caballo debe ir a d5.","El caballo se centraliza en d5, donde está fuerte pero puede ser atacado.","Recuperamos el peón y formamos un centro con e5 y d4. Material igualado.","El rival ataca nuestro peón de e5 para debilitar el centro.","Defendemos e5 desarrollando el caballo de rey, que además protege d4.","El rival desarrolla el caballo y presiona e5 y d4 a la vez.","Atacamos el caballo de d5 con el alfil y seguimos desarrollándonos con tiempo.","El caballo se retira a b6 atacando a nuestro alfil de c4.","El alfil va a b5 y clava el caballo de c6, que presionaba d4 y e5.","El rival cambia en e5 para quitarnos el peón avanzado.","Recapturamos con el caballo y aumentamos la presión sobre c6.","El rival desclava su caballo poniendo el alfil en d7, que defiende c6.","Cambiamos en c6 para quedarnos con un caballo fuerte en e5.","El rival recaptura con el alfil, que queda en la gran diagonal mirando g2.","Enrocamos. El caballo de e5 vigila el alfil de c6 y la casilla f7.","El rival prepara el fianchetto para poner su alfil en g7 contra d4.","Completamos el desarrollo. Tenemos un peón aislado en d4, pero piezas activas y espacio. Posición equilibrada."]},{"id":"declinado-d5","name":"Declinado con 3...d5","moves":"e4 c5 d4 cxd4 c3 d5 exd5 Qxd5 cxd4 Nf6 Nf3 Bg4 Be2 e6 h3 Bh5 O-O Nc6 Nc3 Qd6 Be3","idea":"Tras 3...d5 llegamos a una posición de peón aislado tipo Alapin: desarrollo rápido, Cc3 con tiempo sobre la dama y juego activo.","notes":["Ocupamos el centro con el peón de rey y abrimos líneas para la dama y el alfil de casillas blancas.","La Siciliana: el rival lucha por d4 desde el flanco y busca un juego desequilibrado.","Atacamos el centro de inmediato. Si el rival toma, ofreceremos el Gambito Smith-Morra.","El rival captura en d4, como en casi todas las sicilianas.","¡El Smith-Morra! Ofrecemos un peón para desarrollarnos rápido y abrir las columnas c y d.","El rival declina con un contraataque en el centro. Lleva a estructuras de la Alapin.","Cambiamos en d5 para que el rival no pueda tomar en e4.","La dama recaptura y queda centralizada. Pronto la atacaremos con Cc3.","Recuperamos el peón: el material está igualado y tenemos un peón central en d4.","El rival desarrolla y prepara ...Ag4 contra nuestro caballo.","Desarrollamos el caballo protegiendo d4. Pronto el otro caballo atacará a la dama.","El alfil clava el caballo de f3, que defiende d4, para aumentar la presión sobre él.","Desclavamos el caballo con el alfil y preparamos el enroque corto.","El rival abre la diagonal de su alfil de f8 y refuerza d5.","Preguntamos al alfil: si cambia en f3, tendremos la pareja de alfiles.","El alfil mantiene la clavada para seguir presionando d4.","Enrocamos y el rey queda a salvo; ya no hay clavada peligrosa.","El rival presiona d4 con el caballo, ahora por tercera vez.","Desarrollamos atacando a la dama de d5 y ganamos tiempo.","La dama se retira a d6, desde donde sigue vigilando d4.","Protegemos d4 y completamos el desarrollo. Posición de peón aislado con juego activo para nosotros."]}]},{"id":"gambito-dama","name":"Gambito de Dama","side":"w","eco":"D06–D69","group":"1.d4 d5","blurb":"2.c4: ofrecer el peón c para desviar el peón d5 y dominar el centro.","lines":[{"id":"ortodoxa","name":"Rehusado, Ortodoxa","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 h6 Bh4 b6 cxd5 Nxd5 Bxe7 Qxe7 Nxd5 exd5 Rc1 Be6 Qa4 c5 Qa3","idea":"Presión clásica con Ag5. Las negras liberan con ...b6 y ...Ab7 (Tartakower); cambiamos en d5 y atacamos los peones colgantes c5 y d5, como Fischer contra Spassky (1972).","notes":["Abrimos con el peón de dama: ocupa el centro, controla e5 y c5 y libera el alfil de c1. Ya está defendido por la dama.","El rival responde simétrico y frena nuestro e4. Su peón de d5 será el objetivo de nuestra siguiente jugada.","El Gambito de Dama: atacamos d5 desde el flanco. No es un gambito real: si el rival toma, recuperamos el peón con facilidad.","Las negras rehúsan sosteniendo d5 con ...e6. Es muy sólido, aunque encierra su alfil de c8, que será su pieza problemática.","Desarrollamos el caballo y sumamos un segundo atacante sobre d5, además de controlar la casilla e4.","El caballo negro defiende d5 y vigila e4. Ahora la presión y la defensa sobre d5 están equilibradas.","Clavamos el caballo de f6 contra la dama: así debilitamos la defensa de d5 y de e4. Es la jugada clásica de la Ortodoxa.","Las negras rompen la clavada interponiendo el alfil. Ahora el caballo ya puede moverse sin dejar la dama colgando.","Abrimos la diagonal del alfil de f1 y reforzamos d4. Como Ag5 ya salió, e3 no encierra a nuestro alfil de dama.","El rival enroca corto y pone su rey a salvo. Nosotros seguimos desarrollando antes de decidir nada en el centro.","El caballo va a su casilla natural: controla e5 y d4 y prepara nuestro enroque corto.","Las negras preguntan al alfil. Si lo cambiamos en f6 el rival gana la pareja de alfiles; preferimos mantener la clavada.","Retiramos a h4 y la clavada sigue: el alfil presiona f6 y el rival debe contar con ella en cada jugada.","Variante Tartakower: las negras preparan ...Ab7 para dar salida al alfil de c8, su gran problema en esta defensa.","Cambiamos en d5 antes de que el alfil llegue a b7 y fije su diagonal; además abrimos la columna c para nuestras torres.","Recapturan con el caballo buscando cambios que alivien su posición, algo apretada.","Con el caballo fuera de f6, el alfil de e7 ya ve nuestro alfil de h4. Lo cambiamos primero y no perdemos tiempo.","La dama recaptura y queda bien colocada en e7, cubriendo c7 y el flanco de rey.","Cambiamos caballos: tras la recaptura con peón, el rival tendrá un peón en d5 que con ...c5 se convertirá en objetivo.","Las negras recapturan con el peón. Su alfil de c8 ya respira por c8-h3, pero d5 y c5 serán puntos sensibles.","La torre ocupa la columna c semiabierta y presiona c7; si el rival juega ...c5, ese peón quedará bajo fuego directo.","El alfil defiende d5 y se desarrolla. El rival quiere jugar ...c5 para liberar su posición.","Activamos la dama hacia a7 y a6: amenazamos Da6 y molestamos el flanco de dama justo cuando el rival quiere ...c5.","Las negras juegan la liberadora ...c5 y aceptan los peones colgantes en c5 y d5 a cambio de actividad.","Dama a a3: clava el peón de c5 contra la dama de e7. Seguirán Ab5 y dxc5 para atacar los peones colgantes; así ganó Fischer."]},{"id":"eslava","name":"Defensa Eslava","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 dxc4 a4 Bf5 e3 e6 Bxc4 Bb4 O-O O-O Qe2 Nbd7 e4 Bg6 Bd3","idea":"a4 impide ...b5; recuperamos el peón con centro sólido y preparamos la ruptura e4 con De2.","notes":["Comenzamos con d4: ganamos espacio en el centro y abrimos la diagonal del alfil de dama.","El rival disputa el centro con ...d5, impidiendo nuestro e4 inmediato.","Atacamos d5 con c4. Si el rival cambia, recuperaremos el peón con comodidad.","Defensa Eslava: ...c6 sostiene d5 sin encerrar el alfil de c8, a diferencia de ...e6.","Desarrollamos el caballo y controlamos e5 y d4. Cubrir e5 será útil si el rival intenta ...e5.","El caballo defiende d5 y vigila e4, la casilla clave para nuestro avance central.","Otro caballo hacia el centro: más presión sobre d5 y más control de e4.","Ahora sí, el rival toma en c4 y amenaza sostener el peón con ...b5. Nuestra respuesta debe impedirlo.","Con a4 evitamos ...b5. El precio es debilitar la casilla b4, pero recuperaremos c4 en pocas jugadas.","El alfil sale antes de jugar ...e6, como manda la Eslava: activo en f5 y controlando e4.","Abrimos el alfil de f1 para recuperar el peón de c4. Además reforzamos d4.","Las negras completan su estructura y abren la diagonal de su alfil de f8.","Recuperamos el peón: material igualado y un alfil activo apuntando a e6 y f7.","El alfil clava nuestro caballo aprovechando la casilla b4 que dejó a4. Así frena la ruptura e4.","Enrocamos: el rey queda seguro y la torre podrá ir al centro para apoyar e4.","El rival también enroca. Lo básico está hecho; ahora la lucha gira en torno a la casilla e4.","La dama prepara e4: apoya esa casilla y deja d1 libre para la torre. Es el plan principal.","El caballo cubre e5 y c5 y se prepara para responder a nuestro e4.","Rompemos con e4: ganamos el centro con tiempo, porque atacamos al alfil de f5.","El alfil se retira a g6, desde donde sigue mirando e4 y nuestro centro.","El alfil defiende e4 y despeja c4. El plan es e5 para echar al caballo de f6 y ganar espacio."]},{"id":"aceptado","name":"Gambito de Dama Aceptado","moves":"d4 d5 c4 dxc4 Nf3 Nf6 e3 e6 Bxc4 c5 O-O a6 Qe2 b5 Bb3 Bb7 Rd1 Nbd7 Nc3","idea":"Las negras ceden el centro para presionar d4 con ...c5. Recuperamos el peón, enrocamos y usamos la columna d con De2 y Td1.","notes":["Salimos con d4: controlamos e5 y c5 y preparamos c4.","El rival ocupa el centro con ...d5 y frena nuestro avance e4.","Ofrecemos el peón de c4 para desviar el peón de d5 del centro.","Gambito Aceptado: el rival toma el peón y cede el centro, pensando presionarlo luego con ...e6 y ...c5.","No hay prisa por recuperar el peón: desarrollamos y evitamos ...e5, que liberaría el juego negro.","El caballo negro se desarrolla, vigila e4 y d5 y evita que juguemos e4 cómodamente.","Abrimos la diagonal del alfil de f1 para tomar en c4. Si el rival defiende con ...b5, a4 rompe esa cadena.","Las negras abren su alfil de f8 y renuncian a sostener el peón de c4.","Recuperamos el peón con un alfil activo apuntando a f7. Material igual y nosotros con más centro.","Golpe típico: ...c5 ataca d4. Así el rival busca dejarnos un peón aislado o igualar el centro.","Enrocamos antes de nada. Si cambian en d4, a menudo aceptamos el peón aislado a cambio de piezas activas.","El rival prepara ...b5 para echar a nuestro alfil de c4 y desarrollar el suyo por b7.","La dama sale a e2: protege el alfil, deja d1 para la torre y prepara la presión en la columna d.","El rival gana espacio en el flanco de dama atacando nuestro alfil con tiempo.","Retiramos a b3, donde el alfil sigue mirando e6 y d5, casillas centrales importantes.","El alfil negro ocupa la gran diagonal y presiona f3 y g2.","La torre se sitúa frente a la dama negra en la columna d: tras dxc5 o d5 la columna se abrirá con ventaja para nosotros.","El caballo se desarrolla y cubre c5, pero la dama negra sigue en la misma columna que nuestra torre.","Terminamos el desarrollo. Idea: e4 y d5 para abrir el centro y aprovechar la torre de d1."]},{"id":"meran","name":"Semieslava, Merano","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 e3 Nbd7 Bd3 dxc4 Bxc4 b5 Bd3 Bb7 O-O a6 e4 c5 d5","idea":"Las negras ganan espacio en el flanco de dama con ...b5. Respondemos con e4 y, ante ...c5, d5 para cerrar la diagonal del alfil de b7.","notes":["Abrimos con d4, la jugada que define el Gambito de Dama.","El rival responde con ...d5 y se planta en el centro.","Presionamos d5 con c4: buscamos que el rival ceda el centro o se encierre.","...c6 defiende d5: es el inicio de la estructura eslava.","Desarrollamos el caballo y controlamos e5, evitando una ruptura ...e5 temprana.","El caballo negro defiende d5 y presiona e4, frenando nuestro avance central.","Más presión sobre d5 y más control de la casilla e4.","Con ...e6 nace la Semieslava: un triángulo c6-d5-e6 muy sólido, aunque el alfil de c8 queda tapado.","Jugamos e3 con calma: reforzamos d4 y abrimos el alfil de f1. Evitamos las complicaciones del Gambito Botvinnik con Ag5.","El caballo va a d7 para apoyar las rupturas ...e5 o ...c5.","El alfil sale a d3 apuntando a h7. Ahora el rival suele tomar en c4 para ganar un tiempo contra él.","Merano: las negras capturan en c4 para avanzar luego ...b5 con tiempo.","Recuperamos el peón enseguida; el alfil será atacado, pero es la forma natural de igualar material.","...b5 gana espacio atacando nuestro alfil y prepara ...Ab7 y ...c5. Es el sello de la Merano.","El alfil vuelve a d3, su mejor diagonal: apunta a h7 y apoya e4.","Por fin el alfil negro tiene diagonal: desde b7 presiona e4 y el centro.","Enrocamos y ponemos el rey a salvo antes de abrir el centro.","El rival prepara ...c5, cubriendo b5 para que Cxb5 no sea posible tras el avance.","Rompemos con e4: ganamos el centro y abrimos líneas para nuestras piezas.","Contragolpe típico: ...c5 ataca d4 y busca abrir la diagonal del alfil de b7.","Avanzamos d5: ganamos espacio, cortamos la diagonal del alfil de b7 y dejamos al rival con el juego cerrado en el centro."]},{"id":"cambio","name":"Variante del Cambio (Ag5 y ataque de minorías)","moves":"d4 d5 c4 e6 Nc3 Nf6 cxd5 exd5 Bg5 c6 e3 Be7 Bd3 Nbd7 Qc2 O-O Nf3 Re8 O-O Nf8 Rab1 Ng6 b4","idea":"Cambiamos en d5 para fijar la estructura Carlsbad y lanzamos el ataque de minorías b4-b5 para dejar al rival un peón débil en c6 o d5.","notes":["Abrimos con d4: ocupamos el centro y liberamos el alfil de dama.","El rival se opone con ...d5 y frena nuestro peón de e.","Atacamos d5 con c4 para luchar por el centro desde el flanco.","El rival sostiene d5 con ...e6, la defensa clásica.","Desarrollamos el caballo, que presiona d5 y controla e4.","El caballo negro defiende d5 y controla e4. Posición típica del Gambito de Dama.","Variante del Cambio: tomamos en d5 para fijar la estructura Carlsbad. Ya sabemos el plan: el ataque de minorías.","Las negras recapturan con peón: su alfil de c8 se libera, pero la estructura de peones queda fijada.","Clavamos el caballo de f6, que defiende d5, y sacamos el alfil antes de jugar e3.","El rival refuerza d5 y prepara ...Ad6 o ...Dc7. Es la estructura típica Carlsbad.","Abrimos el alfil de f1 y reforzamos d4. Como el alfil de dama ya salió, no queda encerrado.","El alfil rompe la clavada y deja libre al caballo de f6.","El alfil apunta a h7 y controla f5, para impedir ...Af5, que cambiaría el alfil malo del rival.","El caballo se desarrolla y prepara ...Cf8-g6, una maniobra habitual en esta estructura.","La dama forma batería con el alfil contra h7 y vigila e4, para impedir que el caballo rival se instale allí con ...Ce4.","El rival enroca corto y pone el rey a salvo. Ahora maniobrará con ...Te8 y ...Cf8.","Desarrollamos el caballo: ahora enrocamos corto y empezamos el plan en el flanco de dama.","La torre a e8 prepara ...Cf8 y apoya una futura jugada ...Ce4.","Enrocamos corto. El rey está seguro y la partida se decidirá en el flanco de dama.","El caballo va a f8, camino de g6 o e6, para defender y buscar juego en el flanco de rey.","La torre va a b1 para apoyar b4-b5: es el ataque de minorías, dos peones nuestros contra tres del rival.","El caballo llega a g6, presiona e5 y amenaza ...h6 para molestar a nuestro alfil de g5.","Lanzamos el ataque de minorías: b4 y luego b5. Al cambiar en c6, el rival quedará con un peón débil en c6 o en d5."]},{"id":"ragozin","name":"Defensa Ragozin (4...Ab4)","moves":"d4 d5 c4 e6 Nc3 Nf6 Nf3 Bb4 Bg5 h6 Bxf6 Qxf6 e3 O-O Rc1 dxc4 Bxc4 c5 O-O cxd4 Ne4","idea":"Entregamos la pareja de alfiles a cambio de desarrollo rápido; tras ...c5 y ...cxd4, Ce4 gana tiempo contra la dama.","notes":["Iniciamos con d4: ocupamos el centro y abrimos el alfil de c1.","El rival responde con ...d5, la defensa clásica del peón de dama.","c4 desafía al peón de d5: es el Gambito de Dama, que busca desviar ese peón.","Las negras sostienen d5 con ...e6, sin complicarse.","El caballo se desarrolla, presiona d5 y prepara Ag5 o Cf3.","El caballo negro defiende d5 y controla e4. Aún no se sabe qué esquema elegirá.","Desarrollamos el otro caballo antes que el alfil: controlamos e5 y d4 y mantenemos opciones.","Defensa Ragozin: el alfil clava nuestro caballo de c3. Es una mezcla de Gambito de Dama y Nimzoindia.","Contraclavamos el caballo de f6 contra la dama: ahora ambos bandos presionan con clavadas.","El rival pregunta al alfil. Si nos retiramos a h4, puede seguir ...g5 y ...Ce4; aquí preferimos cambiar.","Cambiamos en f6: damos la pareja de alfiles, pero el rival pierde el caballo que defendía d5 y nosotros ganamos tiempo.","La dama recaptura y mira a f3 y d4. Está activa, pero también puede ser blanco de nuestras piezas.","Reforzamos d4 y abrimos el alfil de f1. La dama de f6 se queda sin objetivos claros.","El rival enroca y deja la ruptura ...c5 para más adelante.","La torre ocupa la columna c: si el rival abre con ...dxc4 y ...c5, estará lista para actuar.","Las negras capturan en c4 para luego romper con ...c5 y activar su pareja de alfiles.","Recuperamos el peón y desarrollamos el alfil con tiempo, apuntando a e6 y f7.","La ruptura ...c5 ataca d4 y abre el juego para la pareja de alfiles.","Enrocamos y ponemos el rey a salvo antes de que se abra el centro.","El rival toma en d4: ese peón ataca nuestro caballo de c3, que además está atacado por el alfil de b4.","El caballo escapa a e4 con tiempo atacando la dama de f6. Después recuperamos el peón de d4 con Cxd4 o exd4."]},{"id":"lasker","name":"Defensa Lasker (7...Ce4)","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 h6 Bh4 Ne4 Bxe7 Qxe7 cxd5 Nxc3 bxc3 exd5 Qb3 Rd8 c4","idea":"Las negras simplifican con ...Ce4. Ganamos un centro c3-d4 y luego atacamos d5 con Db3 y c4.","notes":["Iniciamos con d4: el peón central más sólido, porque ya está defendido por la dama.","El rival contesta con ...d5 y frena nuestro e4 inmediato.","c4: el Gambito de Dama ataca d5 desde el flanco sin arriesgar nada.","El rival elige ...e6: sólido, pero su alfil de c8 queda encerrado.","El caballo se desarrolla hacia el centro y presiona d5.","El caballo negro defiende d5 y controla la casilla e4.","Clavamos el caballo: presión indirecta sobre d5 y e4.","El alfil se interpone para romper la clavada y prepara el enroque corto.","Reforzamos d4 y abrimos el alfil de f1, ahora que el alfil de dama ya está fuera.","El rival enroca corto y pone su rey a salvo antes de liberar su juego.","El caballo controla e5 y prepara nuestro enroque corto con tranquilidad.","El rival pregunta al alfil: ¿cambiamos en f6 o mantenemos la clavada?","Mantenemos la clavada retirando a h4: el caballo de f6 sigue sin poder moverse con libertad.","Defensa Lasker: el caballo salta a e4 para forzar cambios. Además, el alfil de e7 ya ataca a nuestro alfil de h4.","Cambiamos alfiles; si no, el rival tomaría en h4 o en c3 con comodidad.","La dama recaptura y queda activa en e7, vigilando b4 y el flanco de rey.","Tomamos en d5 antes de que el rival cambie en c3: abrimos la columna c y fijamos el centro.","El rival cambia caballos para simplificar: es la idea de la Lasker, reducir material.","Recapturamos hacia el centro: el peón de c3 refuerza d4 y la columna b se abre para nuestras piezas.","El rival recupera el peón: material igual, pero nosotros tenemos más centro.","La dama va a b3 y ataca b7 y d5 a la vez. El rival debe defender ambos puntos.","La torre defiende el peón de d5, que ahora atacan nuestra dama y pronto nuestro peón c.","Atacamos d5 con c4 para abrir la posición, aprovechando nuestro centro y la columna b."]},{"id":"tarrasch","name":"Defensa Tarrasch","moves":"d4 d5 c4 e6 Nc3 c5 cxd5 exd5 Nf3 Nc6 g3 Nf6 Bg2 Be7 O-O O-O Bg5 cxd4 Nxd4 h6 Be3 Re8 Rc1","idea":"Peón aislado en d5: el fianchetto blanco lo presiona, bloqueamos en d4 y llevamos las torres a la columna c.","notes":["Abrimos con d4, controlando e5 y c5 y liberando el alfil de c1.","El rival se planta en el centro con ...d5 y nos impide jugar e4.","Atacamos d5 con c4: el Gambito de Dama, sin riesgo para nosotros.","Las negras defienden con ...e6 y preparan la ruptura ...c5.","Más presión sobre d5 con el caballo, que también controla e4.","Defensa Tarrasch: ...c5 desafía el centro de inmediato y acepta un peón aislado a cambio de juego libre.","Cambiamos en d5 para fijar el peón aislado que el rival está dispuesto a recibir.","Recapturan con el peón: el d5 negro podrá quedar aislado, pero da actividad a sus piezas.","Desarrollamos el caballo, que vigila d4 y e5 y prepara el fianchetto.","El caballo negro presiona d4 y apoya el peón de d5 de forma indirecta.","Esquema Rubinstein: el alfil irá a g2 para atacar el peón de d5 desde lejos.","El caballo se desarrolla y defiende d5, que ya siente la presión de nuestro esquema.","El alfil se coloca en la gran diagonal y apunta directamente al peón de d5.","El rival termina el desarrollo del flanco de rey para enrocar.","Enrocamos: nuestro rey está seguro detrás del fianchetto.","El rival enroca también. Ahora toda la partida gira alrededor del peón de d5.","Atacamos al caballo de f6, que defiende d5: así aumentamos la presión sobre el peón.","El rival cambia en d4 y deja su peón de d5 definitivamente aislado.","Recapturamos con el caballo, que bloquea delante del peón aislado: es su casilla ideal.","El rival pregunta al alfil para aliviar la presión sobre su caballo de f6.","Retiramos a e3, donde el alfil protege el caballo de d4 y controla c5.","La torre ocupa la columna e semiabierta, prepara ...Af8 y presiona la casilla e2.","La torre va a la columna c, frente al caballo de c6. Plan: presionar d5 y c6 hasta ganar el peón aislado."]},{"id":"semitarrasch","name":"Semitarrasch (4...c5)","moves":"d4 d5 c4 e6 Nc3 Nf6 Nf3 c5 cxd5 Nxd5 e4 Nxc3 bxc3 cxd4 cxd4 Bb4+ Bd2 Bxd2+ Qxd2 O-O Bc4 Nc6 O-O b6 Rad1","idea":"Construimos el gran centro e4-d4 con tiempo y preparamos el avance d5 con las torres detrás.","notes":["Comenzamos con d4, un peón central ya defendido por la dama.","El rival responde con ...d5 y se planta en el centro.","c4 ataca d5: buscamos desviar ese peón del centro para jugar e4.","El rival defiende con ...e6, la respuesta clásica y sólida.","Desarrollamos el caballo, que mira d5 y e4, las casillas centrales clave.","El caballo negro defiende d5 y controla e4 para frenarnos.","El segundo caballo controla e5 y d4 y prepara el enroque corto.","Semitarrasch: ...c5 ataca nuestro centro, pero el rival recapturará con caballo para no quedar con un peón aislado.","Cambiamos en d5 para obligar al rival a decidir cómo recaptura.","Recapturan con el caballo: sin peón aislado, pero nos dejan ocupar el centro.","Construimos el gran centro con e4, atacando al caballo con tiempo.","El rival cambia caballos para no tener que retroceder.","Recapturamos hacia el centro: el peón de c3 sostiene d4.","Las negras cambian en d4 para reducir nuestro centro.","Recuperamos con el peón: nuestra pareja de peones e4-d4 domina el centro.","Jaque con el alfil para cambiar piezas y aliviar la presión.","Interponemos el alfil y ofrecemos el cambio: menos piezas no debilitan nuestro centro.","El rival cambia: con menos piezas espera presionar nuestro centro.","La dama recaptura, protege d4 y queda centralizada.","El rival enroca corto. Su plan será presionar d4 y e4 con ...Cc6 y ...b6.","El alfil sale a c4, su mejor casilla, apoyando el avance d5.","El caballo presiona d4 y deja libre la diagonal de la dama negra hacia d4.","Enrocamos: el rey está a salvo y las torres quedan conectadas.","El rival prepara ...Ab7 para presionar e4 desde la gran diagonal.","La torre se coloca detrás del peón d: el plan es d5, avanzando el centro con fuerza."]},{"id":"chigorin","name":"Defensa Chigorin (2...Cc6)","moves":"d4 d5 c4 Nc6 Nf3 Bg4 cxd5 Bxf3 gxf3 Qxd5 e3 e5 Nc3 Bb4 Bd2 Bxc3 bxc3 Qd6 Rb1 b6 f4","idea":"Ganamos la pareja de alfiles; tras ...e5 abrimos el centro con f4 para que nuestros alfiles dominen.","notes":["Iniciamos con d4, la apertura de peón de dama, controlando e5 y c5.","El rival responde con ...d5 y frena nuestro avance e4.","Atacamos d5 con c4: el Gambito de Dama, que invita al rival a ceder el centro.","Defensa Chigorin: el caballo presiona d4 y tapa su peón c. Las negras buscan piezas activas antes que estructura.","Desarrollamos el caballo y defendemos d4 de forma natural.","El alfil clava nuestro caballo para seguir presionando d4.","Tomamos en d5: la dama negra tendrá que recapturar y quedará expuesta en el centro.","El rival cambia el alfil por el caballo para recuperar el peón con la dama.","Recapturamos con el peón g: ganamos la pareja de alfiles y la columna g semiabierta.","La dama recupera el peón y queda centralizada, aunque expuesta a nuestros desarrollos.","Reforzamos d4 y abrimos el alfil de f1, que podrá ir a c4 o g2.","El rival rompe con ...e5 para abrir líneas y aprovechar su ventaja de desarrollo.","Desarrollamos con tiempo, atacando a la dama de d5.","El alfil clava el caballo contra el rey y deja la dama en d5 sin ser molestada.","Desclavamos con el alfil: así no tenemos que preocuparnos por el caballo.","El rival cambia en c3 para doblarnos los peones y quitarnos la pareja de alfiles.","Recapturamos: los peones doblados se compensan con la columna b abierta y la pareja de alfiles.","La dama se retira a d6, desde donde vigila e5 y nuestro flanco de dama.","La torre ocupa la columna b abierta y presiona b7.","El rival defiende b7 avanzando el peón, aunque debilita la diagonal a1-h8 y c6.","Golpeamos con f4: abrimos el centro para que nuestro par de alfiles sea dominante."]},{"id":"albin","name":"Contragambito Albin","moves":"d4 d5 c4 e5 dxe5 d4 Nf3 Nc6 g3 Be6 Nbd2 Qd7 Bg2 O-O-O O-O","idea":"Aceptamos el peón, evitamos e3 (trampa de Lasker) y con Cf3, g3 y Cbd2 mantenemos el peón extra y atacamos al rey enrocado largo.","notes":["Abrimos con d4, controlando e5 y c5 y liberando el alfil de c1.","El rival ocupa el centro con ...d5 y frena nuestro avance e4.","Atacamos d5 con c4: el Gambito de Dama, que invita al rival a ceder el centro.","Contragambito Albin: el rival entrega un peón para ganar espacio con ...d4.","Aceptamos el peón: es la respuesta correcta y ganamos material con un centro sano.","El peón avanza a d4 e impide Cc3. Cuidado: si e3?, ...Ab4+ Ad2 dxe3 y tras Axb4?? exf2+ Re2 fxg1=C+ cae la trampa de Lasker.","Desarrollamos el caballo y defendemos e5. Evitamos e3, que caería en la trampa.","El caballo presiona e5 para recuperar el peón, que defendemos con piezas.","Fianchetto: el alfil irá a g2 para atacar el flanco de dama. Es la forma más fiable de mantener el peón.","El alfil ataca c4 y prepara ...Dd7 y el enroque largo.","El caballo defiende c4 y prepara Cb3 para atacar el peón de d4.","La dama prepara el enroque largo y ...Ah3 para cambiar nuestro alfil de g2.","El alfil ocupa la gran diagonal, presionando b7 y c6.","El rival enroca largo para lanzar los peones del flanco de rey.","Enrocamos con un peón extra. Plan: a3, b4 y Db3 para atacar al rey negro."]},{"id":"bf4","name":"Rehusado, 5.Bf4","moves":"d4 d5 c4 e6 Nc3 Nf6 Nf3 Be7 Bf4 O-O e3 c5 dxc5 Bxc5 a3 Nc6","idea":"El alfil activo en f4; juego con ligera ventaja de espacio."},{"id":"moscu","name":"Semieslava, Moscú (5.Bg5 h6)","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 Bg5 h6 Bxf6 Qxf6 e3 Nd7 Bd3 dxc4 Bxc4 g6","idea":"Las blancas ceden la pareja de alfiles por desarrollo y centro."},{"id":"botvinnik","name":"Semieslava, Botvinnik","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 Bg5 dxc4 e4 b5 e5 h6 Bh4 g5 Nxg5 hxg5 Bxg5 Nbd7","idea":"Una de las líneas más tácticas del ajedrez: hay que saberla de memoria."},{"id":"anti-meran","name":"Semieslava, Anti-Merano (6.Qc2)","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 e6 Qc2 Nbd7 e3 Bd6 Bd3 O-O O-O dxc4 Bxc4 b5 Bd3","idea":"La dama en c2 apoya e4 y apunta a h7."},{"id":"eslava-cambio","name":"Eslava, Variante del Cambio","moves":"d4 d5 c4 c6 cxd5 cxd5 Nc3 Nf6 Bf4 Nc6 e3 Bf5 Nf3 e6","idea":"Posición simétrica: las blancas buscan presión en la columna c."},{"id":"cheban  peón de c4. Si lo consigue, tendrá un peón de más.","Recuperamos el peón con la dama antes de que el rival pueda defenderlo con ...b5.","El rival gana espacio con tiempo atacando nuestra dama.","La dama vuelve a c2, desde donde controla c7 y e4.","El alfil negro se opone en la gran diagonal a nuestro alfil de g2.","Af4 presiona c7, punto débil del rival tras ...b5. Seguirán Td1 o Tc1 para ocupar las columnas abiertas."]},{"id":"cerrada","name":"Catalana Cerrada (4...Ae7)","moves":"d4 Nf6 c4 e6 g3 d5 Bg2 Be7 Nf3 O-O O-O Nbd7 Qc2 c6 Nbd2 b6 e4 Bb7 b3 Rc8 Bb2","idea":"El rival mantiene el peón en d5. Preparamos e4 con Dc2 y Cbd2 y hacemos fianchetto de dama con b3 y Ab2.","notes":["Abrimos con d4: ocupamos el centro, controlamos e5 y c5 y preparamos c4.","El rival juega ...Cf6, que controla e4 y no compromete todavía su peón de d.","c4 gana espacio y controla d5: nos encaminamos hacia un Gambito de Dama con fianchetto.","El rival juega ...e6, preparando ...d5 o ...Ab4 según lo que hagamos.","Catalana: g3 prepara el fianchetto. El alfil de g2 presionará d5 y b7 por la gran diagonal.","El rival ocupa el centro con ...d5, que tapa por ahora nuestra gran diagonal.","El alfil llega a g2, la pieza clave de la Catalana, apuntando a d5 y al flanco de dama.","Catalana Cerrada: el rival no toma en c4 y se desarrolla con solidez.","El caballo se desarrolla, controla e5 y prepara el enroque corto.","El rival enroca corto y mantiene su sólido peón de d5.","Enrocamos: el rey queda a salvo detrás del fianchetto.","El caballo negro prepara ...c5 o ...e5 para liberar su posición.","La dama controla e4 y prepara la ruptura central e4.","El rival refuerza d5 con ...c6 y prepara ...b6 y ...Ab7 para desarrollar su alfil malo.","El caballo va a d2 para apoyar e4 y poder recapturar en c4 si el rival toma.","El rival prepara el fianchetto de dama para resolver el problema de su alfil de c8.","Rompemos con e4: ganamos espacio en el centro y abrimos la gran diagonal de nuestro alfil.","El alfi ía saltar más adelante.","e3 refuerza d4 y abre la diagonal del alfil de f1. Es la pieza central de nuestra pirámide.","El rival abre la diagonal de su alfil de f8 y prepara la ruptura ...c5.","El caballo va a f3 y controla e5, la casilla clave del Londres.","...c5 ataca d4: el rival busca presión en el flanco de dama.","c3 sostiene d4 y completa la pirámide c3-d4-e3. Si ...cxd4, recapturamos con exd4 o cxd4 según convenga.","El caballo presiona d4 y el rival se prepara para ...Ad6.","El caballo va a d2 para apoyar e4 o Ce5. No a c3, donde chocaría con nuestro peón.","...Ad6 ofrece cambiar el alfil de f4, nuestra mejor pieza. Si cambiamos, el rival consigue buen juego.","Retiramos a g3 para mantener el alfil. Si ...Axg3, hxg3 nos abre la columna h para la torre.","El rival enroca corto. Su rey es ahora el objetivo de nuestro alfil de d3 y de Ce5.","El alfil va a d3 apuntando a h7: junto con Ce5 y Df3 o Dc2, puede convertirse en un ataque directo.","El rival prepara ...Ab7 para luchar por e4 y por la gran diagonal.","El caballo salta a e5, casilla fuerte apoyada por d4 y f4. Cubre c6 y d7 y prepara f4.","El alfil ocupa la gran diagonal y presiona e4, pero nuestro centro está bien cerrado.","f4 refuerza el caballo de e5: tenemos un Stonewall con un ataque potencial contra el enroque negro."]},{"id":"vs-qb6","name":"Contra ...c5 y ...Qb6","moves":"d4 d5 Bf4 c5 e3 Nc6 c3 Qb6 Qb3 c4 Qc2 Nf6 Nd2 e6 Ngf3 Be7 e4","idea":"Db3 ofrece el cambio de damas; tras ...c4 la dama vuelve a c2 apuntando a h7 y rompemos con e4.","notes":["Abrimos con d4, la base del Sistema Londres: ocupa el centro y libera el alfil de c1.","El rival responde con ...d5 y se planta en el centro.","El alfil sale a f4, el sello del Londres, antes de cerrarlo con e3.","...c5 ataca d4 temprano y prepara ...Db6, que aprovecha la salida de nuestro alfil, que ya no defiende b2.","e3 refuerza d4 y abre nuestro alfil de f1. Ya no podemos defender b2 con el alfil.","El caballo presiona d4 y prepara ...Db6 para dob nta y tenemos juego más fácil."]},{"id":"vs-india-rey","name":"Contra el esquema India de Rey (1...Cf6 y ...g6)","moves":"c4 Nf6 Nc3 g6 g3 Bg7 Bg2 O-O e4 d6 Nge2 e5 O-O c6 d3","idea":"Esquema Botvinnik con e4 y Cge2: controlamos d5 y dejamos el peón de f libre para la ruptura f4.","notes":["Abrimos con c4: control de d5 y flexibilidad total para elegir esquema después.","El rival juega ...Cf6, que no compromete sus peones centrales.","El caballo controla d5 y e4 y prepara el avance e4.","El rival prepara el fianchetto de rey, propio de la India de Rey.","Hacemos nuestro propio fianchetto: el alfil de g2 controlará d5 y b7.","El alfil negro ocupa la gran diagonal y apunta a nuestro caballo de c3 y a b2.","El alfil llega a g2: ya controlamos d5 con tres piezas.","El rival enroca corto antes de decidir su esquema central.","e4 controla d5 con un peón más: esquema Botvinnik. El rival no podrá romper con ...d5.","El rival controla e5 y prepara ...e5 para fijar el centro.","El caballo va a e2, no a f3, para dejar libre el peón de f y poder jugar f4.","El rival ocupa el centro con ...e5 y frena nuestra ruptura d4.","Enrocamos y ponemos el rey a salvo antes de mover el peón de f.","El rival prepara ...d5 o ...a6 y ...b5 para atacar nuestro centro.","d3 sostiene e4 y controla c4. Plan: f4, o Tb1 y b4 para ganar espacio en el flanco de dama."]},{"id":"simetrica-rubinstein","name":"Simétrica, Sistema Rubinstein (...Cc7)","moves":"c4 c5 Nc3 Nf6 g3 d5 cxd5 Nxd5 Bg2 Nc7 Nf3 Nc6 O-O e5 d3 Be7 Nd2","idea":"Contra el centro ...c5-...e5 presionamos con el alfil de g2 y llevamos el caballo de d2 a c4 para atacar e5 y d6.","notes":["Abrimos con c4: controlamos d5 desde el flanco sin comprometer los peones centrales.","El rival responde con ...c5, la Variante Simétrica.","El caballo controla d5 y e4 y dificulta la ruptura ...d5 del rival.","El caballo negro prepara igualmente la ruptura ...d5 para luchar por el centro.","Preparamos el fianchetto: el alfil de g2 será la pieza más importa la e5, frenando la ruptura ...e5.","El alfil negro también controla e5 y apunta a h2, cerca de nuestro rey.","La dama controla e4 y e5 y vigila h7, con idea de jugar d4 o e4 más adelante.","El rival enroca corto y completa su desarrollo con una posición sólida.","El alfil prepara nuestro enroque corto. Después elegiremos entre d4 o un esquema más lento con d3."]}]},{"id":"blackmar-diemer","name":"Gambito Blackmar-Diemer","side":"w","eco":"D00","group":"1.d4 d5","blurb":"Gambito agresivo: entregamos el peón de e para abrir la columna f y lanzarnos al ataque con todas las piezas contra el rey rival.","lines":[{"id":"teichmann","name":"Defensa Teichmann (5...Ag4)","moves":"d4 d5 e4 dxe4 Nc3 Nf6 f3 exf3 Nxf3 Bg4 h3 Bxf3 Qxf3 c6 Be3 e6 Bd3 Nbd7 O-O-O Be7 g4","idea":"El rival cambia nuestro caballo; ganamos la pareja de alfiles, enrocamos largo y lanzamos g4-g5 contra su enroque.","notes":["Abrimos con d4. Nuestro plan es entregar el peón de e para conseguir un desarrollo rapidísimo y la columna f abierta.","El rival responde con ...d5 y ocupa el centro, como en un Gambito de Dama.","Gambito Blackmar-Diemer: e4 ofrece un peón. Si el rival no lo toma, exd5 o e5 nos dejan una buena Francesa o Escandinava.","El rival acepta el peón. Ahora su peón de e4 quedará muy expuesto a nuestras piezas.","El caballo ataca el peón de e4 y se desarrolla con tiempo. Si ...Cf6, llega la jugada clave del gambito.","El caballo negro defiende e4. Sin esta jugada, Cxe4 recuperaría el peón con buen centro.","f3 ofrece un segundo peón: si el rival toma, la columna f se abre y nuestro desarrollo será enorme.","El rival acepta el gambito. Está un peón arriba, pero nosotros vamos a desarrollar todas las piezas muy deprisa.","Recapturamos con el caballo, que se desarrolla, controla e5 y g5 y prepara Ac4 u Ad3 con el enroque.","Defensa Teichmann: el alfil clava el caballo y quiere cambiarlo para debilitar nuestro control de e5 y d4.","Preguntamos al alfil: o cambia en f3 y nos da la pareja de alfiles, o se retira y pierde tiempo.","El rival cambia y nos da la pareja de alfiles a cambio de quitarnos un atacante.","La dama recaptura y queda activa en f3, apuntando a b7. Si ...Dxd4, Ae3 y luego Dxb7 nos da un desarrollo tremendo.","El rival defiende b7 con ...c6 y cierra la diagonal de nuestra dama.","El alfil defiende d4 y prepara el enroque largo, para atacar luego con los peones del flanco de rey.","El rival abre la diagonal de su alfil de f8 y prepara el enroque corto.","El alfil apunta a h7: cuando el rival enroque corto, será el blanco de nuestro ataque.","El caballo negro se desarrolla y deja libre el camino de su alfil hacia e7.","Enroque largo: con los reyes en flancos opuestos, nuestros peones de g y h podrán avanzar sin riesgo.","El rival se prepara para enrocar corto, justo hacia donde dirigimos el ataque.","g4 inicia el ataque: g5 echará al caballo de f6 y abrirá líneas contra el rey negro."]},{"id":"ziegler","name":"Defensa Ziegler (5...c6)","moves":"d4 d5 e4 dxe4 Nc3 Nf6 f3 exf3 Nxf3 c6 Bc4 Bf5 Ne5 e6 g4 Bg6 h4 Nbd7 Nxg6 hxg6 Bf4","idea":"El rival refuerza con ...c6 y saca el alfil a f5; lo perseguimos con Ce5, g4 y h4 y nos quedamos con la pareja de alfiles.","notes":["Abrimos con d4. Nuestro plan es entregar el peón de e para conseguir un desarrollo rapidísimo y la columna f abierta.","El rival responde con ...d5 y ocupa el centro, como en un Gambito de Dama.","Gambito Blackmar-Diemer: e4 ofrece un peón. Si el rival no lo toma, exd5 o e5 nos dejan una buena Francesa o Escandinava.","El rival acepta el peón. Ahora su peón de e4 quedará muy expuesto a nuestras piezas.","El caballo ataca el peón de e4 y se desarrolla con tiempo. Si ...Cf6, llega la jugada clave del gambito.","El caballo negro defiende e4. Sin esta jugada, Cxe4 recuperaría el peón con buen centro.","f3 ofrece un segundo peón: si el rival toma, la columna f se abre y nuestro desarrollo será enorme.","El rival acepta el gambito. Está un peón arriba, pero nosotros vamos a desarrollar todas las piezas muy deprisa.","Recapturamos con el caballo, que se desarrolla, controla e5 y g5 y prepara Ac4 u Ad3 con el enroque.","Defensa Ziegler: ...c6 controla d5 y b5 y prepara ...Af5 o ...Ag4 con una posición muy sólida.","El alfil apunta a f7, el punto débil del rival, y prepara el enroque corto.","El alfil sale activo a f5 y presiona c2. Será un blanco para nuestros peones del flanco de rey.","Ce5 presiona f7 junto al alfil de c4 y prepara g4 para atacar al alfil de f5 con tiempo.","El rival cierra la diagonal de nuestro alfil hacia f7 y da al alfil de f5 una retirada.","g4 ataca el alfil de f5 y gana espacio. La torre de h1 aún no se ha movido y apoya el avance h4.","El alfil se retira a g6, donde lo perseguimos con h4-h5.","h4 amenaza h5, que atraparía al alfil de g6. El rival tiene que reaccionar enseguida.","El rival desafía nuestro caballo para poder cambiarlo antes de que h5 atrape a su alfil.","Cambiamos el caballo por el alfil: ganamos la pareja de alfiles y evitamos que ...Cxe5 nos quite el caballo gratis.","El rival recaptura hacia el centro y abre su columna h, aunque nuestra torre de h1 defiende h4.","El alfil sale a f4, controla e5 y d6 y completa el desarrollo. Tenemos dos alfiles activos por el peón entregado."]},{"id":"euwe","name":"Defensa Euwe (5...e6)","moves":"d4 d5 e4 dxe4 Nc3 Nf6 f3 exf3 Nxf3 e6 Bg5 Be7 Bd3 O-O O-O Nbd7 Qe1 c5 Qh4","idea":"Con ...e6 el rival cierra su alfil de c8; desarrollamos, enrocamos y atacamos con De1-h4 y el alfil de d3.","notes":["Abrimos con d4. Nuestro plan es entregar el peón de e para conseguir un desarrollo rapidísimo y la columna f abierta.","El rival responde con ...d5 y ocupa el centro, como en un Gambito de Dama.","Gambito Blackmar-Diemer: e4 ofrece un peón. Si el rival no lo toma, exd5 o e5 nos dejan una buena Francesa o Escandinava.","El rival acepta el peón. Ahora su peón de e4 quedará muy expuesto a nuestras piezas.","El caballo ataca el peón de e4 y se desarrolla con tiempo. Si ...Cf6, llega la juga
