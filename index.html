<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aperturas del Club</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cuaderno de repertorio — lista de aperturas en rejilla; entrenador con tablero a la izquierda y panel de notación a la derecha (apilado en móvil). */
:root {
  --bg: #eef1ed; --surface: #ffffff; --surface-2: #e3e8e2; --ink: #18211c; --muted: #5b6a61; --line: #cfd8d0;
  --accent: #2c6a4a; --accent-ink: #ffffff; --brass: #b07d24;
  --sq-light: #ebe8d2; --sq-dark: #779657; --sq-last: rgba(214, 178, 60, .55); --sq-sel: rgba(44, 106, 74, .55); --sq-hint: rgba(64, 140, 220, .55);
  --good: #2e7d4f; --warn: #b8741a; --bad: #b3392f; --new: #6b6f8a;
  --f-display: "Spectral", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #19201c; --surface-2: #222b26; --ink: #e5ebe6; --muted: #98a79d; --line: #2e3933;
  --accent: #5db487; --accent-ink: #0d1611; --brass: #d9a64a;
  --sq-light: #d9d6be; --sq-dark: #6a8a4c;
  --good: #5fc08a; --warn: #e0a24a; --bad: #ec7468; --new: #a4a8c8; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --surface-2: #222b26; --ink: #e5ebe6; --muted: #98a79d; --line: #2e3933;
  --accent: #5db487; --accent-ink: #0d1611; --brass: #d9a64a;
  --sq-light: #d9d6be; --sq-dark: #6a8a4c;
  --good: #5fc08a; --warn: #e0a24a; --bad: #ec7468; --new: #a4a8c8; color-scheme: dark }
* { box-sizing: border-box }
html, body { background: var(--bg) }
body { color: var(--ink); font: 16px/1.5 var(--f-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
h2 { font-size: 1.5rem }
h3 { font-size: 1.15rem }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
.muted { color: var(--muted) }
.mono { font-family: var(--f-mono); font-size: .92em }

.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px }
.top p { margin: 6px 0 0; max-width: 60ch; color: var(--muted) }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.primary:disabled { opacity: .45; cursor: default }
.btn.ghost { background: transparent }
.btn.small { padding: 5px 10px; font-size: .9rem }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.stat b { display: block; font-family: var(--f-display); font-size: 1.8rem; line-height: 1.1; font-variant-numeric: tabular-nums }
.stat span { font-size: .85rem; color: var(--muted) }
.stat.due b { color: var(--brass) }

.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 8px 0 18px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-weight: 600; font-variant-numeric: tabular-nums }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.ctl-label { font-size: .9rem; color: var(--muted); margin-right: 6px }

.section-title { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.card:hover { border-color: var(--accent) }
.card .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.card p { margin: 0; font-size: .92rem; color: var(--muted) }
.side-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); vertical-align: -1px; margin-right: 6px }
.side-dot.w { background: #fafafa } .side-dot.b { background: #1a1a1a }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex }
.bar i { display: block; height: 100% }
.bar .g { background: var(--good) } .bar .a { background: var(--warn) }
.card .meta { font-size: .82rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap }
.card .meta .due { color: var(--brass); font-weight: 700 }

.chip { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.chip.nueva { color: var(--new) } .chip.aprendiendo { color: var(--warn) } .chip.pendiente { color: var(--brass) } .chip.repaso { color: var(--accent) } .chip.dominada { color: var(--good) }

.lines { display: flex; flex-direction: column; gap: 8px; margin-top: 14px }
.line-row { display: grid; grid-template-columns: 2rem 1fr auto; gap: 10px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.line-row .rank { font-family: var(--f-display); font-size: 1.3rem; color: var(--muted); text-align: center }
.line-row .txt { min-width: 0 }
.line-row .txt .mono { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.line-row .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end }
.line-row.out { opacity: .55 }

/* Entrenador a pantalla completa: barra superior, explicación de la jugada, tablero y barra inferior fija (sin scroll). En pantallas anchas, tablero a la izquierda y columna de notas a la derecha. */
:root { --arrow: rgba(201, 58, 46, .82); --arrow-hint: rgba(44, 106, 74, .8) }
.tv { position: fixed; inset: 0; z-index: 5; background: var(--bg); display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "prog" "card" "board" "bar";
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tv-top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; min-width: 0 }
.tv-title { flex: 1; min-width: 0; line-height: 1.2 }
.tv-title .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tv-title strong { display: block; font-family: var(--f-display); font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.icon { border: 0; background: transparent; width: 44px; height: 44px; border-radius: 10px; display: inline-grid; place-items: center; flex: none }
.icon:hover { background: var(--surface-2) }
.icon svg, .tb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.tv-prog { grid-area: prog; height: 6px; margin: 0 12px 8px; border-radius: 3px; background: var(--surface-2); overflow: hidden }
.tv-prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s }
.tv-card { grid-area: card; margin: 0 10px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  height: clamp(7.4em, 22vh, 11.5em); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; font-size: 1rem; line-height: 1.42 }
.tv-card .mv { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 3px; flex-wrap: wrap }
.tv-card .mv b { color: var(--ink); font-size: .95rem }
.tv-card .who { font-family: var(--f-body); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor }
.tv-card .who.me { color: var(--accent) } .tv-card .who.op { color: var(--muted) }
.tv-card p { margin: 0 }
.tv-card .st { font-weight: 700; margin-bottom: 4px }
.tv-card .st.ok { color: var(--good) } .tv-card .st.err { color: var(--bad) } .tv-card .st.done { color: var(--accent) }
.tv-card .prev { color: var(--muted); font-size: .9rem; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line) }
.tv-boardarea { grid-area: board; min-height: 0; min-width: 0; display: grid; place-items: start center; padding: 0 6px }
.board-wrap { position: relative; width: 100%; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none }
.board { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px var(--line) }
.board.shake { animation: shake .3s }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
@media (prefers-reduced-motion: reduce) { .board.shake { animation: none; box-shadow: 0 0 0 3px var(--bad) } .tv-prog i { transition: none } }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3 }
.sq { position: relative; background: var(--sq-light) }
.sq.d { background: var(--sq-dark) }
.sq.last::before, .sq.sel::before, .sq.hint::before, .sq.wrong::before { content: ""; position: absolute; inset: 0 }
.sq.last::before { background: var(--sq-last) }
.sq.sel::before { background: var(--sq-sel) }
.sq.hint::before { background: var(--sq-hint) }
.sq.wrong::before { background: rgba(200, 50, 40, .5) }
.sq.target::after { content: ""; position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%; background: rgba(20, 40, 30, .28) }
.sq.target.cap::after { left: 4%; top: 4%; width: 92%; height: 92%; background: transparent; border: 5px solid rgba(20, 40, 30, .28) }
.pc { position: absolute; inset: 0; background-size: 100% 100%; z-index: 1; pointer-events: none }
.coord { position: absolute; font: 700 10px/1 var(--f-body); z-index: 2; pointer-events: none; opacity: .8 }
.coord.f { right: 3px; bottom: 3px } .coord.r { left: 3px; top: 3px }
.sq .coord { color: var(--sq-dark) } .sq.d .coord { color: var(--sq-light) }
.drag { position: fixed; z-index: 50; pointer-events: none; background-size: 100% 100%; transform: translate(-50%, -50%) }
.tv-bar { grid-area: bar; display: flex; align-items: center; gap: 2px; padding: 8px 6px 10px; border-top: 1px solid var(--line); background: var(--surface) }
.tb { border: 0; background: transparent; min-width: 44px; height: 52px; border-radius: 10px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .68rem; font-weight: 600; color: var(--muted); padding: 0 4px }
.tb:hover { background: var(--surface-2); color: var(--ink) }
.tb:disabled { opacity: .3; cursor: default; background: transparent }
.tb.big svg { width: 30px; height: 30px; stroke-width: 2.4 }
.tb.big { color: var(--ink); min-width: 52px }
.tb.on { color: var(--accent) }
.tb-main { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: .9rem; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 4px }
.tb-main.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.tb-main .sub { font-weight: 600; opacity: .8; font-variant-numeric: tabular-nums }
.tv-side { grid-area: side; display: none; min-height: 0; overflow-y: auto; padding: 0 10px 10px }
.moves { font-family: var(--f-mono); font-size: .95rem; display: flex; flex-wrap: wrap; gap: 2px 4px; line-height: 1.9 }
.moves .n { color: var(--muted); margin-left: 6px }
.moves button { border: 0; background: transparent; padding: 0 4px; border-radius: 4px; font: inherit }
.moves button.cur { background: var(--accent); color: var(--accent-ink) }
.moves button.fut { color: var(--muted); opacity: .5 }
.moves .hidden { color: var(--muted) }
.idea { margin: 10px 0 0; font-size: .95rem; border-left: 3px solid var(--brass); padding-left: 10px }
.sheet { position: fixed; inset: auto 0 0 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.18);
  max-height: 62vh; overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px }
.lines-list { display: flex; flex-direction: column; gap: 4px; margin-top: 12px }
.lines-list button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-weight: 600; display: flex; gap: 8px; align-items: center }
.lines-list button.cur { border-color: var(--accent); color: var(--accent) }
.lines-list .k { font-family: var(--f-mono); color: var(--muted); font-size: .85rem; min-width: 2ch }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35) }
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .tv { grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "prog prog" "board card" "board side" "board bar"; column-gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) }
  .tv-card { height: auto; max-height: 40vh; margin: 0 14px 10px 0 }
  .tv-side { display: block; padding: 0 14px 10px 0 }
  .tv-bar { border: 1px solid var(--line); border-radius: 12px; margin-right: 14px }
  .tv-boardarea { padding: 0 10px 0 16px }
  .only-narrow { display: none !important }
}

.opt { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); margin: 2px 0 8px; cursor: pointer }
.opt input { width: 18px; height: 18px; accent-color: var(--accent) }
.foot { margin-top: 36px; font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center }
.confirm { display: inline-flex; gap: 8px; align-items: center }
.queue-info { font-size: .88rem; color: var(--muted) }
.legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: .85rem; color: var(--muted); align-items: center }
</style>

<script>
const OPENINGS = [{"id":"italiana","name":"Apertura Italiana","side":"w","eco":"C50–C59","group":"1.e4 e5","blurb":"Desarrollo rápido, alfil a c4 apuntando a f7 y lucha por el centro con c3 y d4.","lines":[{"id":"giuoco-pianissimo","name":"Giuoco Pianissimo (4.c3 y d3)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1 a6 Bb3 Ba7 Nbd2 Re8 Nf1","idea":"Juego lento: preparar Cbd2-f1-g3 y avanzar d4 cuando el centro esté listo.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde con simetría, disputando el centro y liberando su alfil de f8.","Desarrollamos el caballo atacando el peón de e5 y preparando el enroque corto.","Las negras defienden e5 con el caballo, la respuesta más natural y sólida.","El alfil a c4 apunta a f7, el punto más débil del campo negro, defendido sólo por el rey.","Giuoco Piano: el alfil negro copia la idea, apunta a f2 y controla la casilla d4.","Preparamos d4 para levantar un gran centro y abrimos la diagonal b3 como retirada para nuestro alfil.","Las negras desarrollan el caballo atacando e4; ahora ese peón necesita protección.","Defendemos e4 con calma. Es el Pianissimo: no abrimos todavía, sino que maniobramos y preparamos d4 más adelante.","El rival refuerza e5 y abre la diagonal de su alfil de c8.","Ponemos el rey a salvo y conectamos la torre de f1 con el juego central.","Las negras también enrocan; la posición es tranquila y estratégica, con mucho juego de maniobras.","La torre a e1 refuerza e4 y deja libre f1 para la maniobra del caballo Cbd2-f1-g3.","Las negras crean un refugio en a7 para su alfil, evitando que lo ataquemos ganando tiempo con d4 o b4.","Retiramos el alfil a b3 de forma preventiva: así ...b5 o ...d5 no lo atacan con tiempo y sigue mirando a f7.","El alfil negro se esconde en a7, donde sigue apuntando a f2 y ya no lo pueden atacar nuestros peones.","Desarrollamos el último caballo por d2, sin tapar el peón de c3, para llevarlo a f1 y luego a g3.","El rival también refuerza su centro con la torre en e8, apoyando el peón de e5.","El caballo sigue su ruta hacia g3, donde vigilará f5 y h5. Con todo en su sitio prepararemos d4 o un ataque en el flanco de rey."]},{"id":"giuoco-piano-d4","name":"Giuoco Piano, 4.c3 Nf6 5.d4","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 d5 exd5 Nxd5 Qb3 Nce7 O-O O-O Rfe1 c6 a4","idea":"Centro clásico e4-d4. Las negras lo desafían de inmediato con ...d5 y nosotros jugamos con el peón aislado y piezas activas.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde con simetría, disputando el centro y liberando su alfil de f8.","Desarrollamos el caballo atacando el peón de e5 y preparando el enroque corto.","Las negras defienden e5 con el caballo, la respuesta más natural y sólida.","El alfil a c4 apunta a f7, el punto más débil del campo negro, defendido sólo por el rey.","Giuoco Piano: el alfil negro copia la idea, apunta a f2 y controla la casilla d4.","Preparamos d4 para ganar el centro con tiempo, atacando después al alfil de c5.","Las negras contraatacan e4. Ahora jugamos d4 directamente, sin perder tiempo en defenderlo.","Rompemos en el centro: si las negras cambian, nos quedamos con dos peones centrales y el alfil de c5 será atacado.","El rival cambia, lo más sencillo. Si ...Ab6?, d5 gana espacio y deja débil el peón de e5.","Recapturamos con el peón de c, formando el centro ideal e4-d4. El alfil de c5 está atacado y debe moverse.","Las negras dan jaque para no retroceder pasivamente y molestar nuestro desarrollo.","Cubrimos con el alfil, la opción sólida. Con Cc3 entraríamos en el Ataque Möller, mucho más afilado.","El rival cambia los alfiles para simplificar y reducir nuestra presión en el centro.","Recapturamos con el caballo, que protege e4 y sigue desarrollándose hacia el centro.","La ruptura clave: las negras atacan el centro antes de que lo consolidemos con e5 o d5.","Cambiamos para no per 8. Nuestras piezas son activas y el peón de d4 negro será un objetivo."]},{"id":"max-lange","name":"Ataque Max Lange (4.d4 exd4 5.O-O Ac5 6.e5)","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 d4 exd4 O-O Bc5 e5 d5 exf6 dxc4 Re1+ Be6 Ng5 Qd5 Nc3 Qf5 Nce4 O-O-O g4","idea":"Una de las líneas más tácticas: clavamos el alfil de e6 en la columna e y atacamos con Cg5, Cc3-e4 y g4.","notes":["Abrimos con el peón de rey: ocupamos el centro y liberamos la dama y el alfil de f1.","El rival responde con simetría, disputando el centro y liberando su alfil de f8.","Desarrollamos el caballo atacando el peón de e5 y preparando el enroque corto.","Las negras defienden e5 con el caballo, la respuesta más natural y sólida.","El alfil a c4 apunta a f7, el punto más débil del campo negro, defendido sólo por el rey.","Defensa de los Dos Caballos: en lugar de ...Ac5, las negras atacan de inmediato nuestro peón de e4.","Abrimos el centro aprovechando que el peón de e5 está atacado. Buscamos actividad inmediata.","El rival captura el peón, la respuesta natural; nosotros no lo recuperamos todavía y seguimos desarrollándonos.","Enrocamos sin recuperar el peón: primero el rey a salvo y la torre lista para la columna e.","Las negras defienden el peón de d4 con el alfil. Así entramos en el Ataque Max Lange.","Atacamos al caballo de f6, que no tiene buenas casillas a las que retirarse.","La respuesta correcta: contraataca nuestro alfil. Retirar el caballo perdería demasiado tiempo.","Capturamos el caballo: de momento tenemos una pieza de más.","El rival recupera la pieza tomando nuestro alfil. Seguimos con un peón menos, pero el rey negro está en el centro.","Jaque en la columna e, aprovechando que el rey negro todavía no ha enrocado.","Las negras cubren con el alfil, la mejor interposición.","El caballo ataca al alfil de e6, clavado por la torre. Amenazamos Cxe6 fxe6 y Txe6+.","La dama defiende el alfil de e6 y protege a la vez los peones de c4 y d4.","Desarrollamos con tiempo atacando la dama, que debe seguir
